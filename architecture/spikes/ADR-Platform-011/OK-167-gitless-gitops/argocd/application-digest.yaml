# Digest-pinned Application for T4. make app-digest supplies DIGEST_PLACEHOLDER.
# A digest fixes artifact identity, not retention. Keep a retained release tag or
# a tested retention policy, and restrict who may change the Application source.
# Production promotion should commit an approved digest through a reviewed process.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ok167-podinfo-digest
  namespace: argocd
spec:
  project: ok167
  source:
    repoURL: oci://zot.zot.svc.cluster.local:5000/openkubes/machine/gitops/podinfo-manifests
    targetRevision: DIGEST_PLACEHOLDER
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: ok167-digest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
