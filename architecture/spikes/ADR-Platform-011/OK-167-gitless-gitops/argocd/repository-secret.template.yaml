# TEMPLATE ONLY — placeholders, never real values.
#
# This file documents the shape of the Secret that tells Argo CD how to reach
# the zot repository. The actual Secret is built in memory by
# `make argocd-repo REPO=<name>` from .local/credentials.env and piped straight
# into kubectl, so no password ever reaches a tracked file.
#
# Production path (ADR-011 Secret Contract, datacenter profile = ADR-025):
# Vault holds the machine credential and the Vault Secrets Operator renders
# exactly this Secret, with this label, into the argocd namespace. Git then
# holds the VaultStaticSecret reference, not the value — which is the contract:
# "Git is the source of truth for the declarative references and reconciliation
# configuration of secret material — but not necessarily for the secret values
# themselves."
---
apiVersion: v1
kind: Secret
metadata:
  name: ok167-zot-<repository-name>
  namespace: argocd
  labels:
    # Without this label Argo CD ignores the Secret entirely.
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  # `oci` is the type for an OCI repository source. Note there is no `project`
  # field: the AppProject restricts which repositories an Application may use
  # through its sourceRepos list instead.
  type: oci
  # The in-cluster service name and port. Not the NodePort — that is only for
  # the host-side publisher.
  url: oci://zot.zot.svc.cluster.local:5000/openkubes/machine/gitops/<repository-name>
  # Read-only identity. The publisher credential must never be given to Argo CD
  # (ADR-028 section 4.5: separate identities for publish and cluster pull).
  username: gitops-puller
  password: <from-secret-store>
  # insecure / insecureOCIForceHttp are deliberately absent. TLS trust comes
  # from argocd-tls-certs-cm, keyed by hostname without port.
