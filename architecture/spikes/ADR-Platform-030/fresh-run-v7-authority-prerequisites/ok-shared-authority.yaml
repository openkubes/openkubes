apiVersion: v1
kind: ServiceAccount
metadata:
  name: ok147-gitops-writer
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ok147-fresh-run-v7-gitops-writer
  namespace: argocd
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - disposable-ok141-cluster
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - argoproj.io
  resources:
  - appprojects
  resourceNames:
  - openkubes-disposable
  verbs:
  - get
- apiGroups:
  - argoproj.io
  resources:
  - appprojects
  verbs:
  - create
- apiGroups:
  - argoproj.io
  resources:
  - applications
  resourceNames:
  - disposable-ok141-observability-alerting
  - disposable-ok141-observability-core
  - disposable-ok141-observability-dashboards
  verbs:
  - get
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ok147-fresh-run-v7-gitops-writer
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ok147-fresh-run-v7-gitops-writer
subjects:
- kind: ServiceAccount
  name: ok147-gitops-writer
  namespace: argocd
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ok147-fresh-run-v7-gitops-writer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - secrets
      scope: Namespaced
    - apiGroups:
      - argoproj.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      resources:
      - appprojects
      - applications
      scope: Namespaced
  validations:
  - expression: request.userInfo.username != 'system:serviceaccount:argocd:ok147-gitops-writer'
      || (request.namespace == 'argocd' && ((request.resource.group == '' && request.resource.resource
      == 'secrets' && object.metadata.name == 'disposable-ok141-cluster') || (request.resource.group
      == 'argoproj.io' && request.resource.resource == 'appprojects' && object.metadata.name
      == 'openkubes-disposable') || (request.resource.group == 'argoproj.io' && request.resource.resource
      == 'applications' && (object.metadata.name == 'disposable-ok141-observability-alerting'
      || object.metadata.name == 'disposable-ok141-observability-core' || object.metadata.name
      == 'disposable-ok141-observability-dashboards'))))
    message: Fresh-Run-v7 GitOps writer is restricted to exact disposable objects
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ok147-fresh-run-v7-gitops-writer
spec:
  policyName: ok147-fresh-run-v7-gitops-writer
  validationActions:
  - Deny
