      - no workload registration Secret or non-installation Argo custom resource exists
      - every candidate object UID belongs to the accepted M0b-I submission
      - no foreign owner or dependent resource is observed
      - raw evidence is retained before rollback
    unsafeResponse: STOP-AND-TRANSFER-TO-RECOVERY-AUTHORITY
    rule: Rollback must never delete Argo CRDs containing target or platform desired state.
  stopConditions:
