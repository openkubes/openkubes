roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ok141-m0a-installer-v7-1}
subjects:
  - {kind: ServiceAccount, name: ok141-m0a-installer-v7-1, namespace: openkubes-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ok141-m0a-installer-v7-1
  labels: {openkubes.io/ticket: OK-141, openkubes.io/gate: M0A-C1-v7.1}
rules:
  - {apiGroups: [apiextensions.k8s.io], resources: [customresourcedefinitions], verbs: [create]}
  - {apiGroups: [admissionregistration.k8s.io], resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations], verbs: [create]}
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [helmchartproxies.addons.cluster.x-k8s.io, helmreleaseproxies.addons.cluster.x-k8s.io]
