apiVersion: v1
kind: ServiceAccount
metadata:
  name: ok141-m0a-installer-v7-1
  namespace: openkubes-system
  labels: {openkubes.io/ticket: OK-141, openkubes.io/gate: M0A-C1-v7.1}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ok141-m0a-installer-v7-1
