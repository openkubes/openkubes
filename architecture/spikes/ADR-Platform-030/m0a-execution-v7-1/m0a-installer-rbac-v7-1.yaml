rules:
  - {apiGroups: [""], resources: [serviceaccounts, configmaps, services], verbs: [create]}
  - {apiGroups: [apps], resources: [deployments], verbs: [create]}
  - {apiGroups: [cert-manager.io], resources: [certificates, issuers], verbs: [create]}
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [caaph-controller-manager]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [caaph-manager-config]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [caaph-controller-manager-metrics-service, caaph-webhook-service]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [caaph-controller-manager]
    verbs: [get]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames: [caaph-serving-cert]
    verbs: [get]
  - apiGroups: [cert-manager.io]
    resources: [issuers]
    resourceNames: [caaph-selfsigned-issuer]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ok141-m0a-installer-v7-1
  namespace: caaph-system
