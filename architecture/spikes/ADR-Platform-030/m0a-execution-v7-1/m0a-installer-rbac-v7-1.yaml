  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: [caaph-mutating-webhook-configuration]
    verbs: [get]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    resourceNames: [caaph-validating-webhook-configuration]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ok141-m0a-installer-v7-1
  labels: {openkubes.io/ticket: OK-141, openkubes.io/gate: M0A-C1-v7.1}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ok141-m0a-installer-v7-1}
subjects:
  - {kind: ServiceAccount, name: ok141-m0a-installer-v7-1, namespace: openkubes-system}

