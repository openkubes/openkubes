apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ok141-m0a-installer-v7-1.openkubes.io
  labels:
    openkubes.io/ticket: OK-141
    openkubes.io/gate: M0A-A1-v7.1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts", "configmaps", "services"]
      - apiGroups: ["apiextensions.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["customresourcedefinitions"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["deployments"]
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["certificates", "issuers"]
      - apiGroups: ["admissionregistration.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
  matchConditions:
    - name: exact-installer-principal
      expression: request.userInfo.username == 'system:serviceaccount:openkubes-system:ok141-m0a-installer-v7-1'
  validations:
    - expression: "[{'group':'apiextensions.k8s.io','resource':'customresourcedefinitions','name':'helmchartproxies.addons.cluster.x-k8s.io'},{'group':'apiextensions.k8s.io','resource':'customresourcedefinitions','name':'helmreleaseproxies.addons.cluster.x-k8s.io'},{'group':'admissionregistration.k8s.io','resource':'mutatingwebhookconfigurations','name':'caaph-mutating-webhook-configuration'},{'group':'admissionregistration.k8s.io','resource':'validatingwebhookconfigurations','name':'caaph-validating-webhook-configuration'}].exists(x, request.resource.group == x.group && request.resource.resource == x.resource && object.metadata.name == x.name) || [{'group':'','resource':'serviceaccounts','namespace':'caaph-system','name':'caaph-controller-manager'},{'group':'','resource':'configmaps','namespace':'caaph-system','name':'caaph-manager-config'},{'group':'','resource':'services','namespace':'caaph-system','name':'caaph-controller-manager-metrics-service'},{'group':'','resource':'services','namespace':'caaph-system','name':'caaph-webhook-service'},{'group':'apps','resource':'deployments','namespace':'caaph-system','name':'caaph-controller-manager'},{'group':'cert-manager.io','resource':'certificates','namespace':'caaph-system','name':'caaph-serving-cert'},{'group':'cert-manager.io','resource':'issuers','namespace':'caaph-system','name':'caaph-selfsigned-issuer'}].exists(x, request.resource.group == x.group && request.resource.resource == x.resource && (has(request.namespace) ? request.namespace : '') == x.namespace && object.metadata.name == x.name)"
      message: OK-141 M0a v7.1 permits only the reviewed installer identities.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ok141-m0a-installer-v7-1.openkubes.io
  labels:
    openkubes.io/ticket: OK-141
    openkubes.io/gate: M0A-A1-v7.1
spec:
  policyName: ok141-m0a-installer-v7-1.openkubes.io
  validationActions: [Deny]

