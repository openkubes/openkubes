apiVersion: v1
kind: ServiceAccount
metadata:
  name: ok141-m0a-installer
  namespace: openkubes-system
  labels:
    openkubes.io/ticket: OK-141
    openkubes.io/gate: M0A-C1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ok141-m0a-installer
  labels:
    openkubes.io/ticket: OK-141
    openkubes.io/gate: M0A-C1
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["caaph-system"]
    verbs: ["get", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - helmchartproxies.addons.cluster.x-k8s.io
      - helmreleaseproxies.addons.cluster.x-k8s.io
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["caaph-controller-manager"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["caaph-manager-config"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames:
      - caaph-controller-manager-metrics-service
      - caaph-webhook-service
    verbs: ["get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["caaph-leader-election-role"]
    verbs: ["get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["caaph-leader-election-rolebinding"]
    verbs: ["get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - caaph-manager-role
      - caaph-metrics-auth-role
      - caaph-metrics-reader
    verbs: ["get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames:
      - caaph-manager-rolebinding
      - caaph-metrics-auth-rolebinding
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["caaph-controller-manager"]
    verbs: ["get", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    resourceNames: ["caaph-serving-cert"]
    verbs: ["get", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers"]
    resourceNames: ["caaph-selfsigned-issuer"]
    verbs: ["get", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: ["caaph-mutating-webhook-configuration"]
    verbs: ["get", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["caaph-validating-webhook-configuration"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ok141-m0a-installer
  labels:
    openkubes.io/ticket: OK-141
    openkubes.io/gate: M0A-C1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ok141-m0a-installer
subjects:
  - kind: ServiceAccount
    name: ok141-m0a-installer
    namespace: openkubes-system
