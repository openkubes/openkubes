apiVersion: test.openkubes.io/v1alpha1
kind: CredentialGateProtocol
metadata:
  name: ok141-m0a-installer-credential-v1
  ticket: OK-141
spec:
  protocolVersion: ok141-m0a-c1/v1
  protocolState: BLOCKED
  purpose: issue-one-short-lived-least-privilege-credential-for-the-exact-m0a-installation
  references:
    finalPreflight:
      path: ../m0a-final-preflight/m0a-final-preflight-v1.yaml
      digest: sha256:d4920eeef6671163189c40e49317ddb01474c34d1dc7debef15e46e4a8f39687
    installationProtocol:
      path: ../m0a-installation/m0a-installation-v1.yaml
      digest: sha256:873d3aa3b15df53d3a4055675288c6d9acdf6c18d4f850e181a4eb7b93fc4a27
    boundedInstaller:
      path: ../installation-closure/bounded_installer.py
      digest: sha256:8b4ab9929c7bbea98366bc26a26a490f8153f50b3983ca19ee2c7fa74ee48e98
  target:
    plane: ok-mgmt
    apiServer: https://192.168.100.200:6443
    kubeSystemNamespaceUID: c3b45aab-d2a1-4e64-8f12-77b99186ad4a
    kubernetesVersion: v1.34.1
    platform: linux/amd64
  bootstrapIdentity:
    principal: kubernetes-admin
    group: system:masters
    allowedUse: create-and-revoke-exact-credential-bootstrap-objects-only
    installationUseAllowed: false
    interactiveUseAllowed: false
  credentialObjects:
    manifestPath: m0a-installer-rbac-v1.yaml
    rawDigest: sha256:d78c73dd3a22695c068c50574567aa5c412c1e41d64d698a42c655122460d514
    semanticDigest: sha256:30ff9a73adb8823a244040a029e71b89bc79f980b10ba5cc6950d530f831558f
    objectCount: 3
    serviceAccount: openkubes-system/ok141-m0a-installer
    clusterRole: ok141-m0a-installer
    clusterRoleBinding: ok141-m0a-installer
    fieldManager: openkubes-ok141-m0a-credential
  installerCredential:
    identity: system:serviceaccount:openkubes-system:ok141-m0a-installer
    mechanism: TokenRequest
    requestedDuration: 60m
    maximumDuration: 60m
    audience: https://kubernetes.default.svc
    persisted: false
    emittedToLogs: false
    emittedToEvidence: false
    temporaryKubeconfigMode: "0600"
    temporaryKubeconfigDeleteAfterRun: true
    revokeByDeletingServiceAccount: true
  permissionModel:
    allowedVerbs: [get, patch]
    allowedObjectNames: 19
    freeFormShellAllowed: false
    arbitraryResourceAllowed: false
    secretsAllowed: false
    tokenRequestByInstallerAllowed: false
    impersonationAllowed: false
    escalationAllowed: false
    bindAllowed: false
    limitation: Resource names constrain the request target but cannot prove submitted object-content identity; server-side apply uses PATCH to materialize absent objects, and the temporary ClusterRole cannot namespace-limit same-named namespaced targets before caaph-system exists.
    compensatingControl: The digest-bound bounded installer re-verifies the exact 19-object payload immediately before server-side apply.
  phases:
    - id: M0A-C1-G0
      name: refresh-target-and-prove-bootstrap-objects-absent
      mutating: false
      enabled: false
    - id: M0A-C1-G1
      name: apply-exact-three-object-credential-bootstrap-set
      mutating: true
      enabled: false
    - id: M0A-C1-G2
      name: request-token-and-run-positive-negative-authorization-probes
      mutating: true
      enabled: false
    - id: M0A-C1-G3
      name: hand-credential-to-exact-bounded-installer-process
      mutating: false
      enabled: false
    - id: M0A-C1-G4
      name: revoke-token-and-delete-exact-bootstrap-set
      mutating: true
      enabled: false
    - id: M0A-C1-G5
      name: verify-revocation-and-retain-redacted-evidence
      mutating: false
      enabled: false
  authorizationProbes:
    positive:
      - get-and-patch-only-each-exact-name-in-the-reviewed-19-object-set
    negative:
      - cannot-create-list-watch-update-delete-or-deletecollection-any-resource
      - cannot-read-or-write-Secrets
      - cannot-impersonate-bind-escalate-or-request-its-own-token
      - cannot-get-or-patch-an-unrelated-Namespace-CRD-RBAC-object-workload-or-webhook
    failureEffect: STOP-REVOKE-NOT-SUCCESS
  lifecycle:
    precondition: all-three-bootstrap-objects-absent
    issuanceEvidence:
      - exact protocol and credential-manifest digests
      - target kube-system UID
      - bootstrap object UIDs and creation timestamps
      - token requestedAt expiresAt audience and subject without token material
      - positive and negative authorization-probe outcomes
    revocationEvidence:
      - exact bootstrap object UIDs deleted
      - ServiceAccount TokenRequest no longer authenticates
      - temporary kubeconfig deleted
      - no token Secret exists
    unsafeResponse: STOP-AND-REVOKE
  unresolvedDecisions:
    - M0AI-COMPATIBILITY-RISK
    - M0AI-CONTROLLER-RBAC-RISK
    - M0A-C1-CREDENTIAL-GRANT
    - M0AI-INSTALLATION-GRANT
  authorization:
    decision: NO-GO
    mutationAuthorized: false
    credentialBootstrapGranted: false
    tokenIssuanceGranted: false
    m0aInstallationGranted: false
    authorizedProtocolDigest: null
    grantID: null
    authority: github:arashkaffamanesh
    decidedAt: null
    validFrom: null
    validUntil: null
  stopConditions:
    - target identity or any referenced digest differs
    - any bootstrap object already exists
    - any requested permission object name verb subject audience or duration differs
    - any negative authorization probe succeeds or positive probe fails
    - any same-named namespaced target outside caaph-system exists or changes during the credential window
    - token material reaches stdout logs evidence Git or a persistent file
    - revocation cannot be proven immediately after the bounded run
    - any target resource HCP HRP GO-1 deletion rollback failure injection or unrelated mutation is proposed
  rules:
    - This protocol is a reviewable candidate and grants no authority.
    - Credential bootstrap and revocation are mutations requiring one exact separately authorized digest and window.
    - The credential may be handed only to the exact bounded installer process for the exact M0a installation protocol.
    - A credential grant does not grant M0a-I and an M0a-I grant cannot retroactively grant credential issuance.
    - Secrets kubeconfigs tokens private keys and certificate payloads are forbidden from Git logs and evidence.
    - M0a-I M0b-I GO-1 infrastructure mutation and failure injection remain NO-GO.
