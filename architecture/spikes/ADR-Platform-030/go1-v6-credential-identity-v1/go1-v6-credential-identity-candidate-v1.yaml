    - {targetPlane: ok-mgmt, path: /Users/arash/.kube/ok-mgmt.yaml, identityState: UNRESOLVED}
    - {targetPlane: ok-shared, path: /Users/arash/.kube/ok-shared.yaml, identityState: UNRESOLVED}
