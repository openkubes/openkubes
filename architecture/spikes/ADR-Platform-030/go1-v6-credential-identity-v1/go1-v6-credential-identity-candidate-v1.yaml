apiVersion: security.openkubes.io/v1alpha1
kind: GO1V6CredentialIdentityCandidate
metadata:
  name: ok141-go1-v6-credential-identity-v1
  ticket: OK-141
  baseCommit: d977e85
spec:
  version: ok141-go1-v6-credential-identity/v1
  state: OFFLINE-PROVEN-BLOCKED-NO-GO
  sourcePreflight:
    path: ../go1-v6-preflight-v1/go1-v6-preflight-candidate-v1.yaml
    digest: sha256:5b1eb87734b16e84fdd395368b4bf8cc0aa498ff9620241b2b36f6fc9530721f
  tool:
