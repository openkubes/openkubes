apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ok141-m0a-installer-v2.openkubes.io
  labels:
    openkubes.io/ticket: OK-141
    openkubes.io/gate: M0A-C1-v2
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces", "serviceaccounts", "configmaps", "services"]
      - apiGroups: ["apiextensions.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["customresourcedefinitions"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["deployments"]
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["certificates", "issuers"]
      - apiGroups: ["admissionregistration.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
  matchConditions:
    - name: exact-installer-principal
      expression: request.userInfo.username == 'system:serviceaccount:openkubes-system:ok141-m0a-installer-v2'
  validations:
    - expression: >-
        [
          {'group':'','resource':'namespaces','namespace':'','name':'caaph-system'},
          {'group':'apiextensions.k8s.io','resource':'customresourcedefinitions','namespace':'','name':'helmchartproxies.addons.cluster.x-k8s.io'},
          {'group':'apiextensions.k8s.io','resource':'customresourcedefinitions','namespace':'','name':'helmreleaseproxies.addons.cluster.x-k8s.io'},
          {'group':'','resource':'serviceaccounts','namespace':'caaph-system','name':'caaph-controller-manager'},
          {'group':'rbac.authorization.k8s.io','resource':'roles','namespace':'caaph-system','name':'caaph-leader-election-role'},
          {'group':'rbac.authorization.k8s.io','resource':'clusterroles','namespace':'','name':'caaph-manager-role'},
          {'group':'rbac.authorization.k8s.io','resource':'clusterroles','namespace':'','name':'caaph-metrics-auth-role'},
          {'group':'rbac.authorization.k8s.io','resource':'clusterroles','namespace':'','name':'caaph-metrics-reader'},
          {'group':'rbac.authorization.k8s.io','resource':'rolebindings','namespace':'caaph-system','name':'caaph-leader-election-rolebinding'},
          {'group':'rbac.authorization.k8s.io','resource':'clusterrolebindings','namespace':'','name':'caaph-manager-rolebinding'},
          {'group':'rbac.authorization.k8s.io','resource':'clusterrolebindings','namespace':'','name':'caaph-metrics-auth-rolebinding'},
          {'group':'','resource':'configmaps','namespace':'caaph-system','name':'caaph-manager-config'},
          {'group':'','resource':'services','namespace':'caaph-system','name':'caaph-controller-manager-metrics-service'},
          {'group':'','resource':'services','namespace':'caaph-system','name':'caaph-webhook-service'},
          {'group':'apps','resource':'deployments','namespace':'caaph-system','name':'caaph-controller-manager'},
          {'group':'cert-manager.io','resource':'certificates','namespace':'caaph-system','name':'caaph-serving-cert'},
          {'group':'cert-manager.io','resource':'issuers','namespace':'caaph-system','name':'caaph-selfsigned-issuer'},
          {'group':'admissionregistration.k8s.io','resource':'mutatingwebhookconfigurations','namespace':'','name':'caaph-mutating-webhook-configuration'},
          {'group':'admissionregistration.k8s.io','resource':'validatingwebhookconfigurations','namespace':'','name':'caaph-validating-webhook-configuration'}
        ].exists(x,
          request.resource.group == x.group &&
          request.resource.resource == x.resource &&
          request.namespace == x.namespace &&
          object.metadata.name == x.name)
      message: OK-141 M0a v2 permits only the reviewed CAAPH object identities.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ok141-m0a-installer-v2.openkubes.io
  labels:
    openkubes.io/ticket: OK-141
    openkubes.io/gate: M0A-C1-v2
spec:
  policyName: ok141-m0a-installer-v2.openkubes.io
  validationActions: [Deny]
