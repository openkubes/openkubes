    disposableCluster: Preserve the object graph and evidence on STOP; GO-1 does not authorize deletion.
    cleanup: A later separately reviewed delete protocol and authorization are required.
    executorFailure: An accepted desired transition remains authoritative; executor failure is not injected by GO-1.
  acceptance:
