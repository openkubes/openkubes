    workflowDeploymentAuthorized: false
    workflowDispatchAuthorized: false
    artifactWriteAuthorized: false
    publisherDispatchAuthorized: false
    packageWriteAuthorized: false
    infrastructureMutationAuthorized: false
    go1Granted: false
  rules:
    - The collector candidate is inert and cannot access a cluster or publish to GHCR.
    - C0 C1 and P0 are separate gates and no earlier gate authorizes a later gate.
    - Only evidence already merged into main at the exact intake commit is eligible.
    - C0 C1 P0 GO-1 infrastructure mutation and failure injection remain NO-GO.
