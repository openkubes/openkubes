    secretEvidenceRejected: true
    unreviewedPathRejected: true
    workflowDeployed: false
    workflowDispatched: false
    artifactUploaded: false
    publisherDispatched: false
  claimBoundaries:
    - The collector verifies committed intake identity and content integrity; it does not prove that the observation itself is truthful.
    - Intake evidence remains in Git history and therefore exceeds the separate 90-day GHCR best-effort retention claim.
    - Only already-redacted non-secret evidence may enter the reviewed intake path.
    - No GitHub-hosted runner receives a Kubernetes credential or direct cluster access under this model.
    - A successful collector run is only a P0 prerequisite and does not authorize the publisher.
  remainingGates:
    c0: Deploy and observe the exact collector workflow without dispatch.
    c1: Commit one exact reviewed redacted evidence intake and dispatch the collector under a separate authorization.
    p0: Bind the successful C1 run to an exact publisher authorization.
  authorization:
