    endpoint: /api/v1/namespaces/kube-system/serviceaccounts/ok141-argocd-manager/token
    apiVersion: authentication.k8s.io/v1
    audience: RUNTIME-EXACT-GRANT-BOUND
    expirationSeconds: 10800
    responseExpirationValidated: true
    nativeArgoRotationClaimed: false
    tokenDigestRetained: false
  antiReplay:
    model: burn-before-use-exclusive-consumption-receipt
    receiptCreation: O_CREAT-O_EXCL
    receiptMode: "0600"
    stateWrittenBeforeTokenRequest: CONSUMED-BEFORE-TOKENREQUEST
    tokenOrCAInReceipt: false
    secondAttemptWithSameReceipt: fail-closed
    failedAttemptConsumesGrant: true
    receiptDeletionPreventedByUtility: false
    productionDurabilityClaimed: false
    limitation: The receipt proves one attempt only while the bounded external evidence location remains intact; deletion or replacement is outside this utility's authority.
  credentialHandling:
    kubectlResponseCapturedInMemory: true
    rawKubectlOutputPrinted: false
    shellExecution: false
    tokenSink: inherited-anonymous-pipe-or-socket-only
    regularFileTokenSinkAccepted: false
    stdoutOrStderrTokenSinkAccepted: false
    tokenBytesInGitLogsReceiptOrEvidence: forbidden
    tokenBytesZeroedAfterPipeWrite: best-effort-python-reference-drop
    cryptographicMemoryErasureClaimed: false
  grantRequirements:
    decision: GO
    tokenRequestGranted: true
    antiReplayReceiptGranted: true
    exactCandidateDigest: required
    maximumRuns: 1
    exactWindow: required
    exactServiceAccount: required
    exactAudience: required
    exactExpirationSeconds: required
    capiClusterUID: required-runtime-bound
    workloadKubeSystemUID: required-runtime-bound
    workloadAPICAFingerprint: required-runtime-bound
  offlineEvidence:
    exactGrantPasses: PASS
    multiRunGrantFailsClosed: PASS
    unboundRuntimeIdentityFailsClosed: PASS
    wrongAudienceFailsClosed: PASS
    receiptCreatedMode0600: PASS
    receiptContainsNoToken: PASS
    duplicateReceiptFailsClosed: PASS
    tokenResponseParsedInMemory: PASS
    tokenTransferredThroughPipe: PASS
    tokenAbsentFromStdoutStderrReceipt: PASS
    replayProducesNoToken: PASS
    shellAndTokenDigestAbsent: PASS
  unresolvedBeforeExecutionCandidate:
