  scope:
    included:
      - validate an exact one-run grant and runtime target identity
      - create a mode-0600 consumption receipt with O_EXCL before issuing a token
      - send one bounded TokenRequest through kubectl standard input
      - capture the TokenRequest response without printing raw subprocess output
