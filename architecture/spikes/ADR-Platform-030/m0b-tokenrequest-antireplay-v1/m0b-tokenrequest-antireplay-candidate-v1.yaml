    - observe the target API audience and bind it in the exact grant
    - bind a local independent evidence directory and its DEV non-WORM retention claim
    - wire the anonymous token pipe directly to the reviewed registration materializer
    - add execution evidence proving exactly one receipt and one TokenRequest attempt
    - reobserve CAPI UID workload UID CA endpoint NetworkReady and test-window authority
  authorization:
    decision: NO-GO
    mutationAuthorized: false
    antiReplayReceiptGranted: false
    targetCredentialUseGranted: false
    tokenRequestGranted: false
    tokenPipeGranted: false
    materializerExecutionGranted: false
    targetAccessGranted: false
    registrationGranted: false
    applicationSubmissionGranted: false
    retryGranted: false
    rollbackOrCleanupGranted: false
    evidencePublicationGranted: false
    go1Granted: false
    failureInjectionGranted: false
  rules:
    - Offline proof uses synthetic credentials only and grants no runtime or cluster authority.
    - A failed post-consumption attempt burns the one-run grant and requires a new reviewed grant; retry is forbidden.
    - Best-effort Python reference dropping is not a claim of cryptographic memory erasure.
    - This utility issues a bounded credential but owns no lifecycle or Platform reconciliation semantics.
