apiVersion: security.openkubes.io/v1alpha1
kind: GO1LCredentialBoundary
metadata:
  name: ok141-go1-l-credential-boundary-v1
  ticket: OK-141
  baseCommit: c4dd4ef7b4bdc1da02c255bf49e659cec4dbed4a
spec:
  version: ok141-go1-l-credential-boundary/v1
  state: ANALYZED-BLOCKED-NO-GO
  sourceSubmitter:
    path: ../go1-l-submitter-v1/go1-l-submitter-candidate-v1.yaml
    digest: sha256:e5b4185b7dcd4f1e3fb026d03ce29b5b35e0b6c5c6e51f29d921a240636b73cc
    transport: CreateReviewedObjectSet
    operations: 3
    objects: 12
  authoritativeFinding:
    source: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-resources
    statement: Kubernetes RBAC cannot restrict a top-level create request by resourceName because the new object name may not be known at authorization time.
    nativeRBACCanEnforceExactObjectNamesOnCreate: false
    nativeRBACCanEnforceExactObjectContentOnCreate: false
    permissionsAreAdditiveWithoutDenyRules: true
  operationExposure:
    - id: provider-prerequisites
      targetPlane: ok-infra
      clusterScopedCreate:
        - core/namespaces
      namespacedCreate:
        - rbac.authorization.k8s.io/roles in ok-images
        - rbac.authorization.k8s.io/rolebindings in ok-images
      exactNameEnforcedByNativeRBAC: false
      exactContentEnforcedByNativeRBAC: false
    - id: capi-lifecycle
      targetPlane: ok-mgmt
      clusterScopedCreate:
        - core/namespaces
      namespacedCreate:
        - cluster.x-k8s.io/clusters in disposable-ok141
        - infrastructure.cluster.x-k8s.io/kubevirtclusters in disposable-ok141
        - controlplane.cluster.x-k8s.io/taloscontrolplanes in disposable-ok141
        - bootstrap.cluster.x-k8s.io/talosconfigtemplates in disposable-ok141
        - cluster.x-k8s.io/machinedeployments in disposable-ok141
        - infrastructure.cluster.x-k8s.io/kubevirtmachinetemplates in disposable-ok141
      exactNameEnforcedByNativeRBAC: false
      exactContentEnforcedByNativeRBAC: false
    - id: helmchartproxy
      targetPlane: ok-mgmt
      clusterScopedCreate: []
      namespacedCreate:
        - addons.cluster.x-k8s.io/helmchartproxies in disposable-ok141
      exactNameEnforcedByNativeRBAC: false
      exactContentEnforcedByNativeRBAC: false
  bootstrapConstraint:
    namespaceScopedRoleCanExistBeforeTargetNamespace: false
    namespaceCreateNeedsClusterScopedAuthority: true
    precreateNamespaceWouldBeSeparateMutation: true
    submitterDigestAloneIsAuthorization: false
  candidateModels:
    - id: DEV-ADMIN-CREATE
      description: Use an administrator credential for one digest-bound Create-only operation and accept that Kubernetes authorization does not constrain request content.
      exactContentBoundary: trusted-submitter-plus-human-grant-only
      extraAdmissionMutationRequired: false
      riskAcceptanceRequired: true
      status: AVAILABLE-NOT-SELECTED
    - id: TEMPORARY-ADMISSION-PLUS-SCOPED-CREATE
      description: Install temporary per-plane admission rules that allow only the reviewed identities and fields, then use short-lived resource-scoped create credentials.
      exactContentBoundary: admission-plus-trusted-submitter
      extraAdmissionMutationRequired: true
      riskAcceptanceRequired: true
      status: AVAILABLE-NOT-SELECTED
    - id: PATCH-BY-NAME-PLUS-ADMISSION
      description: Change transport to named server-side PATCH and pair resourceNames RBAC with temporary admission; this would require a new submitter identity and protocol amendment.
      exactContentBoundary: resource-name-rbac-plus-admission
      extraAdmissionMutationRequired: true
      riskAcceptanceRequired: true
      status: REQUIRES-NEW-CANDIDATE
  decision:
    selectedModel: UNRESOLVED
    credentialIssuanceAuthorized: false
    admissionInstallationAuthorized: false
    administratorCredentialAuthorized: false
    go1LAuthorized: false
    rule: Do not issue a credential until one model is selected and bound to a fresh digest and explicit grant.
  conclusions:
    submitterArtifactProven: true
    nativeLeastPrivilegeCredentialSufficient: false
    newOpenKubesReconcilerRequired: false
    nextDecision: Select and explicitly accept either the DEV admin-content boundary or a temporary admission boundary before credential materialization.
  exclusions:
    - credential creation TokenRequest admission installation cluster contact or mutation
    - GO1-L GO-1 target registration Platform convergence retry rollback cleanup or failure injection
