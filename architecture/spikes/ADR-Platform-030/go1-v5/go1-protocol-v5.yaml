    - {id: RUNTIME-BINDING, class: runtime, status: BLOCKED-BY-DESIGN, closure: Complete and independently review the runtime-binding artifact only after lifecycle and NetworkReady.}
    - {id: TARGET-ACCESS-GRANT, class: authorization, status: BLOCKED-BY-RUNTIME, closure: Bind the exact eight-object target-access grant to the completed runtime-binding digest.}
    - {id: TOKEN-MATERIALIZER-GRANTS, class: authorization, status: BLOCKED-BY-RUNTIME, closure: Bind reciprocal single-run token and materializer grants to the bridge and completed runtime-binding digests.}
    - {id: PLATFORM-GRANT, class: authorization, status: BLOCKED-BY-RUNTIME, closure: Bind one exact three-Application grant to P and the completed runtime-binding digest.}
    - {id: TARGET-CAPABILITIES, class: runtime, status: BLOCKED-BY-RUNTIME, closure: Prove local-path availability and every required runtime Secret dependency before Platform submission.}
    - {id: RUNTIME-CAPABILITY, class: runtime, status: BLOCKED-BY-RUNTIME, closure: Bind OpenSearch retention and real alert-delivery acceptance evidence before PlatformReady.}
    - {id: OBSERVERS-AUTHORITIES, class: operational, status: BLOCKED, closure: Assign the exact test operator GO abort recovery and evidence-review authorities plus independent observers.}
    - {id: EVIDENCE-DESTINATION, class: operational, status: BLOCKED, closure: Bind the accepted redacted DEV evidence path timestamp limits and local raw evidence files for the exact window.}
    - {id: RECOVERY-ACCESS, class: operational, status: BLOCKED, closure: Reverify out-of-band access and the accepted rebuild-on-loss DEV boundary immediately before GO1-L.}
