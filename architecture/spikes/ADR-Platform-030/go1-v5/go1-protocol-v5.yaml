    - {id: G2, name: observe-lifecycle-convergence, mutating: false, gate: GO1-L, enabled: false}
    - {id: G3, name: submit-exact-hcp, mutating: true, gate: GO1-L, enabled: false}
    - {id: G4, name: observe-enablement-and-networkready, mutating: false, gate: GO1-L, enabled: false}
