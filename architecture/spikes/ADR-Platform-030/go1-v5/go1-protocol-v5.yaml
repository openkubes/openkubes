    - {id: G6, name: create-exact-target-access-set, mutating: true, gate: M0B-R-TA, enabled: false}
    - {id: G7, name: issue-token-and-create-registration, mutating: true, gate: M0B-R-TR-plus-M0B-R-RM, enabled: false}
    - {id: G8, name: verify-registration-and-runtime-correlation, mutating: false, gate: GO1-RUNTIME-PAUSE, enabled: false}
    - {id: G9, name: submit-exact-three-applications, mutating: true, gate: GO1-P, enabled: false}
    - {id: G10, name: observe-platform-convergence-and-capabilities, mutating: false, gate: GO1-P, enabled: false}
    - {id: G11, name: aggregate-verify-evidence-and-close, mutating: false, gate: GO1-P, enabled: false}
  expectedEvidence:
    lifecycle: [accepted object UIDs, field managers, current CAPI generations and Conditions, provider VM/VMI identity graph, endpoint allocation]
    workload: [kube-system UID, API endpoint and CA fingerprint, Node UIDs and providerIDs, exact Ready control-plane and worker count]
    enablement: [HCP and HRP UIDs plus owner chain, desired and observed E, registry and chart identity, Cilium rollout, current NetworkReady probes]
    runtimeBinding: [canonical completed artifact, digest, independent review, remaining wall-clock budget]
    registration: [target-access UIDs, consumption receipt digest, token expiration without token bytes, registration Secret UID, correlated target identity]
    platform: [exact Application UIDs and membership, desired and applied P, Synced and Healthy, local-path and capability evidence]
    aggregate: [bounded evaluator input digest, source freshness decisions, Ready result]
    bundle: [redacted artifact manifest, correlation manifest, final checksum, independent verification]
  stopConditions:
    - any FixtureDigest R E P object digest target plane runtime identity or grant correlation differs
    - any phase runs without its exact gate or any one-run grant receipt is reused
    - any unexpected object Application ApplicationSet target credential or lifecycle writer is observed
    - runtime binding contains a placeholder stale source conflict or different Cluster incarnation
    - less than 35 minutes remain upon entry to the runtime pause or its 15-minute decision deadline expires
    - any credential byte enters arguments environment Git logs stdout stderr or retained evidence
    - ok-mgmt ok-infra ok-shared storage network or an existing workload unexpectedly degrades
    - independent observation evidence timestamp credential or recovery confidence is lost
  stopResponse:
    - announce STOP through the bound communication channel
    - perform no later stage no retry no exploratory diagnosis and no cleanup
    - retain only allowed local raw evidence and verified redacted evidence
    - preserve the disposable object graph for a separately authorized decision
    - transfer control to assigned abort and recovery authorities
  recovery:
    preExistingPlanes: Rebuild-on-loss is accepted for DEV; out-of-band access must be freshly verified before GO1-L.
    disposableCluster: Preserve state on STOP because GO-1 v5 does not authorize deletion or finalizer changes.
    partialRegistration: Preserve target access AppProject registration and receipt evidence; cleanup requires a separate protocol and grant.
    executorFailure: Accepted desired-state transitions remain authoritative and controller reconciliation may continue.
  acceptance:
    successRequires:
      - exactly one GO1-L run creates the reviewed 3-plus-8 lifecycle set and one HCP
      - current CAPI CAPK CAAPH Cilium and workload evidence converges to R and E
      - one completed current runtime binding is independently reviewed before any M0b-R mutation
      - exact target access TokenRequest registration and three Applications run once under separate current gates
      - Argo converges exact P and independent Platform capabilities pass
      - bounded aggregation returns Ready=True from current correlated sources
      - the redacted evidence bundle verifies and contains no secret material
    processExitIsLifecycleSuccess: false
    historicalSuccessIsCurrentProof: false
    automaticPauseReleaseAllowed: false
    allPreRuntimeBlockersMustCloseBeforeGO1L: true
    allRuntimeBlockersMustCloseBeforePauseRelease: true
  exclusions:
    - failure injection drift retry rollback cleanup deletion upgrade scale or outage testing
    - long-lived production GitOps credential or native Argo TokenRequest rotation claim
    - OpenKubes repair of CAPI CAAPH Cilium Argo or Platform resources
    - accepting names endpoints annotations or historical success as current identity proof
