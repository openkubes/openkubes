    - {id: M0B-R4, name: verify-registration-and-immutable-correlation, mutating: false, enabled: false}
    - {id: M0B-R5, name: submit-exact-three-application-set, mutating: true, enabled: false}
    - {id: M0B-R6, name: observe-platform-convergence-and-platformready, mutating: false, enabled: false}
  blockers:
    - {id: TARGET-NOT-YET-CREATED, status: BLOCKED, closure: A later GO-1 must create the exact disposable target before registration identity can be bound.}
    - {id: TARGET-KUBERNETES-COMPATIBILITY, status: BLOCKED, closure: Accept or prove Argo CD v3.4.2 behavior against the fixture target Kubernetes v1.36.2.}
    - {id: TARGET-ACCESS-CONTENT-BOUNDARY, status: BLOCKED, closure: Review and accept the create-content boundary of the exact eight-object target access set.}
    - {id: TOKEN-LIFETIME-BOUNDARY, status: BLOCKED, closure: Review and accept bounded static TokenRequest expiry without native Argo rotation.}
    - {id: SECRET-MATERIALIZER, status: BLOCKED, closure: Implement and review a redacting in-memory or server-side materializer that never persists credential bytes.}
    - {id: TARGET-CAPABILITIES, status: BLOCKED, closure: Prove local-path availability and every required runtime Secret dependency on the disposable target.}
    - {id: RUNTIME-ACCEPTANCE, status: BLOCKED, closure: Bind OpenSearch retention and real alert-delivery acceptance to the exact platform profile.}
    - {id: GO1-AUTHORIZATION, status: BLOCKED, closure: Rebind this runtime subphase into a newly canonicalized GO-1 protocol and obtain an explicit grant.}
  stopConditions:
    - any runtime identity component is missing stale conflicting or does not correlate
    - any candidate digest object count project namespace or exact resource scope differs
    - any credential byte would be written to Git logs or retained evidence
    - the requested token lifetime exceeds the bound maximum
    - any Application or ApplicationSet exists before registration verification
    - the native default project would become a consumer of the disposable target
  exclusions:
    - target access creation
    - TokenRequest or credential materialization
    - AppProject or cluster Secret creation
    - Application or ApplicationSet submission
    - Platform convergence
    - GO-1 lifecycle submission
    - rollback cleanup failure injection or outage testing
