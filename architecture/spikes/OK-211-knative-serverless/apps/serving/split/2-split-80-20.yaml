# OK-211 — S8 step 2: new revision podinfo-split-v6170 (6.17.0); 80/20 split,
# tag candidate on the new revision.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: podinfo-split
  namespace: ok211-serving
  labels:
    app.kubernetes.io/part-of: ok211
spec:
  template:
    metadata:
      name: podinfo-split-v6170
    spec:
      containers:
        - name: podinfo
          image: __PODINFO_IMAGE_6_17_0__
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
            # Knative defaults successThreshold to 1; stating it keeps a re-apply of
            # the same named template identical (S8 finding).
            successThreshold: 1
  traffic:
    - revisionName: podinfo-split-v6160
      percent: 80
    - revisionName: podinfo-split-v6170
      percent: 20
      tag: candidate
