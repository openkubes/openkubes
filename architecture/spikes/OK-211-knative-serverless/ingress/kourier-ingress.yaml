# OK-211 N2 — the single entry point (ADR-010): Traefik routes every host
# below ok211-serving.ok211.internal to Kourier. A wildcard covers exactly one
# DNS label (Ingress API), so this matches <svc>.ok211-serving.ok211.internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knative-via-ok-ingress
  namespace: kourier-system
  labels:
    app.kubernetes.io/part-of: ok211
spec:
  ingressClassName: ok-ingress
  rules:
    - host: "*.ok211-serving.ok211.internal"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kourier
                port:
                  number: 80
