# OK-211 X3 step 3 — allow the Knative data and control path into the tenant:
# activator (proxies requests while the SKS is in Proxy mode) and autoscaler
# (scrapes queue-proxy metrics), both in knative-serving.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-knative-serving
  namespace: ok211-tenant-b
  labels:
    app.kubernetes.io/part-of: ok211
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knative-serving
