# OK-211 X3 step 4 — allow the Kourier gateway, which sends traffic straight to
# the pods once the SKS switches to Serve mode (enough burst capacity).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kourier-gateway
  namespace: ok211-tenant-b
  labels:
    app.kubernetes.io/part-of: ok211
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kourier-system
