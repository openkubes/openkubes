  evidenceBoundaries:
    - live proof covers the reviewed Namespace profile on ok-obs-verify, not a VM or hostile multi-tenant boundary
    - credential evidence is a bounded manifest, argv, workspace, output, and log scan; unobserved exfiltration is not disproved
    - inference is ok-ai shared Ollama reached through a reviewed /32 host route; that host and the selected model are trusted inputs, and the model is a portability probe, not a production coding-quality claim
    - persistent requested capacity is not enforced by the local-path provisioner; storage proof covers quota rejection and ephemeral emptyDir eviction
    - source knownCommit, implementation revision, and image digests are bound separately; no build attestation binds those images to that revision
    - Codex runs with its own sandbox disabled because it cannot nest inside the unprivileged pod; the pod securityContext and NetworkPolicy are the isolation boundary
    - MCP capability is proven as network reachability to one reviewed endpoint; approvedTools is declared but not enforced at the tool level
    - 'no reconciling controller exists: the harness applies the render and performs export-before-deletion ordering that a future controller must own'
    - 'evidence is integrity-bound after capture, not attested: beyond the cluster, node, image and model identifiers, its content could be recomputed offline'
    - no merge, release, deployment, or human approval authority is granted by runtime conformance
