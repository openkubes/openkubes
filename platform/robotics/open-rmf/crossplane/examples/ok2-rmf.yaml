# OpenRMF simulation Claim for ok2-rmf.
#
# Contract fixture — do not apply. The ok2-rmf cluster was permanently deleted,
# so its ProviderConfig no longer exists and a Claim built from this file cannot
# reconcile. Retained because it exercises the v1alpha1 schema in `make validate`.
# The live target is ../examples/ok-robotics.yaml.
apiVersion: platform.openkubes.ai/v1alpha1
kind: OpenRMFClaim
metadata:
  name: ok2-rmf
  namespace: openkubes-system
spec:
  clusterRef: ok2-rmf
  namespace: rmf
  mode: simulation
  hostname: rmf.openkubes.local
  credentialsSecretRef:
    name: rmf-credentials
    namespace: crossplane-system
