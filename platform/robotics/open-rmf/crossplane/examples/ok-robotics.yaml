# OpenRMF simulation Claim for ok-robotics.
#
# Both conditions this file used to wait on are met: the OK-79 observability
# gate closed Done, and the claim-only RoleBinding subject is confirmed as
# `oidc:openrmf-claim-editors` (../rbac/claim-editor-binding.yaml).
#
# Submit it through the approval-gated target, not a bare kubectl apply:
#   make deploy CLUSTER=ok-robotics DEPLOY_USER=<real-api-username> APPROVE_MGMT=yes
#
# This was the first managed-deployment target (OK-88/OK-99). It began as a
# clean install; subsequent submissions update the existing managed Claim.
apiVersion: platform.openkubes.ai/v1alpha1
kind: OpenRMFClaim
metadata:
  name: ok-robotics
  namespace: openkubes-system
spec:
  clusterRef: ok-robotics
  namespace: rmf
  mode: simulation
  hostname: robotics.openkubes.local
  credentialsSecretRef:
    name: rmf-credentials
    namespace: crossplane-system
