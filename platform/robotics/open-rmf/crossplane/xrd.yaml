# OpenRMF XRD — Robotics Fleet Orchestration contract
#
# v1alpha1 deliberately exposes only the simulation profile. Real/core RMF is
# added only after its ADR-Platform-019 gates pass.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: openrmfinstances.platform.openkubes.ai
spec:
  group: platform.openkubes.ai
  names:
    kind: OpenRMFInstance
    plural: openrmfinstances
  claimNames:
    kind: OpenRMFClaim
    plural: openrmfclaims
  defaultCompositionRef:
    name: openrmf.platform.openkubes.ai
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clusterRef
                - hostname
                - credentialsSecretRef
              properties:
                clusterRef:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                  description: >-
                    Workload-cluster and provider-helm ProviderConfig name.
                    This is portable API syntax; a fail-closed admission policy
                    maps authenticated identities to exact authorized target
                    and namespace pairs.
                namespace:
                  type: string
                  default: rmf
                  minLength: 1
                  maxLength: 63
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  description: >-
                    Workload namespace. Authorization is enforced together
                    with clusterRef by the fail-closed admission policy.
                mode:
                  type: string
                  default: simulation
                  enum:
                    - simulation
                  description: >-
                    Exactly one trajectory-producing mode. v1alpha1 supports
                    only the validated simulation profile.
                hostname:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: "^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$"
                  description: >-
                    External hostname shared by RMF ingress, dashboard and API.
                    The central identity provider has its own hostname. Supply
                    a hostname, not a URL.
                credentialsSecretRef:
                  type: object
                  required:
                    - name
                  description: >-
                    Fixed credential contract retained in v1alpha1 for
                    compatibility and explicit rejection of unauthorized
                    Secret selection. The Composition does not consume these
                    claimant fields.
                  properties:
                    name:
                      type: string
                      enum:
                        - rmf-credentials
                      description: Fixed RMF credential Secret name.
                    namespace:
                      type: string
                      default: crossplane-system
                      enum:
                        - crossplane-system
                      description: Fixed RMF credential Secret namespace.
            status:
              type: object
              properties:
                releaseState:
                  type: string
                  description: State reported by the composed Helm Release.
                revision:
                  type: integer
                  description: Helm revision reported by provider-helm.
