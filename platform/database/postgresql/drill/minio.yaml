apiVersion: v1
kind: Namespace
metadata:
  name: minio
  labels:
    platform.openkubes.ai/managed-by: ok-145-minio-provisioner
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: minio-bootstrap-selfsigned
  namespace: minio
  labels:
    platform.openkubes.ai/managed-by: ok-145-minio-provisioner
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minio-backup-store-ca
  namespace: minio
  labels:
    platform.openkubes.ai/managed-by: ok-145-minio-provisioner
spec:
  isCA: true
  commonName: OpenKubes OK-145 MinIO backup store CA
  secretName: minio-backup-store-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: minio-bootstrap-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: minio-backup-store-ca
  namespace: minio
  labels:
    platform.openkubes.ai/managed-by: ok-145-minio-provisioner
spec:
  ca:
    secretName: minio-backup-store-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minio-server
  namespace: minio
  labels:
    platform.openkubes.ai/managed-by: ok-145-minio-provisioner
spec:
  secretName: minio-server-tls
  dnsNames:
    - minio
    - minio.minio
    - minio.minio.svc
    - minio.minio.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: minio-backup-store-ca
    kind: Issuer
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: backup-store
    platform.openkubes.ai/managed-by: ok-145-minio-provisioner
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: https-s3
      port: 9000
      targetPort: https-s3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
    platform.openkubes.ai/managed-by: ok-145-minio-provisioner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: backup-store
    platform.openkubes.ai/managed-by: ok-145-minio-provisioner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: backup-store
        platform.openkubes.ai/managed-by: ok-145-minio-provisioner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
          args:
            - server
            - /data
            - --certs-dir=/certs
            - --console-address=:9001
          envFrom:
            - secretRef:
                name: minio-root-credentials
          ports:
            - name: https-s3
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /minio/health/ready
              port: https-s3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /minio/health/live
              port: https-s3
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        - name: tls
          secret:
            secretName: minio-server-tls
            items:
              - key: tls.crt
                path: public.crt
              - key: tls.key
                path: private.key
        - name: tmp
          emptyDir: {}
