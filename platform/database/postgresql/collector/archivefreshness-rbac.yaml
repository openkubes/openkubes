# Identity for the WAL-exposure collector. Lives on the MANAGEMENT plane, because that is where
# ArchiveFreshness objects are created.
#
# create/get/list only — deliberately no update, patch or delete. Each measurement is a NEW
# immutable observation event, exactly like RestoreVerified: a collector able to amend or remove
# past observations could rewrite the record its own verdicts are judged against.
#
# This automates OBSERVATION, not authority. §7's boundary is about approval — the operator group
# creating a RestoreVerified IS the recovery approval — and measuring WAL lag asserts no approval,
# so no human act is being automated away here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: archive-freshness-publisher
  namespace: crossplane-system
  labels:
    app.kubernetes.io/part-of: openkubes-database-postgresql
    openkubes.ai/adr: adr-platform-032
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: archivefreshness-publisher
  labels:
    app.kubernetes.io/part-of: openkubes-database-postgresql
    openkubes.ai/adr: adr-platform-032
rules:
  - apiGroups: [evidence.platform.openkubes.ai]
    resources: [archivefreshnesses]
    verbs: [create, get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: archivefreshness-publisher
  labels:
    app.kubernetes.io/part-of: openkubes-database-postgresql
    openkubes.ai/adr: adr-platform-032
subjects:
  - kind: ServiceAccount
    name: archive-freshness-publisher
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: archivefreshness-publisher
  apiGroup: rbac.authorization.k8s.io
