# Crossplane must be able to LIST and WATCH every kind the Composition requests through
# ExtraResources, or the informer never syncs and the pipeline step fails with
#   fetching resources for <requirement>: Timeout: failed waiting for Informer to sync
# rather than with anything that names RBAC. That is how this was missed: a local
# `crossplane composition render` supplies extra resources from a file, so no informer and no
# permission is involved, and every offline test passed. It surfaced the moment the real
# composite reconciled.
#
# Read-only on purpose. Crossplane SELECTS evidence; it must never be able to create, amend or
# delete it — the operator group creates RestoreVerified (§7) and a probe creates
# CapabilityVerified, and letting the selector write its own evidence would make the whole
# admissibility model circular.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openkubes-database-evidence-reader
  labels:
    app.kubernetes.io/part-of: openkubes-database-postgresql
    openkubes.ai/adr: adr-platform-032
rules:
  - apiGroups: [evidence.platform.openkubes.ai]
    resources: [capabilityverifieds, archivefreshnesses]
    verbs: [get, list, watch]
  # DataPolicy is a platform-side policy object, not evidence, but the Composition resolves it the
  # same way and therefore needs the same read access.
  - apiGroups: [platform.openkubes.ai]
    resources: [datapolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openkubes-database-evidence-reader-crossplane
  labels:
    app.kubernetes.io/part-of: openkubes-database-postgresql
    openkubes.ai/adr: adr-platform-032
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: openkubes-database-evidence-reader
  apiGroup: rbac.authorization.k8s.io
