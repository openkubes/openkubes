# Approving a verification method is the explicit §7 authority act. The operator group may create
# a new immutable profile and inspect existing profiles; it cannot edit or delete an approval.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openkubes-database-verificationprofile-writer
  labels:
    app.kubernetes.io/part-of: openkubes-database-postgresql
    openkubes.ai/adr: adr-platform-032
rules:
  - apiGroups: [platform.openkubes.ai]
    resources: [verificationprofiles]
    verbs: [create, get, list, watch]
