# Binds the claim-only Role to the authenticated ok-mgmt OIDC group.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: database-claim-editor
  namespace: openkubes-system
subjects:
  - kind: Group
    name: oidc:database-claim-editors
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: database-claim-editor
  apiGroup: rbac.authorization.k8s.io
