# PostgreSQL reference Composition for ADR-Platform-032.
#
# CNPG resources are applied to the registered workload cluster through
# provider-kubernetes. The status template reads the observed manifests of the
# Cluster, ScheduledBackup, deterministic Backup, and ObjectStore Objects. It
# intentionally never reads deprecated CNPG Cluster backup-freshness fields,
# which are unset for plugins.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: database-postgresql.platform.openkubes.ai
  labels:
    provider: kubernetes
    capability: database
    engine: postgresql
spec:
  compositeTypeRef:
    apiVersion: platform.openkubes.ai/v1alpha1
    kind: Database
  mode: Pipeline
  pipeline:
    - step: render-postgresql
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- /* Return the input only when Go can parse it and formatting the parsed
                   instant with Go's canonical RFC3339 layout reproduces it exactly.
                   Runs of 9 trim trailing fractional zeroes; Z07:00 emits Z for UTC.
                   Callers test for a non-empty result before every business toDate. */}}
            {{- define "canonicalRFC3339" -}}
            {{- $value := . -}}
            {{- $layout := "2006-01-02T15:04:05.999999999Z07:00" -}}
            {{- $shape := "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?(Z|[+-][0-9]{2}:[0-9]{2})$" -}}
            {{- if and (regexMatch $shape $value) (eq $value (date $layout (toDate $layout $value))) -}}
            {{- $value -}}
            {{- end -}}
            {{- end -}}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $claimName := index $xr.metadata.labels "crossplane.io/claim-name" | default $xr.metadata.name }}
            {{- $dbName := $claimName }}
            {{- if gt (len $dbName) 52 }}
            {{- $dbName = printf "%s-%s" (trunc 43 $dbName | trimSuffix "-" | trimSuffix ".") (sha256sum $dbName | trunc 8) }}
            {{- end }}
            {{- $namespace := $spec.namespace }}
            {{- $provider := $spec.clusterRef }}
            {{- $policy := $spec.protection.policyRef }}
            {{- $isProduction := eq $policy "production" }}
            {{- $instances := 1 }}
            {{- $storageSize := "5Gi" }}
            {{- $retention := "7d" }}
            {{- $backupValidity := "+168h" }}
            {{- $backupGracePeriod := "+72h" }}
            {{- $initialVerificationDeadline := "+336h" }}
            {{- /* §13 bound 1. production's RPO bound: the maximum WAL-archive lag that counts as
                   protected, and the maximum age of the lag MEASUREMENT itself — an old
                   measurement is not a current claim. development requires no RPO evidence, which
                   is a decision rather than an omission: dev tolerates loss, and demanding an
                   observation nothing publishes yet would make every dev Database unready. */}}
            {{- $rpoMaxWalLagSeconds := 300 }}
            {{- $rpoEvidenceMaxAgeSeconds := 900 }}
            {{- $protectionValidReason := "BackupCompletedAvailableAndArchivingNotFailing" }}
            {{- /* §13 bound 3. The evidence Backup is a FIXED anchor: a static
                   provider-kubernetes Object cannot enumerate generated-name Backup CRs, so
                   retention eventually prunes the anchor out of the moving recovery window while
                   scheduled backups are perfectly healthy. Reporting that as BackupUnavailable
                   was a counter-proof drawn from the age of our bookmark rather than the state of
                   the backups — the most dangerous possible reading, because absence demands
                   acting. When the window itself shows a MORE RECENT success, the anchor was
                   superseded and protection follows the schedule. */}}
            {{- $anchorSupersededReason := "WindowSupersedesAnchor" }}
            {{- if eq $spec.availability.mode "ha" }}
            {{- $instances = 3 }}
            {{- end }}
            {{- if $isProduction }}
            {{- $storageSize = "20Gi" }}
            {{- $retention = "30d" }}
            {{- $backupValidity = "+24h" }}
            {{- $backupGracePeriod = "+24h" }}
            {{- $initialVerificationDeadline = "+72h" }}
            {{- end }}
            {{- /* Platform-owned backup-store registry, keyed by target cluster.
                   This is deliberately NOT claim input and NOT an XRD field: a claimant
                   able to choose the endpoint could point backups at a store it controls,
                   which would also remove any basis for the read-only-source reasoning in
                   ADR-Platform-032 §11.3. Adding a cluster here is a reviewed edit, the
                   same shape as adding an entry to the admission authority tuple list.
                   `endpointCA` names a Secret carrying the CA bundle. The field and the
                   availability status path below were verified against the pinned Barman
                   Cloud Plugin v0.14.0 ObjectStore CRD. */}}
            {{- $backupStores := dict
                  "ok-robotics" (dict
                    "bucket" "ok-db-backups"
                    "endpointURL" "https://minio.minio.svc:9000"
                    "endpointCA" "minio-backup-store-ca"
                    "residencyZone" "on-prem-de") }}
            {{- $store := dict }}
            {{- if hasKey $backupStores $provider }}
            {{- $store = index $backupStores $provider }}
            {{- end }}
            {{- if not (hasKey $store "endpointURL") }}
            {{- fail (printf "no reviewed backup store is registered for cluster %q: refusing to compose a Database with no protection destination. Add it to $backupStores in this Composition." $provider) }}
            {{- end }}
            {{- if not (hasPrefix "https://" $store.endpointURL) }}
            {{- fail (printf "backup store endpoint for cluster %q must be https: backup data and the credentials authenticating to it must not cross a plaintext connection" $provider) }}
            {{- end }}
            {{- $catalogName := printf "openkubes-postgresql-18-%s" $dbName }}
            {{- $objectStoreName := printf "%s-backup-store" $dbName }}
            {{- $evidenceBackupName := printf "%s-evidence" $dbName }}
            {{- $initialObservedAt := default "1970-01-01T00:00:00Z" $xr.metadata.creationTimestamp }}
            {{- $requestedPgvector := false }}
            {{- range $capability := $spec.engine.capabilities }}
            {{- if eq $capability.name "postgresql.extension.pgvector" }}
            {{- $requestedPgvector = true }}
            {{- end }}
            {{- end }}

            {{- /* Read observed provider-kubernetes manifests. */}}
            {{- $clusterObject := dict }}
            {{- if hasKey $.observed.resources "database-cluster" }}
            {{- $clusterObject = (index $.observed.resources "database-cluster").resource }}
            {{- end }}
            {{- $clusterManifest := dig "status" "atProvider" "manifest" (dict) $clusterObject }}
            {{- $clusterStatus := dig "status" (dict) $clusterManifest }}
            {{- $appSecretObject := dict }}
            {{- if hasKey $.observed.resources "app-secret" }}
            {{- $appSecretObject = (index $.observed.resources "app-secret").resource }}
            {{- end }}
            {{- $appSecretManifest := dig "status" "atProvider" "manifest" (dict) $appSecretObject }}
            {{- $backupObject := dict }}
            {{- if hasKey $.observed.resources "evidence-backup" }}
            {{- $backupObject = (index $.observed.resources "evidence-backup").resource }}
            {{- end }}
            {{- $backupManifest := dig "status" "atProvider" "manifest" (dict) $backupObject }}
            {{- $backupStatus := dig "status" (dict) $backupManifest }}
            {{- $scheduledBackupObject := dict }}
            {{- if hasKey $.observed.resources "scheduled-backup" }}
            {{- $scheduledBackupObject = (index $.observed.resources "scheduled-backup").resource }}
            {{- end }}
            {{- $scheduledBackupManifest := dig "status" "atProvider" "manifest" (dict) $scheduledBackupObject }}
            {{- $scheduledBackupStatus := dig "status" (dict) $scheduledBackupManifest }}
            {{- $objectStoreObject := dict }}
            {{- if hasKey $.observed.resources "object-store" }}
            {{- $objectStoreObject = (index $.observed.resources "object-store").resource }}
            {{- end }}
            {{- $objectStoreManifest := dig "status" "atProvider" "manifest" (dict) $objectStoreObject }}
            {{- $objectStoreStatus := dig "status" (dict) $objectStoreManifest }}
            {{- /* Barman Cloud Plugin v0.14.0 publishes one recovery window per
                   effective serverName. Containment of Backup.stoppedAt inside that
                   window is the current-availability proof; equality with the latest
                   successful backup is deliberately not required. */}}
            {{- $serverRecoveryWindows := dig "serverRecoveryWindow" (dict) $objectStoreStatus }}
            {{- $backupAvailability := dig $dbName (dict) $serverRecoveryWindows }}
            {{- $extraResources := default (dict) $.extraResources }}
            {{- $oldEvidence := dig "status" "evidence" (dict) $xr }}

            {{- /* Operational evidence comes only from the current Ready sensor. */}}
            {{- $operationalState := "Unknown" }}
            {{- $operationalReason := "AwaitingCluster" }}
            {{- $operationalObservedAt := $initialObservedAt }}
            {{- $clusterReady := false }}
            {{- $clusterReadyObserved := false }}
            {{- range $condition := dig "conditions" (list) $clusterStatus }}
            {{- if eq $condition.type "Ready" }}
            {{- $clusterReadyObserved = true }}
            {{- $operationalObservedAt = default $initialObservedAt $condition.lastTransitionTime }}
            {{- if eq $condition.status "True" }}
            {{- $clusterReady = true }}
            {{- $operationalState = "Valid" }}
            {{- $operationalReason = "ClusterReady" }}
            {{- else if eq $condition.status "False" }}
            {{- $operationalState = "Failed" }}
            {{- $operationalReason = "ClusterNotReady" }}
            {{- else }}
            {{- $operationalReason = "ClusterReadinessUnknown" }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* Capability evidence is independent of protection/recovery. */}}
            {{- $capabilityState := "Unknown" }}
            {{- $capabilityReason := "AwaitingCluster" }}
            {{- $capabilityObservedAt := $operationalObservedAt }}
            {{- $pgvectorObserved := false }}
            {{- range $extension := dig "pgDataImageInfo" "extensions" (list) $clusterStatus }}
            {{- if eq $extension.name "vector" }}
            {{- $pgvectorObserved = true }}
            {{- end }}
            {{- end }}
            {{- /* The capability DECISION is made further down, alongside the other evidence
                   selections: it needs the observed Cluster identity and the running image digest
                   that are resolved there. Only the observation is computed here. */}}

            {{- /* Protection is reduced once from three independently visible signals.
                   A Backup CR is execution history, ObjectStore is current catalogue
                   availability, and ContinuousArchiving=True says archiving is not
                   currently failing. Per ADR §10 this does not claim an RPO bound. */}}
            {{- $layout := "2006-01-02T15:04:05.999999999Z07:00" }}
            {{- $backupPhase := dig "phase" "" $backupStatus }}
            {{- $backupStoppedAt := dig "stoppedAt" "" $backupStatus }}
            {{- $backupId := dig "backupId" "" $backupStatus }}
            {{- $lastSuccessfulBackupTime := dig "lastSuccessfulBackupTime" "" $backupAvailability }}
            {{- $firstRecoverabilityPoint := dig "firstRecoverabilityPoint" "" $backupAvailability }}
            {{- $lastFailedBackupTime := dig "lastFailedBackupTime" "" $backupAvailability }}
            {{- $lastScheduleTime := dig "lastScheduleTime" "" $scheduledBackupStatus }}
            {{- $nextScheduleTime := dig "nextScheduleTime" "" $scheduledBackupStatus }}
            {{- $scheduleObserved := or (ne $lastScheduleTime "") (ne $nextScheduleTime "") }}
            {{- $oldProtection := dig "protection" (dict) $oldEvidence }}
            {{- $oldProtectionState := dig "state" "" $oldProtection }}
            {{- $oldProtectionBackupId := dig "backupId" "" $oldProtection }}
            {{- $oldProtectionValidUntil := dig "validUntil" "" $oldProtection }}

            {{- /* Named helper results are the only values admitted to business toDate
                   calls below. An empty result means syntactically plausible but not a
                   canonical Go RFC3339 instant, including impossible calendar values. */}}
            {{- $canonicalOperationalObservedAt := include "canonicalRFC3339" $operationalObservedAt }}
            {{- $canonicalLastScheduleTime := include "canonicalRFC3339" $lastScheduleTime }}
            {{- $canonicalBackupStoppedAt := include "canonicalRFC3339" $backupStoppedAt }}
            {{- $canonicalFirstRecoverabilityPoint := include "canonicalRFC3339" $firstRecoverabilityPoint }}
            {{- $canonicalLastSuccessfulBackupTime := include "canonicalRFC3339" $lastSuccessfulBackupTime }}
            {{- $canonicalLastFailedBackupTime := include "canonicalRFC3339" $lastFailedBackupTime }}

            {{- $firstBackupDeadline := "" }}
            {{- if and (eq $oldProtectionBackupId "") (ne $oldProtectionValidUntil "") }}
            {{- $firstBackupDeadline = $oldProtectionValidUntil }}
            {{- else if and $clusterReady (ne $canonicalOperationalObservedAt "") (ne $canonicalLastScheduleTime "") }}
            {{- $clusterReadyTime := toDate $layout $canonicalOperationalObservedAt }}
            {{- $scheduleDueTime := toDate $layout $canonicalLastScheduleTime }}
            {{- $clockOrigin := $clusterReadyTime }}
            {{- if $scheduleDueTime.After $clusterReadyTime }}
            {{- $clockOrigin = $scheduleDueTime }}
            {{- end }}
            {{- $firstBackupDeadline = date $layout (dateModify $backupGracePeriod $clockOrigin) }}
            {{- end }}
            {{- $canonicalFirstBackupDeadline := include "canonicalRFC3339" $firstBackupDeadline }}

            {{- $executionState := "Unknown" }}
            {{- $executionReason := "AwaitingFirstBackup" }}
            {{- $executionObservedAt := $initialObservedAt }}
            {{- if eq $backupPhase "failed" }}
            {{- $executionState = "Failed" }}
            {{- $executionReason = "BackupFailed" }}
            {{- $executionObservedAt = default $initialObservedAt $backupStoppedAt }}
            {{- else if or (eq $backupPhase "running") (eq $backupPhase "pending") }}
            {{- $executionState = "Pending" }}
            {{- $executionReason = "BackupInProgress" }}
            {{- else if eq $backupPhase "completed" }}
            {{- if and (ne $backupId "") (ne $canonicalBackupStoppedAt "") }}
            {{- $executionState = "Valid" }}
            {{- $executionReason = "BackupCompleted" }}
            {{- $executionObservedAt = $canonicalBackupStoppedAt }}
            {{- else if and (ne $backupId "") (ne $backupStoppedAt "") }}
            {{- $executionReason = "ObservationTimestampInvalid" }}
            {{- else }}
            {{- $executionReason = "ObservationUnavailable" }}
            {{- end }}
            {{- else if and (ne $canonicalFirstBackupDeadline "") (now.After (toDate $layout $canonicalFirstBackupDeadline)) }}
            {{- if and $clusterReadyObserved $scheduleObserved (hasKey $.observed.resources "evidence-backup") }}
            {{- $executionState = "Failed" }}
            {{- $executionReason = "BackupOverdue" }}
            {{- $executionObservedAt = $firstBackupDeadline }}
            {{- else }}
            {{- $executionReason = "ObservationUnavailable" }}
            {{- end }}
            {{- end }}

            {{- $availabilityState := "Unknown" }}
            {{- $availabilityReason := "BackupAvailabilityUnproven" }}
            {{- $availabilityObservedAt := $initialObservedAt }}
            {{- if eq $executionState "Pending" }}
            {{- $availabilityState = "Pending" }}
            {{- $availabilityReason = "AwaitingBackupCompletion" }}
            {{- else if eq $executionState "Valid" }}
            {{- $availabilityFieldsParse := and (ne $canonicalBackupStoppedAt "") (ne $canonicalFirstRecoverabilityPoint "") (ne $canonicalLastSuccessfulBackupTime "") (or (eq $lastFailedBackupTime "") (ne $canonicalLastFailedBackupTime "")) }}
            {{- if $availabilityFieldsParse }}
            {{- $stoppedTime := toDate $layout $canonicalBackupStoppedAt }}
            {{- $firstTime := toDate $layout $canonicalFirstRecoverabilityPoint }}
            {{- $lastSuccessTime := toDate $layout $canonicalLastSuccessfulBackupTime }}
            {{- $availabilityObservedAt = $canonicalLastSuccessfulBackupTime }}
            {{- if $firstTime.After $lastSuccessTime }}
            {{- $availabilityReason = "BackupAvailabilityUnproven" }}
            {{- else if and (ne $canonicalLastFailedBackupTime "") ((toDate $layout $canonicalLastFailedBackupTime).Equal $lastSuccessTime) }}
            {{- $availabilityReason = "BackupFailureTimeAmbiguous" }}
            {{- else if and (ne $canonicalLastFailedBackupTime "") ((toDate $layout $canonicalLastFailedBackupTime).After $lastSuccessTime) }}
            {{- $availabilityState = "Failed" }}
            {{- $availabilityReason = "BackupFailed" }}
            {{- $availabilityObservedAt = $lastFailedBackupTime }}
            {{- else if $firstTime.After $stoppedTime }}
            {{- /* The anchor predates the window, so ITS data is no longer restorable. That is
                   only a protection failure if nothing newer is, and the window's own end is the
                   last successful backup — so comparing against it separates "our bookmark aged
                   out" from "there is nothing to restore".

                   Be honest about what the else branch is: with a COHERENT window it cannot fire.
                   firstRecoverabilityPoint > stoppedAt implies lastSuccessfulBackupTime >=
                   firstRecoverabilityPoint > stoppedAt, so a newer success always exists here. It
                   is kept as a guard against incoherent plugin data, not as a live state.
                   The consequence must not be glossed: from recovery-window TIMES alone, positive
                   evidence that backups are entirely gone is NOT observable — total absence shows
                   up as an unreadable window, which §11.1 requires be Unknown rather than a
                   counter-proof. Restoring a real BackupUnavailable verdict needs Backup
                   enumeration, the same residual gap that leaves backupId unavailable below. */}}
            {{- if $lastSuccessTime.After $stoppedTime }}
            {{- $availabilityState = "Valid" }}
            {{- $availabilityReason = $anchorSupersededReason }}
            {{- else }}
            {{- $availabilityState = "Failed" }}
            {{- $availabilityReason = "BackupUnavailable" }}
            {{- end }}
            {{- else if $stoppedTime.After $lastSuccessTime }}
            {{- $availabilityReason = "BackupAvailabilityUnproven" }}
            {{- else }}
            {{- $availabilityState = "Valid" }}
            {{- $availabilityReason = "BackupWindowContainsExecution" }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $archivingState := "Unknown" }}
            {{- $archivingReason := "WALArchivingUnproven" }}
            {{- $archivingObservedAt := $initialObservedAt }}
            {{- range $condition := dig "conditions" (list) $clusterStatus }}
            {{- if eq $condition.type "ContinuousArchiving" }}
            {{- $archivingObservedAt = default $initialObservedAt $condition.lastTransitionTime }}
            {{- if eq $condition.status "False" }}
            {{- $archivingState = "Failed" }}
            {{- $archivingReason = "ContinuousArchivingFailed" }}
            {{- else if eq $condition.status "True" }}
            {{- $archivingState = "Valid" }}
            {{- $archivingReason = "ContinuousArchivingNotFailing" }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* RPO freshness (§13 bound 1), the third signal §11.1 named and nothing could
                   see. ContinuousArchiving=True only means archiving is not FAILING; a slow or
                   stalled-but-not-failed archiver satisfies it, so treating it as an RPO bound
                   would be exactly the proxy this contract refuses. The measurement therefore
                   arrives as a typed ArchiveFreshness observation.

                   production requires it. Absent or aged-out is Unknown/RPOFreshnessUnproven —
                   never Valid and never Failed, because being unable to observe is not a
                   counter-proof (§11.1). A lag beyond the bound IS a counter-proof: we looked and
                   the archive is behind. */}}
            {{- $rpoState := "Valid" }}
            {{- $rpoReason := "RPONotRequiredForClass" }}
            {{- $rpoObservedAt := $initialObservedAt }}
            {{- $rpoLagSeconds := -1 }}
            {{- if $isProduction }}
            {{- $rpoState = "Unknown" }}
            {{- $rpoReason = "RPOFreshnessUnproven" }}
            {{- $freshnessResults := index $extraResources "archive-freshness" | default (dict "items" (list)) }}
            {{- $selectedFreshnessAt := "1970-01-01T00:00:00Z" }}
            {{- range $required := dig "items" (list) $freshnessResults }}
            {{- $candidate := dig "resource" (dict) $required }}
            {{- $candidateSpec := dig "spec" (dict) $candidate }}
            {{- $afClusterRef := dig "clusterRef" (dict) $candidateSpec }}
            {{- $afObserved := dig "observed" (dict) $candidateSpec }}
            {{- $canonicalAfObservedAt := include "canonicalRFC3339" (dig "timing" "observedAt" "" $candidateSpec) }}
            {{- $afAdmissible := and
                  (eq (dig "apiVersion" "" $candidate) "evidence.platform.openkubes.ai/v1alpha1")
                  (eq (dig "kind" "" $candidate) "ArchiveFreshness")
                  (eq (dig "uid" "" $afClusterRef) (dig "metadata" "uid" "" $clusterManifest))
                  (eq (dig "namespace" "" $afClusterRef) $namespace)
                  (eq (dig "name" "" $afClusterRef) $dbName)
                  (ne (dig "probeDigest" "" $candidateSpec) "")
                  (hasKey $afObserved "walLagSeconds")
                  (ne $canonicalAfObservedAt "")
                  (not ((toDate $layout $canonicalAfObservedAt).After now)) }}
            {{- if and $afAdmissible ((toDate $layout $canonicalAfObservedAt).After (toDate $layout (include "canonicalRFC3339" $selectedFreshnessAt))) }}
            {{- $selectedFreshnessAt = $canonicalAfObservedAt }}
            {{- $rpoObservedAt = $canonicalAfObservedAt }}
            {{- $rpoLagSeconds = int64 (dig "walLagSeconds" 0 $afObserved) }}
            {{- end }}
            {{- end }}
            {{- if ne $selectedFreshnessAt "1970-01-01T00:00:00Z" }}
            {{- $measurementExpiry := dateModify (printf "+%ds" (int $rpoEvidenceMaxAgeSeconds)) (toDate $layout $selectedFreshnessAt) }}
            {{- if now.After $measurementExpiry }}
            {{- /* The measurement itself aged out. Unknown, not Failed: we no longer know the
                   lag, which is different from knowing it is bad. */}}
            {{- $rpoReason = "RPOObservationExpired" }}
            {{- else if gt $rpoLagSeconds (int64 $rpoMaxWalLagSeconds) }}
            {{- $rpoState = "Failed" }}
            {{- $rpoReason = "RPOBoundExceeded" }}
            {{- else }}
            {{- $rpoState = "Valid" }}
            {{- $rpoReason = "RPOWithinBound" }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $protectionState := "Unknown" }}
            {{- $protectionReason := "AwaitingFirstBackup" }}
            {{- $protectionObservedAt := $executionObservedAt }}
            {{- $protectionValidUntil := "" }}
            {{- $protectionEvidenceRef := "" }}
            {{- $protectionBackupId := "" }}
            {{- $samePriorEvidence := false }}
            {{- $protectionExpired := false }}
            {{- if and (ne $canonicalFirstBackupDeadline "") (ne $executionState "Valid") }}
            {{- /* Before first success, validUntil carries the immutable grace
                   deadline so a later schedule observation cannot slide it. */}}
            {{- $protectionValidUntil = $canonicalFirstBackupDeadline }}
            {{- end }}
            {{- if eq $executionState "Valid" }}
            {{- $stoppedTime := toDate $layout $canonicalBackupStoppedAt }}
            {{- $validTime := dateModify $backupValidity $stoppedTime }}
            {{- $protectionValidUntil = date $layout $validTime }}
            {{- $protectionEvidenceRef = printf "Backup/%s/%s" $namespace $evidenceBackupName }}
            {{- $protectionBackupId = $backupId }}
            {{- $samePriorEvidence = and (eq $oldProtectionBackupId $backupId) (or (eq $oldProtectionState "Valid") (eq $oldProtectionState "Stale")) }}
            {{- $protectionExpired = now.After $validTime }}
            {{- end }}
            {{- if and (eq $availabilityState "Valid") (eq $availabilityReason $anchorSupersededReason) (ne $canonicalLastSuccessfulBackupTime "") }}
            {{- /* Freshness now derives from the superseding backup, which is what makes evidence
                   follow the schedule instead of decaying with a bookmark. The residual, stated
                   rather than hidden: the recovery window carries TIMES, not backup identities, so
                   backupId is cleared and the evidence reference points at the window. Naming an
                   ID we did not observe would be worse than having none. Recovering the ID needs
                   Backup enumeration, which no static Object can do. */}}
            {{- $supersedingTime := toDate $layout $canonicalLastSuccessfulBackupTime }}
            {{- $supersedingValidTime := dateModify $backupValidity $supersedingTime }}
            {{- $protectionValidUntil = date $layout $supersedingValidTime }}
            {{- $protectionObservedAt = $canonicalLastSuccessfulBackupTime }}
            {{- $protectionEvidenceRef = printf "ObjectStore/%s/%s#status.serverRecoveryWindow[%s]" $namespace $objectStoreName $dbName }}
            {{- $protectionBackupId = "" }}
            {{- /* Continuity, not identity: with no observable ID the only honest predecessor test
                   is that protection was already established. */}}
            {{- $samePriorEvidence = or (eq $oldProtectionState "Valid") (eq $oldProtectionState "Stale") }}
            {{- $protectionExpired = now.After $supersedingValidTime }}
            {{- end }}
            {{- if and (eq $availabilityState "Failed") (eq $availabilityReason "BackupUnavailable") }}
            {{- $protectionState = "Failed" }}
            {{- $protectionReason = "BackupUnavailable" }}
            {{- $protectionObservedAt = $availabilityObservedAt }}
            {{- else if eq $archivingState "Failed" }}
            {{- $protectionState = "Failed" }}
            {{- $protectionReason = $archivingReason }}
            {{- $protectionObservedAt = $archivingObservedAt }}
            {{- else if or (eq $executionState "Failed") (eq $availabilityState "Failed") }}
            {{- $protectionState = "Failed" }}
            {{- $protectionReason = ternary $executionReason $availabilityReason (eq $executionState "Failed") }}
            {{- else if eq $executionState "Unknown" }}
            {{- $protectionReason = $executionReason }}
            {{- else if eq $availabilityState "Unknown" }}
            {{- $protectionReason = $availabilityReason }}
            {{- else if eq $rpoState "Failed" }}
            {{- $protectionState = "Failed" }}
            {{- $protectionReason = $rpoReason }}
            {{- $protectionObservedAt = $rpoObservedAt }}
            {{- else if eq $archivingState "Unknown" }}
            {{- $protectionReason = $archivingReason }}
            {{- else if eq $rpoState "Unknown" }}
            {{- /* production cannot be Valid without a current RPO measurement. This is the whole
                   point of bound 1: previously production reached Valid on ContinuousArchiving
                   alone, which the ADR says is not an RPO bound. */}}
            {{- $protectionReason = $rpoReason }}
            {{- else if and $protectionExpired (eq $availabilityState "Valid") }}
            {{- if $samePriorEvidence }}
            {{- $protectionState = "Stale" }}
            {{- $protectionReason = "BackupEvidenceExpired" }}
            {{- else }}
            {{- $protectionState = "Pending" }}
            {{- $protectionReason = "FreshBackupEvidencePending" }}
            {{- end }}
            {{- else if or (eq $executionState "Pending") (eq $availabilityState "Pending") (eq $archivingState "Pending") }}
            {{- $protectionState = "Pending" }}
            {{- $protectionReason = ternary "BackupInProgress" "ProtectionEvaluationPending" (eq $executionState "Pending") }}
            {{- else }}
            {{- $protectionState = "Valid" }}
            {{- $protectionReason = $protectionValidReason }}
            {{- end }}

            {{- /* Select the newest admissible management-plane RestoreVerified.
                   ExtraResources is native to function-go-templating v0.9.2. The
                   label narrows discovery; exact immutable identities and resolved
                   source coordinates decide admissibility. */}}
            {{- $recoveryState := "Unknown" }}
            {{- $recoveryReason := "VerificationPending" }}
            {{- $recoveryObservedAt := $initialObservedAt }}
            {{- $recoveryValidUntil := "" }}
            {{- $recoveryEvidenceRef := "" }}
            {{- $recoveryBackupId := "" }}
            {{- $recoveryTarget := "" }}
            {{- $verifierVersion := "" }}
            {{- $selectedRestore := dict }}
            {{- $selectedCompletedAt := "1970-01-01T00:00:00Z" }}
            {{- $canonicalSelectedCompletedAt := include "canonicalRFC3339" $selectedCompletedAt }}
            {{- $restoreResults := index $extraResources "restore-evidence" | default (dict "items" (list)) }}
            {{- range $required := dig "items" (list) $restoreResults }}
            {{- $candidate := dig "resource" (dict) $required }}
            {{- $candidateSpec := dig "spec" (dict) $candidate }}
            {{- $checksPass := true }}
            {{- range $check := dig "checks" (list) $candidateSpec }}
            {{- if ne (dig "result" "" $check) "PASS" }}{{- $checksPass = false }}{{- end }}
            {{- end }}
            {{- $completedAt := dig "timing" "completedAt" "" $candidateSpec }}
            {{- $canonicalCompletedAt := include "canonicalRFC3339" $completedAt }}
            {{- $source := dig "source" (dict) $candidateSpec }}
            {{- $databaseRef := dig "databaseRef" (dict) $candidateSpec }}
            {{- $sourceClusterRef := dig "sourceClusterRef" (dict) $candidateSpec }}
            {{- $backupRef := dig "backupRef" (dict) $candidateSpec }}
            {{- $reached := dig "recoveryTarget" "reached" (dict) $candidateSpec }}
            {{- $admissible := and
                  (eq (dig "apiVersion" "" $candidate) "evidence.platform.openkubes.ai/v1alpha1")
                  (eq (dig "kind" "" $candidate) "RestoreVerified")
                  (eq (dig "apiVersion" "" $databaseRef) $xr.apiVersion)
                  (eq (dig "kind" "" $databaseRef) $xr.kind)
                  (eq (dig "name" "" $databaseRef) $xr.metadata.name)
                  (eq (dig "uid" "" $databaseRef) $xr.metadata.uid)
                  (eq (dig "backupId" "" $candidateSpec) $backupId)
                  (eq (dig "uid" "" $backupRef) (dig "metadata" "uid" "" $backupManifest))
                  (eq (dig "namespace" "" $backupRef) $namespace)
                  (eq (dig "name" "" $backupRef) $evidenceBackupName)
                  (eq (dig "sourceSystemIdentifier" "" $candidateSpec) (dig "systemID" "" $clusterStatus))
                  (eq (dig "uid" "" $sourceClusterRef) (dig "metadata" "uid" "" $clusterManifest))
                  (eq (dig "namespace" "" $sourceClusterRef) $namespace)
                  (eq (dig "name" "" $sourceClusterRef) $dbName)
                  (eq (dig "endpoint" "" $source) $store.endpointURL)
                  (eq (dig "bucket" "" $source) $store.bucket)
                  (eq (dig "pathPrefix" "" $source) (printf "%s/" $dbName))
                  (eq (dig "serverName" "" $source) $dbName)
                  (eq (dig "canonicalServerDirectory" "" $source) (printf "s3://%s/%s/" $store.bucket $dbName))
                  (ne $canonicalCompletedAt "")
                  (not ((toDate $layout $canonicalCompletedAt).After now))
                  (ne (dig "timelineId" "" $reached) "")
                  (ne (dig "lsn" "" $reached) "")
                  (ne (dig "checkProfileDigest" "" $candidateSpec) "")
                  (ne (dig "manifestDigest" "" $candidateSpec) "")
                  $checksPass
                  (eq (dig "isolation" "writeDenialObjectAbsent" false $candidateSpec) true)
                  (hasPrefix "PASS" (dig "isolation" "effectivePolicyResult" "" $candidateSpec))
                  (hasPrefix "PASS" (dig "isolation" "writeDenialProbeResult" "" $candidateSpec)) }}
            {{- if and $admissible ((toDate $layout $canonicalCompletedAt).After (toDate $layout $canonicalSelectedCompletedAt)) }}
            {{- $selectedRestore = $candidate }}
            {{- $selectedCompletedAt = $canonicalCompletedAt }}
            {{- $canonicalSelectedCompletedAt = $canonicalCompletedAt }}
            {{- end }}
            {{- end }}
            {{- if gt (len $selectedRestore) 0 }}
            {{- $selectedSpec := dig "spec" (dict) $selectedRestore }}
            {{- $selectedReached := dig "recoveryTarget" "reached" (dict) $selectedSpec }}
            {{- $recoveryExpiry := dateModify $backupValidity (toDate $layout $canonicalSelectedCompletedAt) }}
            {{- $recoveryState = "Valid" }}
            {{- $recoveryReason = "RestoreVerified" }}
            {{- $recoveryObservedAt = $selectedCompletedAt }}
            {{- $recoveryValidUntil = date $layout $recoveryExpiry }}
            {{- $recoveryEvidenceRef = dig "evidenceRef" "" $selectedSpec }}
            {{- $recoveryBackupId = dig "backupId" "" $selectedSpec }}
            {{- $recoveryTarget = printf "timeline=%s,lsn=%s" (dig "timelineId" "" $selectedReached) (dig "lsn" "" $selectedReached) }}
            {{- $verifierVersion = dig "verifierVersion" "" $selectedSpec }}
            {{- if now.After $recoveryExpiry }}
            {{- $oldRecovery := dig "recovery" (dict) $oldEvidence }}
            {{- $samePriorRecoveryEvidence := and
                  (eq (dig "evidenceRef" "" $oldRecovery) $recoveryEvidenceRef)
                  (or (eq (dig "state" "" $oldRecovery) "Valid") (eq (dig "state" "" $oldRecovery) "Stale")) }}
            {{- if $samePriorRecoveryEvidence }}
            {{- $recoveryState = "Stale" }}
            {{- $recoveryReason = "RestoreEvidenceExpired" }}
            {{- else }}
            {{- $recoveryState = "Pending" }}
            {{- $recoveryReason = "FreshVerificationPending" }}
            {{- end }}
            {{- end }}
            {{- else if and (eq $executionState "Valid") (ne $canonicalBackupStoppedAt "") }}
            {{- $verificationDeadlineTime := dateModify $initialVerificationDeadline (toDate $layout $canonicalBackupStoppedAt) }}
            {{- if now.After $verificationDeadlineTime }}
            {{- $recoveryState = "Failed" }}
            {{- $recoveryReason = "VerificationOverdue" }}
            {{- $recoveryObservedAt = date $layout $verificationDeadlineTime }}
            {{- end }}
            {{- end }}

            {{- /* The inline managed-role status records the remote Secret resourceVersion
                   actually applied. Equality with the observed mirrored Secret is the
                   marker; publication alone never claims database acceptance. */}}
            {{- /* Credential rotation overlap (§13 bound 6, superseding §11.4's "no overlap").
                   PostgreSQL stores ONE verifier per role, so two simultaneously valid passwords
                   for a single role do not exist — that is mechanical, not a CNPG limitation, and
                   it is why v1 owed this. The remedy §13 names is a login-role PAIR sharing a
                   non-login privilege role, and that is what this composes: `app` keeps owning the
                   database and its objects but stops being a login role, while `app_a` and `app_b`
                   are login roles granted INTO it. Two roles means two verifiers, so both
                   credentials are genuinely valid at once and the overlap is real rather than
                   asserted.

                   MIGRATION, and it is not a detail: on a database that already logs in as `app`,
                   this turns `app` NOLOGIN. Existing consumers authenticating as `app` stop being
                   able to open new sessions. Applying this to a live Database is a gated change
                   with a consumer cutover, never a silent reconcile.

                   The active slot is platform state, not claim input: it is read from an
                   annotation on the mirrored credential Secret, which the claimant cannot write.
                   Absent annotation means slot a, so a database provisioned before rotation
                   behaves deterministically instead of ambiguously. */}}
            {{- $credentialSlots := dict "a" "b" "b" "a" }}
            {{- $secretAnnotations := dig "metadata" "annotations" (dict) $appSecretManifest }}
            {{- $activeSlot := dig "platform.openkubes.ai/active-credential-slot" "a" $secretAnnotations }}
            {{- if not (hasKey $credentialSlots $activeSlot) }}
            {{- fail (printf "credential slot %q is not one of a/b: refusing to compose a Database whose active login role cannot be determined" $activeSlot) }}
            {{- end }}
            {{- $previousSlot := index $credentialSlots $activeSlot }}
            {{- $ownerRole := "app" }}
            {{- $activeRole := printf "app_%s" $activeSlot }}
            {{- $previousRole := printf "app_%s" $previousSlot }}
            {{- /* The window is an attribute of the protection class, like gracePeriod. production
                   is SHORTER on purpose: a previous credential that still authenticates is
                   standing exposure, and production consumers are expected to reload promptly.
                   development is generous because dev consumers restart lazily and the cost of a
                   stale credential there is an outage, not a breach. */}}
            {{- $credentialOverlapWindow := ternary "PT1H" "PT24H" $isProduction }}
            {{- $credentialOverlapSeconds := ternary 3600 86400 $isProduction }}
            {{- $rotatedAt := include "canonicalRFC3339" (dig "platform.openkubes.ai/credential-rotated-at" "" $secretAnnotations) }}
            {{- $previousValidUntil := "" }}
            {{- $previousCredentialAccepted := false }}
            {{- if ne $rotatedAt "" }}
            {{- $previousExpiry := dateModify (printf "+%ds" (int $credentialOverlapSeconds)) (toDate $layout $rotatedAt) }}
            {{- $previousValidUntil = date $layout $previousExpiry }}
            {{- $previousCredentialAccepted = not (now.After $previousExpiry) }}
            {{- end }}

            {{- $publishedCredentialVersion := dig "metadata" "resourceVersion" "" $appSecretManifest }}
            {{- $appliedCredentialVersion := dig "managedRolesStatus" "passwordStatus" $activeRole "resourceVersion" "" $clusterStatus }}
            {{- $credentialTransactionId := dig "managedRolesStatus" "passwordStatus" $activeRole "transactionID" 0 $clusterStatus }}
            {{- $credentialReconciled := false }}
            {{- range $role := dig "managedRolesStatus" "byStatus" "reconciled" (list) $clusterStatus }}
            {{- if eq $role $activeRole }}{{- $credentialReconciled = true }}{{- end }}
            {{- end }}
            {{- $credentialApplied := and $credentialReconciled (ne $publishedCredentialVersion "") (eq $publishedCredentialVersion $appliedCredentialVersion) }}
            {{- $credentialReason := "AwaitingCredentialPublication" }}
            {{- if and (ne $publishedCredentialVersion "") (not $credentialApplied) }}{{- $credentialReason = "AwaitingCredentialApplication" }}{{- end }}
            {{- if $credentialApplied }}{{- $credentialReason = "CredentialApplied" }}{{- end }}

            {{- /* Capability evidence (§13 bound 4). status.pgDataImageInfo can only ever justify
                   Pending: on ok-robotics it carries a pinned pgvector digest on a cluster where
                   CREATE EXTENSION vector fails, so the declaration and the function disagree and
                   only a probe settles it.

                   Admissibility binds the XR identity AND the running image digest. The digest
                   term is what §6.3 requires — capability, upgrade and evidence are coupled, so a
                   proof taken against a different image says nothing about this one, and an image
                   change must VOID it rather than be tolerated. A proof whose digest is not the
                   digest currently running is not selected at all. */}}
            {{- $selectedCapability := dict }}
            {{- $selectedCapabilityCompletedAt := "1970-01-01T00:00:00Z" }}
            {{- $canonicalSelectedCapabilityCompletedAt := include "canonicalRFC3339" $selectedCapabilityCompletedAt }}
            {{- $runningImageDigest := "" }}
            {{- $runningImage := dig "pgDataImageInfo" "image" "" $clusterStatus }}
            {{- if contains "@sha256:" $runningImage }}
            {{- $runningImageDigest = printf "sha256:%s" (last (splitList "@sha256:" $runningImage)) }}
            {{- end }}
            {{- $capabilityResults := index $extraResources "capability-evidence" | default (dict "items" (list)) }}
            {{- range $required := dig "items" (list) $capabilityResults }}
            {{- $candidate := dig "resource" (dict) $required }}
            {{- $candidateSpec := dig "spec" (dict) $candidate }}
            {{- $capability := dig "capability" (dict) $candidateSpec }}
            {{- $capDatabaseRef := dig "databaseRef" (dict) $candidateSpec }}
            {{- $capClusterRef := dig "clusterRef" (dict) $candidateSpec }}
            {{- $capDelivery := dig "delivery" (dict) $candidateSpec }}
            {{- $canonicalCapCompletedAt := include "canonicalRFC3339" (dig "timing" "completedAt" "" $candidateSpec) }}
            {{- /* All five named checks must be present AND carry an observed value. The CRD
                   enforces the set server-side; re-checking means a proof admitted by some other
                   path still cannot be selected. */}}
            {{- $observedCheckNames := list }}
            {{- $checksComplete := true }}
            {{- $distanceHonest := false }}
            {{- $residueClean := false }}
            {{- range $check := dig "checks" (list) $candidateSpec }}
            {{- $checkName := dig "name" "" $check }}
            {{- $checkObserved := dig "observed" (dict) $check }}
            {{- $observedCheckNames = append $observedCheckNames $checkName }}
            {{- if lt (len $checkObserved) 1 }}{{- $checksComplete = false }}{{- end }}
            {{- /* The distance the operator RETURNED must equal the distance the probe expected.
                   Ordering alone is satisfied by a stub returning a constant, so this is the term
                   that separates a working operator from a plausible one. */}}
            {{- if eq $checkName "operator-returns-true-distance" }}
            {{- $capDistance := dig "farthestDistance" "" $checkObserved }}
            {{- if and (ne $capDistance "") (eq $capDistance (dig "expectedFarthestDistance" "" $checkObserved)) }}
            {{- $distanceHonest = true }}
            {{- end }}
            {{- end }}
            {{- if eq $checkName "probe-left-no-residue" }}
            {{- if eq (dig "probeTablesRemaining" -1 $checkObserved) 0 }}{{- $residueClean = true }}{{- end }}
            {{- end }}
            {{- end }}
            {{- range $expected := list "catalog-lists-extension" "extension-created" "operator-orders-by-distance" "operator-returns-true-distance" "probe-left-no-residue" }}
            {{- if not (has $expected $observedCheckNames) }}{{- $checksComplete = false }}{{- end }}
            {{- end }}
            {{- $capabilityAdmissible := and
                  (eq (dig "apiVersion" "" $candidate) "evidence.platform.openkubes.ai/v1alpha1")
                  (eq (dig "kind" "" $candidate) "CapabilityVerified")
                  (eq (dig "name" "" $capability) "postgresql.extension.pgvector")
                  (ne (dig "observedVersion" "" $capability) "")
                  (eq (dig "apiVersion" "" $capDatabaseRef) $xr.apiVersion)
                  (eq (dig "kind" "" $capDatabaseRef) $xr.kind)
                  (eq (dig "name" "" $capDatabaseRef) $xr.metadata.name)
                  (eq (dig "uid" "" $capDatabaseRef) $xr.metadata.uid)
                  (eq (dig "uid" "" $capClusterRef) (dig "metadata" "uid" "" $clusterManifest))
                  (eq (dig "namespace" "" $capClusterRef) $namespace)
                  (eq (dig "name" "" $capClusterRef) $dbName)
                  (ne $runningImageDigest "")
                  (eq (dig "imageDigest" "" $capDelivery) $runningImageDigest)
                  (ne $canonicalCapCompletedAt "")
                  (not ((toDate $layout $canonicalCapCompletedAt).After now))
                  (ne (dig "probeDigest" "" $candidateSpec) "")
                  $checksComplete
                  $distanceHonest
                  $residueClean }}
            {{- if and $capabilityAdmissible ((toDate $layout $canonicalCapCompletedAt).After (toDate $layout $canonicalSelectedCapabilityCompletedAt)) }}
            {{- $selectedCapability = $candidate }}
            {{- $selectedCapabilityCompletedAt = $canonicalCapCompletedAt }}
            {{- $canonicalSelectedCapabilityCompletedAt = $canonicalCapCompletedAt }}
            {{- end }}
            {{- end }}
            {{- $capabilityEvidenceRef := printf "Cluster/%s/%s#status.pgDataImageInfo" $namespace $dbName }}
            {{- if and $clusterReady (hasKey $clusterStatus "targetPgDataImageInfo") }}
            {{- $capabilityState = "Pending" }}
            {{- $capabilityReason = "UpgradeVerificationPending" }}
            {{- else if $clusterReady }}
            {{- if not $requestedPgvector }}
            {{- $capabilityState = "Valid" }}
            {{- $capabilityReason = "NoCapabilitiesRequested" }}
            {{- else if gt (len $selectedCapability) 0 }}
            {{- $capabilityState = "Valid" }}
            {{- $capabilityReason = "CapabilityProvenByFunction" }}
            {{- $capabilityObservedAt = $selectedCapabilityCompletedAt }}
            {{- $capabilityEvidenceRef = printf "CapabilityVerified/%s" (dig "metadata" "name" "" $selectedCapability) }}
            {{- else if $pgvectorObserved }}
            {{- /* Declared present, never exercised. Pending, never Valid — this is the state
                   ok-robotics reports, and calling it Valid is the substitution bound 4 exists
                   to prevent. */}}
            {{- $capabilityState = "Pending" }}
            {{- $capabilityReason = "CapabilityProbePending" }}
            {{- else }}
            {{- $capabilityState = "Failed" }}
            {{- $capabilityReason = "RequestedCapabilityAbsent" }}
            {{- end }}
            {{- end }}

            {{- /* Residency resolution (§13 bound 7, closing §6.1). Residency was absent from v1
                   rather than claimant-writable and dangling, because a `dataPolicyRef` with no
                   policy object and no resolver names nothing. Both now exist.

                   The asymmetry that makes this safe to expose: a policy states where data MAY
                   come to rest; it never places data. Placement stays platform-side in
                   $backupStores above, so a claimant naming a strict policy can render its own
                   Database non-conformant — it cannot redirect its storage anywhere.

                   Fail-closed on a dangling reference. A named policy that does not resolve is
                   the exact defect this bound is about, and treating it as "no constraint" would
                   turn a governance statement into silence. Absent ref = no residency claim,
                   which is different from an unresolvable one and is reported differently. */}}
            {{- $residencyState := "Unknown" }}
            {{- $residencyReason := "NoResidencyPolicyRequested" }}
            {{- $residencyZone := dig "residencyZone" "" $store }}
            {{- $dataPolicyName := dig "dataPolicyRef" "name" "" $spec }}
            {{- $residencyPolicy := "" }}
            {{- $residencyAllowed := list }}
            {{- if ne $dataPolicyName "" }}
            {{- $policyResults := index $extraResources "data-policy" | default (dict "items" (list)) }}
            {{- range $required := dig "items" (list) $policyResults }}
            {{- $candidate := dig "resource" (dict) $required }}
            {{- if and (eq (dig "kind" "" $candidate) "DataPolicy") (eq (dig "metadata" "name" "" $candidate) $dataPolicyName) }}
            {{- $residencyPolicy = $dataPolicyName }}
            {{- $residencyAllowed = dig "spec" "residency" "allowedZones" (list) $candidate }}
            {{- end }}
            {{- end }}
            {{- if eq $residencyPolicy "" }}
            {{- /* Unresolvable, not unconstrained. Failed, because the claim asked for a
                   guarantee the platform cannot evaluate — and Unknown would read as
                   "we could not look", which is not what happened: we looked and it is absent. */}}
            {{- $residencyState = "Failed" }}
            {{- $residencyReason = "DataPolicyUnresolved" }}
            {{- else if eq $residencyZone "" }}
            {{- $residencyState = "Unknown" }}
            {{- $residencyReason = "StoreResidencyZoneUndeclared" }}
            {{- else if has $residencyZone $residencyAllowed }}
            {{- $residencyState = "Valid" }}
            {{- $residencyReason = "ResidencyWithinPolicy" }}
            {{- else }}
            {{- $residencyState = "Failed" }}
            {{- $residencyReason = "ResidencyOutsidePolicy" }}
            {{- end }}
            {{- end }}

            {{- /* Observation freshness (ADR-Platform-032 §13 bound 5). Every observedAt above is
                   a SOURCE event time — lastTransitionTime, stoppedAt, lastSuccessfulBackupTime —
                   so nothing else in this status says when the platform last successfully LOOKED.
                   The asymmetry that makes this necessary: a frozen read-back under a live
                   reconciler still degrades, because the ageing checks keep re-evaluating against
                   current time, but a frozen RECONCILER cannot degrade at all. Its last verdict
                   persists verbatim and, every timestamp in it being a real source event, reads as
                   a recent and definite Valid forever. Measured on ok-mgmt 2026-08-19: the live
                   XR held ONE resourceVersion across 350s of 5s sampling — zero status writes from
                   a healthy composite — because status is written only when it changes. So "nothing
                   moved" and "nobody is looking" are byte-identical over any window that matters.

                   `now` is the only clock available here; observed state carries no observation
                   time. Emitting it raw would rewrite status on every reconcile, so it is floored
                   to $observationQuantumSeconds. That trade is the whole reason `quantum` is
                   published rather than assumed: observedThrough is never AHEAD of the real
                   observation and never more than one quantum behind it.

                   freshnessBound is the stated bound the acceptance criterion asks for. A reader
                   MUST treat every dimension above as unproven — regardless of the state it
                   reports — once observedThrough is older than this. It exceeds quantum plus the
                   measured --poll-interval=1m, so a healthy platform never trips it; the
                   arithmetic is asserted by observation-freshness-check.py rather than trusted.
                   This Composition cannot evaluate its own freshness and does not pretend to:
                   while it runs it is fresh by construction. The verdict belongs to the reader,
                   which is why the bound is published as data instead of folded into
                   serviceReady. */}}
            {{- $observationQuantumSeconds := 300 }}
            {{- $observationFreshnessBound := "PT15M" }}
            {{- $observationEpoch := now | unixEpoch | int64 }}
            {{- $observedThrough := dateInZone "2006-01-02T15:04:05Z07:00" (mul (div $observationEpoch $observationQuantumSeconds) $observationQuantumSeconds) "UTC" }}
            {{- if not (include "canonicalRFC3339" $observedThrough) }}
            {{- fail (printf "refusing to publish a non-canonical observation instant %q: an unparseable observedThrough would make freshness unevaluable while still looking present" $observedThrough) }}
            {{- end }}

            {{- /* DatabaseServiceReady is policy only, never a fifth sensor. */}}
            {{- $serviceReady := false }}
            {{- $serviceReadyReason := "EvidencePolicyUnsatisfied" }}
            {{- if $isProduction }}
            {{- if and (eq $operationalState "Valid") (eq $protectionState "Valid") (eq $recoveryState "Valid") (eq $capabilityState "Valid") }}
            {{- $serviceReady = true }}
            {{- $serviceReadyReason = "ProductionEvidenceValid" }}
            {{- end }}
            {{- else if and (eq $operationalState "Valid") (or (eq $recoveryState "Valid") (and (eq $protectionState "Unknown") (eq $protectionReason "AwaitingFirstBackup") (eq $recoveryState "Unknown") (eq $recoveryReason "VerificationPending"))) }}
            {{- $serviceReady = true }}
            {{- $serviceReadyReason = ternary "DevelopmentEvidenceValid" "DevelopmentBootstrapAllowed" (eq $recoveryState "Valid") }}
            {{- end }}

            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              restore-evidence:
                apiVersion: evidence.platform.openkubes.ai/v1alpha1
                kind: RestoreVerified
                matchLabels:
                  platform.openkubes.ai/source-cluster: {{ $dbName | quote }}
              capability-evidence:
                apiVersion: evidence.platform.openkubes.ai/v1alpha1
                kind: CapabilityVerified
                matchLabels:
                  platform.openkubes.ai/source-cluster: {{ $dbName | quote }}
              {{- if $isProduction }}
              archive-freshness:
                apiVersion: evidence.platform.openkubes.ai/v1alpha1
                kind: ArchiveFreshness
                matchLabels:
                  platform.openkubes.ai/source-cluster: {{ $dbName | quote }}
              {{- end }}
              {{- if ne $dataPolicyName "" }}
              data-policy:
                apiVersion: platform.openkubes.ai/v1alpha1
                kind: DataPolicy
                matchName: {{ $dataPolicyName | quote }}
              {{- end }}
            ---
            # Mirror only the fixed, admission-authorized app Secret. Values are
            # never templated into this Composition; provider-kubernetes resolves
            # the management-plane reference at reconciliation time.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: database-{{ $dbName }}-app-secret
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: app-secret
            spec:
              deletionPolicy: Orphan
              providerConfigRef:
                name: {{ $provider | quote }}
              references:
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    name: {{ $spec.credentialsSecretRef.name | quote }}
                    namespace: {{ $spec.credentialsSecretRef.namespace | quote }}
                    fieldPath: data
                  toFieldPath: data
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $spec.credentialsSecretRef.name | quote }}
                    namespace: {{ $namespace | quote }}
                    labels:
                      app.kubernetes.io/part-of: openkubes-database-postgresql
                      cnpg.io/reload: "true"
                  type: kubernetes.io/basic-auth
            ---
            # Claim-scoped governed catalog: PostgreSQL 18 plus the sole v1
            # allowlisted extension image. Claims select a capability name, not
            # an arbitrary image reference.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: database-{{ $dbName }}-image-catalog
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: image-catalog
            spec:
              deletionPolicy: Orphan
              providerConfigRef:
                name: {{ $provider | quote }}
              forProvider:
                manifest:
                  apiVersion: postgresql.cnpg.io/v1
                  kind: ClusterImageCatalog
                  metadata:
                    name: {{ $catalogName | quote }}
                    labels:
                      app.kubernetes.io/part-of: openkubes-database-postgresql
                      images.cnpg.io/date: "20260815"
                      images.cnpg.io/publisher: cnpg.io
                      images.cnpg.io/type: minimal
                      images.cnpg.io/os: trixie
                  spec:
                    images:
                      - major: 18
                        image: ghcr.io/cloudnative-pg/postgresql:18.6-202608131513-minimal-trixie@sha256:e488b1434919f455f2ee4e18a181ce9b33f34cdd8dfb821126855486bce6ad34
                        extensions:
                          - name: pgvector
                            image:
                              reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-202608090042-18-trixie@sha256:c3fe71d306fe3dfad4e71b2585c58034c2da5f234a18cd4b964ed03e1dc858a9
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: database-{{ $dbName }}-object-store
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: object-store
            spec:
              deletionPolicy: Orphan
              providerConfigRef:
                name: {{ $provider | quote }}
              forProvider:
                manifest:
                  apiVersion: barmancloud.cnpg.io/v1
                  kind: ObjectStore
                  metadata:
                    name: {{ $objectStoreName | quote }}
                    namespace: {{ $namespace | quote }}
                  spec:
                    configuration:
                      # The plugin appends serverName below, yielding exactly
                      # ok-db-backups/<database-cluster>/.
                      #
                      # destinationPath and endpointURL come from the platform-owned
                      # $backupStores registry above, never from the Claim. The `s3://`
                      # scheme and the s3Credentials/arn:aws:s3 vocabulary below are the
                      # plugin's and MinIO's own S3-compatible syntax — the backend is
                      # selected by endpointURL, which is MinIO, not AWS.
                      destinationPath: s3://{{ $store.bucket }}
                      endpointURL: {{ $store.endpointURL | quote }}
                      endpointCA:
                        name: {{ $store.endpointCA | quote }}
                        key: ca.crt
                      # No `encryption` is set: at-rest encryption belongs to the data
                      # policy of ADR-Platform-032 §6.1, which §12 explicitly defers out
                      # of v1. Stated rather than left blank so an unset field is not read
                      # as a handled one.
                      # Named for the ROLE it holds, not for the bucket: this is the
                      # database's own write identity for its own server folder. The drill's
                      # read-only source identity is a different Secret
                      # (ok-db-backups-<cluster>-reader) and the two must never resolve to
                      # the same object — drill/tests assert that separately, and the
                      # render check asserts this one is not a reader.
                      s3Credentials:
                        accessKeyId:
                          name: {{ printf "ok-db-backups-%s-writer" $dbName | quote }}
                          key: ACCESS_KEY_ID
                        secretAccessKey:
                          name: {{ printf "ok-db-backups-%s-writer" $dbName | quote }}
                          key: ACCESS_SECRET_KEY
                      wal:
                        compression: gzip
                      data:
                        compression: gzip
                    # Retention is a freshness boundary, not just housekeeping: it is what
                    # prunes an object-store backup out from under a still-present Backup
                    # CR, which is the failure ADR-Platform-032 §11.1 builds three separate
                    # signals to catch. Changing it moves that boundary.
                    retentionPolicy: {{ $retention | quote }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: database-{{ $dbName }}-cluster
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database-cluster
            spec:
              # The database/PVC lifecycle is never coupled to Claim deletion.
              deletionPolicy: Orphan
              providerConfigRef:
                name: {{ $provider | quote }}
              forProvider:
                manifest:
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: {{ $dbName | quote }}
                    namespace: {{ $namespace | quote }}
                    labels:
                      app.kubernetes.io/part-of: openkubes-database-postgresql
                    {{- /* The capability probe runs on the WORKLOAD cluster, where the Database
                           XR does not exist: the composed CNPG Cluster carries no ownerRef back
                           to it and the XR lives on the management plane. Without these two
                           annotations the probe cannot bind its artifact to a Database, and
                           taking the uid as an argument would be exactly the substitution bound 4
                           exists to prevent — a caller could name any Database.
                           The composer therefore stamps the binding it alone knows. A probe run
                           against a standalone cluster finds no annotation and emits an artifact
                           with databaseRef OMITTED, which the API server refuses, so the same
                           script yields admissible evidence only where the platform composed the
                           database. There is no flag to get wrong. */}}
                    annotations:
                      platform.openkubes.ai/database-name: {{ $xr.metadata.name | quote }}
                      platform.openkubes.ai/database-uid: {{ $xr.metadata.uid | quote }}
                  spec:
                    instances: {{ $instances }}
                    enableSuperuserAccess: false
                    {{- if gt $instances 1 }}
                    primaryUpdateStrategy: supervised
                    {{- end }}
                    imageCatalogRef:
                      apiGroup: postgresql.cnpg.io
                      kind: ClusterImageCatalog
                      name: {{ $catalogName | quote }}
                      major: 18
                    bootstrap:
                      initdb:
                        database: app
                        owner: app
                        secret:
                          name: {{ $spec.credentialsSecretRef.name | quote }}
                    managed:
                      roles:
                        # `app` owns the database and its objects and is deliberately NOLOGIN:
                        # it is the shared privilege role, so neither login role holds the grants
                        # directly and rotating either one cannot change ownership.
                        - name: {{ $ownerRole | quote }}
                          ensure: present
                          login: false
                        # Two login roles, two verifiers, therefore a real overlap. Each has its
                        # own Secret, derived platform-side from the admission-authorized name so
                        # the authority tuple still binds exactly one claimant-visible Secret.
                        - name: {{ printf "app_%s" "a" | quote }}
                          ensure: present
                          login: true
                          inRoles: [{{ $ownerRole | quote }}]
                          passwordSecret:
                            name: {{ printf "%s-a" $spec.credentialsSecretRef.name | quote }}
                        - name: {{ printf "app_%s" "b" | quote }}
                          ensure: present
                          login: true
                          inRoles: [{{ $ownerRole | quote }}]
                          passwordSecret:
                            name: {{ printf "%s-b" $spec.credentialsSecretRef.name | quote }}
                    storage:
                      storageClass: local-path
                      size: {{ $storageSize }}
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: "2"
                        memory: 2Gi
                    plugins:
                      - name: barman-cloud.cloudnative-pg.io
                        isWALArchiver: true
                        parameters:
                          barmanObjectName: {{ $objectStoreName | quote }}
                          serverName: {{ $dbName | quote }}
                    {{- if $requestedPgvector }}
                    postgresql:
                      extensions:
                        - name: pgvector
                    {{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: database-{{ $dbName }}-scheduled-backup
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: scheduled-backup
            spec:
              deletionPolicy: Orphan
              providerConfigRef:
                name: {{ $provider | quote }}
              forProvider:
                manifest:
                  apiVersion: postgresql.cnpg.io/v1
                  kind: ScheduledBackup
                  metadata:
                    name: {{ printf "%s-daily" $dbName | quote }}
                    namespace: {{ $namespace | quote }}
                  spec:
                    schedule: "0 0 1 * * *"
                    backupOwnerReference: self
                    cluster:
                      name: {{ $dbName | quote }}
                    method: plugin
                    pluginConfiguration:
                      name: barman-cloud.cloudnative-pg.io
            ---
            # A deterministic first Backup gives the Evidence Contract an
            # actual Backup.status to observe locally and at runtime. Scheduled
            # backups remain the recurring protection mechanism.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: database-{{ $dbName }}-evidence-backup
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: evidence-backup
            spec:
              deletionPolicy: Orphan
              providerConfigRef:
                name: {{ $provider | quote }}
              forProvider:
                manifest:
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Backup
                  metadata:
                    name: {{ $evidenceBackupName | quote }}
                    namespace: {{ $namespace | quote }}
                  spec:
                    cluster:
                      name: {{ $dbName | quote }}
                    method: plugin
                    pluginConfiguration:
                      name: barman-cloud.cloudnative-pg.io
            {{- if $spec.connectivity.pooling.enabled }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: database-{{ $dbName }}-pooler
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pooler
            spec:
              deletionPolicy: Delete
              providerConfigRef:
                name: {{ $provider | quote }}
              forProvider:
                manifest:
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Pooler
                  {{- /* NOT "<cluster>-rw": a Pooler's name becomes its Service name, and CNPG
                         already owns Services <cluster>-rw, -ro and -r for the Cluster itself.
                         Composing a Pooler called ok-robotics-rw left it phase=inactive for 28h
                         on ok-robotics, re-emitting InvalidOwnership every ~2 minutes, because
                         Service/ok-robotics-rw carries ownerReferences Cluster/ok-robotics and
                         the Pooler may not adopt it. $dbName is capped at 52 characters, so the
                         10-character suffix still leaves the Service name inside 63. */}}
                  metadata:
                    name: {{ printf "%s-pooler-rw" $dbName | quote }}
                    namespace: {{ $namespace | quote }}
                  spec:
                    cluster:
                      name: {{ $dbName | quote }}
                    instances: {{ ternary 2 1 $isProduction }}
                    type: rw
                    pgbouncer:
                      poolMode: {{ $spec.connectivity.pooling.mode }}
                      parameters:
                        max_client_conn: "1000"
                        default_pool_size: "20"
            {{- end }}
            ---
            apiVersion: platform.openkubes.ai/v1alpha1
            kind: Database
            status:
              evidence:
                operational:
                  state: {{ $operationalState }}
                  reason: {{ $operationalReason }}
                  observedAt: {{ $operationalObservedAt | quote }}
                  evidenceRef: {{ printf "Cluster/%s/%s" $namespace $dbName | quote }}
                protection:
                  state: {{ $protectionState }}
                  reason: {{ $protectionReason }}
                  observedAt: {{ $protectionObservedAt | quote }}
                  {{- if ne $protectionValidUntil "" }}
                  validUntil: {{ $protectionValidUntil | quote }}
                  {{- end }}
                  {{- if ne $protectionEvidenceRef "" }}
                  evidenceRef: {{ $protectionEvidenceRef | quote }}
                  {{- end }}
                  {{- if ne $protectionBackupId "" }}
                  backupId: {{ $protectionBackupId | quote }}
                  {{- end }}
                  signals:
                    execution:
                      state: {{ $executionState }}
                      reason: {{ $executionReason }}
                      observedAt: {{ $executionObservedAt | quote }}
                      {{- if ne $backupId "" }}
                      backupId: {{ $backupId | quote }}
                      {{- end }}
                      {{- if ne $canonicalBackupStoppedAt "" }}
                      stoppedAt: {{ $canonicalBackupStoppedAt | quote }}
                      {{- end }}
                    availability:
                      state: {{ $availabilityState }}
                      reason: {{ $availabilityReason }}
                      observedAt: {{ $availabilityObservedAt | quote }}
                      {{- if ne $canonicalFirstRecoverabilityPoint "" }}
                      firstRecoverabilityPoint: {{ $canonicalFirstRecoverabilityPoint | quote }}
                      {{- end }}
                      {{- if ne $canonicalLastSuccessfulBackupTime "" }}
                      lastSuccessfulBackupTime: {{ $canonicalLastSuccessfulBackupTime | quote }}
                      {{- end }}
                      {{- if ne $canonicalLastFailedBackupTime "" }}
                      lastFailedBackupTime: {{ $canonicalLastFailedBackupTime | quote }}
                      {{- end }}
                    archiving:
                      state: {{ $archivingState }}
                      reason: {{ $archivingReason }}
                      observedAt: {{ $archivingObservedAt | quote }}
                    rpo:
                      state: {{ $rpoState }}
                      reason: {{ $rpoReason }}
                      observedAt: {{ $rpoObservedAt | quote }}
                      {{- if ge $rpoLagSeconds 0 }}
                      walLagSeconds: {{ $rpoLagSeconds }}
                      maxWalLagSeconds: {{ $rpoMaxWalLagSeconds }}
                      {{- end }}
                recovery:
                  state: {{ $recoveryState }}
                  reason: {{ $recoveryReason }}
                  observedAt: {{ $recoveryObservedAt | quote }}
                  {{- if ne $recoveryValidUntil "" }}
                  validUntil: {{ $recoveryValidUntil | quote }}
                  {{- end }}
                  {{- if ne $recoveryEvidenceRef "" }}
                  evidenceRef: {{ $recoveryEvidenceRef | quote }}
                  {{- end }}
                  {{- if ne $recoveryBackupId "" }}
                  backupId: {{ $recoveryBackupId | quote }}
                  {{- end }}
                  {{- if ne $recoveryTarget "" }}
                  recoveryTarget: {{ $recoveryTarget | quote }}
                  {{- end }}
                  {{- if ne $verifierVersion "" }}
                  verifierVersion: {{ $verifierVersion | quote }}
                  {{- end }}
                capability:
                  state: {{ $capabilityState }}
                  reason: {{ $capabilityReason }}
                  observedAt: {{ $capabilityObservedAt | quote }}
                  evidenceRef: {{ $capabilityEvidenceRef | quote }}
              observation:
                observedThrough: {{ $observedThrough | quote }}
                quantum: {{ printf "PT%dS" (int $observationQuantumSeconds) | quote }}
                freshnessBound: {{ $observationFreshnessBound | quote }}
              residency:
                state: {{ $residencyState }}
                reason: {{ $residencyReason }}
                {{- if ne $residencyZone "" }}
                zone: {{ $residencyZone | quote }}
                {{- end }}
                {{- if ne $residencyPolicy "" }}
                policyRef: {{ $residencyPolicy | quote }}
                {{- end }}
              serviceReady: {{ $serviceReady }}
              serviceReadyReason: {{ $serviceReadyReason }}
              credentials:
                applied: {{ $credentialApplied }}
                reason: {{ $credentialReason }}
                activeRole: {{ $activeRole | quote }}
                previousRole: {{ $previousRole | quote }}
                overlapWindow: {{ $credentialOverlapWindow | quote }}
                previousCredentialAccepted: {{ $previousCredentialAccepted }}
                {{- if ne $previousValidUntil "" }}
                previousValidUntil: {{ $previousValidUntil | quote }}
                {{- end }}
                observedAt: {{ $operationalObservedAt | quote }}
                {{- if ne $publishedCredentialVersion "" }}
                publishedResourceVersion: {{ $publishedCredentialVersion | quote }}
                {{- end }}
                {{- if ne $appliedCredentialVersion "" }}
                appliedResourceVersion: {{ $appliedCredentialVersion | quote }}
                {{- end }}
                {{- if gt (int64 $credentialTransactionId) 0 }}
                transactionId: {{ $credentialTransactionId }}
                {{- end }}
