# Reference development claim. It contains only Secret selectors; no credential values.
apiVersion: platform.openkubes.ai/v1alpha1
kind: DatabaseClaim
metadata:
  name: ok-robotics
  namespace: openkubes-system
spec:
  clusterRef: ok-robotics
  namespace: database-ok-robotics
  credentialsSecretRef:
    name: database-ok-robotics-app
    namespace: crossplane-system
  engine:
    name: postgresql
    majorVersion: 18
    capabilities:
      - name: postgresql.extension.pgvector
        versionPolicy: platform
  performance:
    class: standard
  availability:
    mode: single
  connectivity:
    pooling:
      enabled: true
      mode: transaction
  protection:
    policyRef: development
  maintenance:
    upgradePolicy: controlled
    windowRef: saturday-night
    majorVersionStrategy: blueGreen
  isolation:
    class: dedicated
