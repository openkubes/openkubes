replicaCount: 1

image:
  repository: ghcr.io/project-zot/zot
  pullPolicy: IfNotPresent
  tag: "v2.1.20@sha256:542e25be4d32e7879c0cfad93492a93c81b1e059cbd2d30d485d4bd567318234"

serviceAccount:
  create: false
  name: zot

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false

httproute:
  enabled: false

listenerset:
  enabled: false

httpGet:
  scheme: HTTPS
  port: 5000

mountConfig: true
configFiles:
  config.json: |-
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "1h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "externalUrl": "https://registry.ok-shared.internal",
        "realm": "registry-default",
        "tls": {
          "cert": "/tls/tls.crt",
          "key": "/tls/tls.key"
        },
        "auth": {
          "htpasswd": {
            "path": "/auth/htpasswd"
          },
          "sessionKeysFile": "/oidc/session-keys.json",
          "apikey": true,
          "openid": {
            "providers": {
              "oidc": {
                "name": "OpenKubes central identity",
                "issuer": "https://keycloak.ok-shared.internal/realms/openkubes",
                "credentialsFile": "/oidc/credentials.json",
                "scopes": ["openid", "profile", "email"],
                "claimMapping": {
                  "username": "preferred_username",
                  "groups": "groups"
                }
              }
            }
          },
          "failDelay": 2
        },
        "accessControl": {
          "metrics": {
            "users": ["zot-metrics"]
          },
          "repositories": {
            "openkubes/human/**": {
              "policies": [
                {
                  "groups": ["registry-writers"],
                  "actions": ["read", "create", "update", "delete"]
                },
                {
                  "groups": ["registry-readers"],
                  "actions": ["read"]
                }
              ],
              "defaultPolicy": []
            },
            "openkubes/machine/**": {
              "policies": [
                {
                  "users": ["zot-machine"],
                  "actions": ["read", "create", "update", "delete"]
                },
                {
                  "users": ["zot-puller"],
                  "actions": ["read"]
                }
              ],
              "defaultPolicy": []
            },
            "**": {
              "defaultPolicy": []
            }
          },
          "adminPolicy": {
            "groups": ["platform-admins"],
            "actions": ["read", "create", "update", "delete"]
          }
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        },
        "scrub": {
          "enable": true,
          "interval": "24h"
        }
      }
    }

externalSecrets:
  - secretName: zot-server-tls
    mountPath: /tls
  - secretName: zot-htpasswd
    mountPath: /auth
  - secretName: zot-oidc
    mountPath: /oidc

env:
  - name: SSL_CERT_FILE
    value: /tls/ca.crt

persistence: true
pvc:
  create: true
  accessModes:
    - ReadWriteOnce
  storage: 20Gi
  storageClassName: local-path

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
