apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: zot-contract
    app.kubernetes.io/part-of: registry-default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot-contract
    spec:
      restartPolicy: Never
      serviceAccountName: zot-contract
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
        - ip: "${REGISTRY_LB}"
          hostnames:
            - ${REGISTRY_HOST}
      containers:
        - name: contract
          image: docker.io/library/python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
          imagePullPolicy: IfNotPresent
          command: ["python3", "/contract/in-cluster-contract.py"]
          env:
            - name: REGISTRY_HOST
              value: ${REGISTRY_HOST}
            - name: RUN_ID
              value: ${RUN_ID}
          volumeMounts:
            - name: script
              mountPath: /contract
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      volumes:
        - name: script
          configMap:
            name: zot-contract-script
        - name: ca
          secret:
            secretName: ${TLS_SECRET}
            items:
              - key: ca.crt
                path: ca.crt
        - name: auth
          secret:
            secretName: ${MACHINE_SECRET}
            items:
              - key: machine-username
                path: username
              - key: machine-password
                path: password
