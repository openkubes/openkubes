apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${TLS_SECRET}
  namespace: ${NAMESPACE}
spec:
  secretName: ${TLS_SECRET}
  issuerRef:
    name: ${TLS_ISSUER}
    kind: ClusterIssuer
  commonName: ${REGISTRY_HOST}
  dnsNames:
    - ${REGISTRY_HOST}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: ${RELEASE}
  namespace: ${NAMESPACE}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`${REGISTRY_HOST}`)
      services:
        - name: ${RELEASE}
          port: 5000
  tls:
    passthrough: true
