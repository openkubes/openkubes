apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ${RELEASE}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: registry-default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
      app.kubernetes.io/instance: ${RELEASE}
  namespaceSelector:
    matchNames:
      - ${NAMESPACE}
  endpoints:
    - port: zot
      interval: 30s
      path: /metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: ${TLS_SECRET}
            key: ca.crt
        serverName: ${REGISTRY_HOST}
      basicAuth:
        username:
          name: ${MACHINE_SECRET}
          key: metrics-username
        password:
          name: ${MACHINE_SECRET}
          key: metrics-password
