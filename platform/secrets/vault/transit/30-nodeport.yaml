# Fixed NodePort for the Transit Vault on ok-mgmt (OK-114). Applied to ok-mgmt.
# The ok-infra LoadBalancer (40-ok-infra-lb.yaml) forwards 192.168.100.208:8200 to
# this NodePort on the ok-mgmt CP VM. Fixed port so the LB targetPort is stable.
apiVersion: v1
kind: Service
metadata:
  name: vault-transit-nodeport
  namespace: vault-transit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault-transit
    component: server
  ports:
    - name: https
      port: 8200
      targetPort: 8200
      nodePort: 31820
      protocol: TCP
