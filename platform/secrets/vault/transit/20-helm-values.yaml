# hashicorp/vault Helm values — dedicated Transit Vault for ok-shared auto-unseal (OK-114).
# Applied to ok-mgmt: `helm install vault-transit hashicorp/vault -n vault-transit -f 20-helm-values.yaml`.
# Standalone (file storage) single node; own Shamir seal (init out of band, verified custody).
global:
  enabled: true
  tlsDisable: false
injector:
  enabled: false
server:
  image:
    repository: hashicorp/vault
    tag: "1.20.1"
  standalone:
    enabled: true
    config: |
      ui = false
      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file   = "/vault/userconfig/vault-transit-tls/tls.crt"
        tls_key_file    = "/vault/userconfig/vault-transit-tls/tls.key"
      }
      storage "file" {
        path = "/vault/data"
      }
      disable_mlock = true
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  extraVolumes:
    - type: secret
      name: vault-transit-tls        # cert-manager-issued (10-tls.yaml)
  extraEnvironmentVars:
    VAULT_ADDR: https://127.0.0.1:8200
    VAULT_CACERT: /vault/userconfig/vault-transit-tls/ca.crt
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  # single replica (standalone); HA is a Phase-2 concern (transit only needed at unseal time)
  affinity: ""
  service:
    enabled: true
    type: ClusterIP
