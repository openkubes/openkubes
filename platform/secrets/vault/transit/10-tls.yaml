# Transit Vault TLS (cert-manager) — OK-114. Applied to ok-mgmt.
# selfSigned -> CA -> server cert with IP SAN 192.168.100.208 (the ok-infra LB IP
# ok-shared dials). The CA (transit-ca secret, key ca.crt) is distributed to
# ok-shared for the seal "transit" tls_ca_cert.
apiVersion: v1
kind: Namespace
metadata:
  name: vault-transit
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: transit-selfsigned
  namespace: vault-transit
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: transit-ca
  namespace: vault-transit
spec:
  isCA: true
  commonName: vault-transit-ca
  secretName: transit-ca
  duration: 43800h        # 5y
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: transit-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: transit-ca-issuer
  namespace: vault-transit
spec:
  ca:
    secretName: transit-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-transit-tls
  namespace: vault-transit
spec:
  secretName: vault-transit-tls
  duration: 8760h          # 1y
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - vault-transit
    - vault-transit.vault-transit.svc
    - vault-transit.vault-transit.svc.cluster.local
  ipAddresses:
    - 192.168.100.208
    - 127.0.0.1          # so the in-pod vault CLI (VAULT_ADDR=https://127.0.0.1:8200) validates too
  issuerRef:
    name: transit-ca-issuer
    kind: Issuer
