# ok-infra LoadBalancer exposing the Transit Vault on the SDN (OK-114).
# Applied to OK-INFRA (the RKE2 host), namespace ok-mgmt — same pattern as the
# existing ok-mgmt-lb/ok-shared-lb services (selects the ok-mgmt CP virt-launcher
# pod and forwards to the VM's NodePort). NO change to RKE2 config — just a Service.
#
#   192.168.100.208:8200  ->  ok-mgmt CP VM :31820 (NodePort)  ->  transit pod
apiVersion: v1
kind: Service
metadata:
  name: vault-transit-lb
  namespace: ok-mgmt
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.208"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    cluster.x-k8s.io/cluster-name: ok-mgmt
    cluster.x-k8s.io/role: control-plane
  ports:
    - name: https
      port: 8200
      targetPort: 31820      # the ok-mgmt NodePort (30-nodeport.yaml)
      protocol: TCP
