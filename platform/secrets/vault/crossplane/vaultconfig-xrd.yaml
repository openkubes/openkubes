# VaultConfig XRD — per-registered-cluster Vault configuration (ADR-025 item 13)
#
# SCAFFOLD / DRAFT. Internal XR (NO claimNames) — created by the ADR-013
# cluster-registration Composition, one VaultConfig per consuming cluster. It
# declares that cluster's dedicated Kubernetes-auth mount + workload-scoped
# roles/policies; the actual Vault resources are provider-vault MRs rendered by
# the Composition. This is the single authoritative Day-1/2 config reconciler.
#
# Trust model (ADR-025): one auth MOUNT per cluster (auth/kubernetes/<cluster>);
# within it, roles/policies are per workload identity — never a shared
# cluster-wide role.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: vaultconfigs.platform.openkubes.ai
spec:
  group: platform.openkubes.ai
  names:
    kind: VaultConfig
    plural: vaultconfigs
  # NO claimNames — internal, registration-driven, not self-service.
  defaultCompositionRef:
    name: vaultconfig.platform.openkubes.ai
  defaultCompositionUpdatePolicy: Manual
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clusterName
                - kubernetesHost
                - reviewerJwtSecretRef
                - caCert
              x-kubernetes-validations:
                - rule: >-
                    !has(self.seedRoles) ||
                    self.seedRoles.all(s,
                      self.seedRoles.filter(other, other.appName == s.appName).size() == 1)
                  message: seedRoles appName values must be unique within a VaultConfig
                - rule: >-
                    !has(self.seedRoles) ||
                    self.seedRoles.all(s,
                      self.seedRoles.filter(other, other.name == s.name).size() == 1)
                  message: seedRoles name values must be unique within a VaultConfig
                - rule: >-
                    !has(self.seedRoles) || !has(self.roles) ||
                    self.seedRoles.all(s,
                      self.roles.all(r, r.name != s.name))
                  message: a seed role name must not reuse a workload role name
                - rule: >-
                    !has(self.seedRoles) || !has(self.roles) ||
                    self.seedRoles.all(s,
                      self.roles.all(r,
                        !(s.serviceAccountName in r.serviceAccountNames &&
                          s.serviceAccountNamespace in r.serviceAccountNamespaces)))
                  message: a seed role must not reuse a workload ServiceAccount identity
              properties:
                clusterName:
                  type: string
                  description: >-
                    ADR-013 cluster id. Selects the dedicated auth mount
                    auth/kubernetes/<clusterName>.
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  minLength: 1
                  maxLength: 63
                kubernetesHost:
                  type: string
                  description: Consumer cluster API server, e.g. https://192.168.100.204:6443
                  # 2 KiB is ample for an API-server URL, including long DNS names and query data.
                  maxLength: 2048
                reviewerJwtSecretRef:
                  type: object
                  description: >-
                    Category-A reviewer-JWT (dedicated SA + system:auth-delegator
                    on the consumer). Secret ref only — never inline.
                  required: [namespace, name, key]
                  properties:
                    # Kubernetes namespaces are DNS labels and cannot exceed 63 characters.
                    namespace: { type: string, maxLength: 63 }
                    # Kubernetes Secret names are DNS subdomains, whose API limit is 253 characters.
                    name:      { type: string, maxLength: 253 }
                    # 253 leaves room for any valid Secret data key without making strings unbounded.
                    key:       { type: string, maxLength: 253 }
                caCert:
                  type: string
                  description: >-
                    Consumer cluster CA (PEM). Public certificate — inline is fine;
                    the provider's AuthBackendConfig.kubernetesCaCert is a plain
                    string, not a secret ref. Only the reviewer JWT is a secret.
                  minLength: 1
                  # 64 KiB accommodates a sizeable PEM CA bundle while bounding CEL schema cost.
                  maxLength: 65536
                roles:
                  type: array
                  description: >-
                    Workload-scoped identities. Each yields one least-privilege
                    Policy (read on policyPaths) + one Kubernetes AuthBackendRole
                    binding the named ServiceAccounts. No shared cluster-wide role.
                  # 64 roles already render 128 managed resources for one cluster; real
                  # VaultConfigs use only a handful, so this will not constrain consumers.
                  maxItems: 64
                  items:
                    type: object
                    required: [name, serviceAccountNames, serviceAccountNamespaces, policyPaths]
                    properties:
                      name:
                        type: string
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        minLength: 1
                        # Role names follow the DNS-label convention used throughout this XRD.
                        maxLength: 63
                      serviceAccountNames:
                        type: array
                        # Kubernetes ServiceAccount names are DNS subdomains (maximum 253).
                        items: { type: string, maxLength: 253 }
                        minItems: 1
                        # 16 names per Vault role is generous; combined with 16 namespaces
                        # it can already authorize 256 ServiceAccount identities.
                        maxItems: 16
                      serviceAccountNamespaces:
                        type: array
                        # Kubernetes namespaces are DNS labels (maximum 63).
                        items: { type: string, maxLength: 63 }
                        minItems: 1
                        # See serviceAccountNames: 16 x 16 permits 256 bound identities.
                        maxItems: 16
                      policyPaths:
                        type: array
                        description: KV v2 data paths this role may READ, e.g. secret/data/obs/*
                        # 512 supports deeply nested Vault KV paths without unbounded strings.
                        items: { type: string, maxLength: 512 }
                        minItems: 1
                        # 64 read paths per role is far above current one-path consumers.
                        maxItems: 64
                      ttlSeconds:
                        type: integer
                        default: 1200
                        description: Token TTL for this role (short-lived).
                seedRoles:
                  type: array
                  description: >-
                    Owner identities for scoped KV v2 seeding. Unlike workload
                    roles, callers cannot supply a path or capabilities: the
                    Composition derives secret/data/<clusterName>/<appName>/*
                    and grants create/update only. Each entry binds exactly one
                    dedicated ServiceAccount and must not reuse a VSO workload
                    ServiceAccount.
                  # 32 independently scoped application seeders per cluster is ample in
                  # practice and keeps all four CEL guards within a finite search space.
                  maxItems: 32
                  items:
                    type: object
                    required:
                      - name
                      - appName
                      - serviceAccountName
                      - serviceAccountNamespace
                      - ttlSeconds
                    properties:
                      name:
                        type: string
                        description: Vault Kubernetes-auth role name.
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        minLength: 1
                        maxLength: 63
                      appName:
                        type: string
                        description: >-
                          DNS-label application id used to derive the KV path
                          and okvc-<clusterName>-<appName>-seed policy name.
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        minLength: 1
                        maxLength: 63
                      serviceAccountName:
                        type: string
                        description: Dedicated owner seeding ServiceAccount.
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        minLength: 1
                        maxLength: 63
                      serviceAccountNamespace:
                        type: string
                        description: Namespace containing the dedicated seeding ServiceAccount.
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        minLength: 1
                        maxLength: 63
                      ttlSeconds:
                        type: integer
                        description: >-
                          Effective lifetime ceiling for a seeding token. Kept
                          short because this identity can write.
                        minimum: 60
                        maximum: 600
            status:
              type: object
              properties:
                mountPath:
                  type: string
                  description: The dedicated auth mount, auth/kubernetes/<clusterName>.
                  # The derived value is under 80 characters today; 128 preserves headroom.
                  maxLength: 128
