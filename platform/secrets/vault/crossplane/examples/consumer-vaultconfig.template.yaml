# Consumer-cluster VaultConfig — PARAMETERISED TEMPLATE (ADR-Platform-025 Category A).
#
# Renders to the per-cluster XR that gives one consumer cluster its own Vault
# Kubernetes auth mount (auth/kubernetes/${CLUSTER}) plus a least-privilege
# read policy and role per workload identity.
#
# Procedure, including how to mint the reviewer JWT and what to verify:
#   runbooks/vault-consumer-onboarding.md
# Realised instance to compare against: ok-robotics-vaultconfig.yaml
#
# RENDERING — substitute ONLY the named variables:
#
#   envsubst '$CLUSTER $KUBERNETES_HOST $REVIEWER_JWT_SECRET $ROLE_NAME
#             $ROLE_SA $ROLE_SA_NAMESPACE $KV_MOUNT $ROLE_TTL_SECONDS' \
#       < consumer-vaultconfig.template.yaml > ${CLUSTER}-vaultconfig.yaml
#
# Pass the explicit variable list. A bare `envsubst` substitutes EVERY ${VAR} in
# the input, silently blanking any placeholder it was not meant to touch.
#
# caCert is NOT a variable: it is a multi-line PEM block, so splice it in with a
# YAML-aware step (see the runbook) rather than envsubst.
#
#   CLUSTER              ADR-013 cluster id, e.g. ok-obs-verify. Selects the
#                        dedicated auth mount and namespaces the policy paths.
#   KUBERNETES_HOST      consumer API server the TokenReview is sent to, e.g.
#                        https://192.168.100.209:6443. Must be reachable FROM
#                        the Vault pods on ok-shared, not from your laptop.
#   REVIEWER_JWT_SECRET  Secret in crossplane-system ON ok-mgmt holding key
#                        `token` = the consumer's reviewer JWT. Created out of
#                        band; never inline the JWT here.
#   ROLE_NAME            role id, conventionally the workload SA name.
#   ROLE_SA              consumer ServiceAccount that may log in.
#   ROLE_SA_NAMESPACE    its namespace, e.g. ok-observability.
#   KV_MOUNT             KV v2 mount, normally `secret`.
#   ROLE_TTL_SECONDS     issued-token TTL, e.g. 1200.
#
# The rendered policy is READ-ONLY by construction: the composition emits
# `capabilities = ["read"]` on each declared path. This XR cannot grant write —
# seeding the credential itself is a separate, currently-unsolved concern
# (see the runbook, §Known gap).
---
apiVersion: platform.openkubes.ai/v1alpha1
kind: VaultConfig
metadata:
  name: ${CLUSTER}
spec:
  clusterName: ${CLUSTER}
  kubernetesHost: ${KUBERNETES_HOST}
  reviewerJwtSecretRef:
    namespace: crossplane-system
    name: ${REVIEWER_JWT_SECRET}
    key: token
  # Consumer cluster CA (public PEM). Spliced in, not envsubst'd — see header.
  caCert: |
    -----BEGIN CERTIFICATE-----
    REPLACE-WITH-CONSUMER-KUBE-APISERVER-CA
    -----END CERTIFICATE-----
  roles:
    - name: ${ROLE_NAME}
      serviceAccountNames: [${ROLE_SA}]
      serviceAccountNamespaces: [${ROLE_SA_NAMESPACE}]
      policyPaths:
        # KV v2 data paths. Scoped to this cluster's own subtree.
        - ${KV_MOUNT}/data/${CLUSTER}/obs/*
      ttlSeconds: ${ROLE_TTL_SECONDS}
