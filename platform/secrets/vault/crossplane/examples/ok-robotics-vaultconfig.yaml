# ok-robotics VaultConfig (ADR-025 item 13, Category A) — SCAFFOLD EXAMPLE.
#
# DO NOT apply to production yet:
#   - provider-vault MR CRDs must be confirmed (see vaultconfig-composition.yaml).
#   - reviewerJwtSecretRef / caCertSecretRef must point at real secrets on
#     ok-mgmt (crossplane-system): ok-robotics' CA and a dedicated reviewer JWT
#     (SA with system:auth-delegator) — created out of band, never inline.
#   - kubernetesHost is ok-robotics' API server (matches the OK-110 Cat-A PoC:
#     TokenReview on 192.168.100.204:6443).
#
# Matches the health gate: VAULT_EXPECT_AUTH_MOUNTS=ok-robotics asserts the
# auth/kubernetes/ok-robotics mount this XR creates.
apiVersion: platform.openkubes.ai/v1alpha1
kind: VaultConfig
metadata:
  name: ok-robotics
spec:
  clusterName: ok-robotics
  kubernetesHost: https://192.168.100.204:6443
  reviewerJwtSecretRef:
    namespace: crossplane-system
    name: ok-robotics-reviewer-jwt
    key: token
  caCertSecretRef:
    namespace: crossplane-system
    name: ok-robotics-ca
    key: ca.crt
  roles:
    # Workload identity from the OK-110 Category-A cross-cluster PoC (sa-obs).
    - name: sa-obs
      serviceAccountNames: [sa-obs]
      serviceAccountNamespaces: [observability]
      policyPaths:
        - secret/data/ok-robotics/obs/*
      ttlSeconds: 1200
