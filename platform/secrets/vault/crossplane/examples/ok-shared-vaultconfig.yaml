# OK-81 step 2.3 — VaultConfig XR for ok-shared (applied on ok-mgmt).
# ok-shared becomes a consumer of the Vault it hosts: Keycloak needs its admin and
# database passwords delivered by VSO, so the cluster needs its own auth mount.
#
# TWO identities, deliberately: seedRoles is write-only by design, so VSO could
# never read what the seeder writes. The roles[] entry is the read side.
apiVersion: platform.openkubes.ai/v1alpha1
kind: VaultConfig
metadata:
  name: ok-shared
spec:
  clusterName: ok-shared
  # The API server the Vault pods send TokenReview to. Same convention as
  # ok-robotics (192.168.100.204) and ok-obs-verify: the cluster's own LB IP.
  kubernetesHost: https://192.168.100.206:6443
  # Reviewer JWT lives on ok-mgmt in crossplane-system, copied out of band from
  # ok-shared's kube-system/vault-reviewer-token. Never inlined here.
  reviewerJwtSecretRef:
    namespace: crossplane-system
    name: ok-shared-reviewer-jwt
    key: token
  # ok-shared's kube-apiserver CA (public PEM, O=kubernetes, expires 2036-07-19).
  caCert: |
    -----BEGIN CERTIFICATE-----
    MIIBizCCATCgAwIBAgIRAKf8w41lNaNmtgACsKX42DowCgYIKoZIzj0EAwIwFTET
    MBEGA1UEChMKa3ViZXJuZXRlczAeFw0yNjA3MjIxMjU1MzdaFw0zNjA3MTkxMjU1
    MzdaMBUxEzARBgNVBAoTCmt1YmVybmV0ZXMwWTATBgcqhkjOPQIBBggqhkjOPQMB
    BwNCAASoKtobZ7HKxgTBRvI3Ety0qekWj+UrN3uHp/xTr5J3nkFJgRADM2a6l375
    utV/cONR5+BoS0qE5mcOIYMYKfwvo2EwXzAOBgNVHQ8BAf8EBAMCAoQwHQYDVR0l
    BBYwFAYIKwYBBQUHAwEGCCsGAQUFBwMCMA8GA1UdEwEB/wQFMAMBAf8wHQYDVR0O
    BBYEFMbw4iSg7L5N7O+8nbV6u8F8T47ZMAoGCCqGSM49BAMCA0kAMEYCIQCDLTLJ
    jodNtOpcsv5XHK2uSZw0ww4Gbw0/rnF1LdwS6wIhAJDLdvs/NVVbFgTlXylg0zOf
    OnD39Ov889fRTuvN/iRa
    -----END CERTIFICATE-----
  # READ side — the identity VSO authenticates as. Composition emits
  # capabilities = ["read"] by construction.
  roles:
    - name: sa-keycloak
      serviceAccountNames: [sa-keycloak]
      serviceAccountNamespaces: [keycloak]
      policyPaths:
        - secret/data/ok-shared/keycloak/*
      ttlSeconds: 1200
  # WRITE side — scoped create/update only on the derived path, dedicated SA,
  # tokenNoDefaultPolicy, short TTL. Cannot read back what it writes.
  seedRoles:
    - name: keycloak-seed
      appName: keycloak
      serviceAccountName: vault-seed-keycloak
      serviceAccountNamespace: keycloak
      ttlSeconds: 600
  # Pin the proven revision, same as ok-obs-verify. Manual policy means this XR
  # does not adopt future revisions on its own.
  compositionRevisionRef:
    name: vaultconfig.platform.openkubes.ai-47f7223
  compositionUpdatePolicy: Manual
