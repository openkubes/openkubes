# ok-shared-vault — the production singleton VaultInstance (ADR-Platform-025).
#
# SCAFFOLD EXAMPLE — DO NOT apply to production yet:
#   - replicas (failure budget 3 vs 5) is an OPEN, acceptance-gated decision.
#   - dataStorageClass below is a PLACEHOLDER — set the real StorageClass that
#     exists INSIDE ok-shared (not host ok-storage).
#   - Vault init/unseal is a separate supervised bootstrap ceremony, performed
#     after install; this manifest only stands up the server.
#   - The singleton invariant (exactly one VaultInstance) is not yet enforced
#     by admission/conformance — see README.
apiVersion: platform.openkubes.ai/v1alpha1
kind: VaultInstance
metadata:
  name: ok-shared-vault
spec:
  clusterRef: ok-shared            # provider-helm ProviderConfig (ADR-013)
  replicas: 3                      # CONFIRM 3 vs 5 (ADR-025 failure budget)
  dataStorageClass: PLACEHOLDER    # set a StorageClass that exists in ok-shared
  dataStorageSize: 10Gi
  auditStorageEnabled: true
  auditStorageSize: 5Gi
  ingressHost: vault.ok-shared.internal
