# ok-shared-vault — the production singleton VaultInstance (ADR-Platform-025).
#
# Applied to ok-mgmt; the composition deploys the Vault server onto ok-shared via
# the provider-helm ProviderConfig 'ok-shared' (ADR-013). Init/unseal is a
# separate supervised bootstrap ceremony (bootstrap/README.md) — this only
# stands up the server. Vault pods stay NotReady (sealed) until unsealed.
# Note: the singleton invariant is not yet admission/conformance-enforced.
apiVersion: platform.openkubes.ai/v1alpha1
kind: VaultInstance
metadata:
  name: ok-shared-vault
spec:
  clusterRef: ok-shared            # provider-helm ProviderConfig (ADR-013)
  replicas: 3                      # failure budget: 3 voters (ADR-025, decided)
  dataStorageClass: local-path     # default SC inside ok-shared (rancher.io/local-path)
  dataStorageSize: 10Gi
  auditStorageEnabled: true
  auditStorageSize: 5Gi
  ingressHost: vault.ok-shared.internal
