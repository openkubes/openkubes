# VaultInstance Composition — Vault (Integrated Storage / Raft) via provider-helm
# ADR-Platform-025. SCAFFOLD / DRAFT — see xrd.yaml header for scope & open items.
#
# The Helm chart is PINNED (revision identity, ADR-025). Promotion of a new
# CompositionRevision is explicit (XRD defaultCompositionUpdatePolicy: Manual).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: vault.platform.openkubes.ai
  labels:
    provider: helm
    capability: secrets
    profile: vault-datacenter
spec:
  compositeTypeRef:
    apiVersion: platform.openkubes.ai/v1alpha1
    kind: VaultInstance
  mode: Pipeline
  pipeline:
    - step: deploy-vault
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: vault-helm-release
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              spec:
                # ADR-025 stateful safety: deleting the XR must NOT uninstall
                # Vault or delete its Raft data path.
                deletionPolicy: Orphan
                forProvider:
                  chart:
                    repository: https://helm.releases.hashicorp.com
                    name: vault
                    version: "0.30.1"  # PINNED — confirm the tested chart version
                  namespace: vault
                  # ADR-025 readiness ≠ installed: Vault pods stay NotReady
                  # (sys/health = uninitialized/sealed) until the SEPARATE
                  # supervised unseal ceremony. wait:true would block on pod
                  # readiness, hit the timeout, and mark the Release FAILED —
                  # which never resolves pre-unseal. Install only places the
                  # StatefulSet/PVCs; operational readiness is asserted by the
                  # separate health gate, not by provider-helm.
                  wait: false
                  values:
                    # Stable in-cluster service DNS (vault.vault.svc) regardless
                    # of the XR/Release name — VSO/consumer addresses depend on it.
                    fullnameOverride: vault
                    server:
                      ha:
                        enabled: true
                        raft:
                          enabled: true
                      # Anti-affinity across distinct nodes (ADR-025 failure
                      # domains) — do not co-locate Raft voters.
                      affinity: |
                        podAntiAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            - labelSelector:
                                matchLabels:
                                  app.kubernetes.io/name: vault
                                  component: server
                              topologyKey: kubernetes.io/hostname
                      dataStorage:
                        enabled: true
                        # storageClass + size are patched from the XR — no
                        # silent default (ADR-025: StorageClass must exist
                        # INSIDE the target cluster, not host ok-storage).
                      auditStorage:
                        enabled: true
                    # SEAL: Phase-1 Shamir (chart default) — deliberately NO
                    # seal/auto-unseal stanza. Attended offline unseal is the
                    # accepted Phase-1 baseline; auto-unseal (Transit/HSM) is a
                    # committed follow-up (ADR-025). No secret material here —
                    # init/unseal is a separate supervised bootstrap ceremony.
                # No auto-rollback: rolling a chart version/values under a live
                # Raft cluster contradicts the Manual-revision + Orphan +
                # stateful-safety posture (ADR-025). Failed upgrades are handled
                # supervised, not by the provider.
                rollbackLimit: 0
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterRef
                toFieldPath: spec.providerConfigRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.namespace
                toFieldPath: spec.forProvider.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.replicas
                toFieldPath: spec.forProvider.values.server.ha.replicas
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dataStorageClass
                toFieldPath: spec.forProvider.values.server.dataStorage.storageClass
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dataStorageSize
                toFieldPath: spec.forProvider.values.server.dataStorage.size
              - type: FromCompositeFieldPath
                fromFieldPath: spec.auditStorageEnabled
                toFieldPath: spec.forProvider.values.server.auditStorage.enabled
              - type: FromCompositeFieldPath
                fromFieldPath: spec.auditStorageSize
                toFieldPath: spec.forProvider.values.server.auditStorage.size
              # Status: expose INSTALLED-only (NOT Vault-ready — ADR-025).
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.state
                toFieldPath: status.releaseState
                policy:
                  fromFieldPath: Optional
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.revision
                toFieldPath: status.revision
                policy:
                  fromFieldPath: Optional
            readinessChecks:
              # NOTE (ADR-025): the ONLY thing observable here is the Helm
              # release state, so XR "Ready" means INSTALLED — NOT Vault-ready.
              # Initialized / Unsealed / RaftHealthy / TLSReady / AuditEnabled /
              # Configured are asserted by a SEPARATE deterministic health gate,
              # which is what supplies acceptance evidence. Do not treat this XR
              # condition as operational readiness.
              - type: MatchString
                fieldPath: status.atProvider.state
                matchString: deployed
