# VaultConfig Composition — STEADY STATE (post-migration canonical version)
#
# This is the permanent, canonical Composition for the VaultConfig capability (ADR-025 item 13,
# A6). It is the successor of the one-time A6 ownership migration (T1..T5 + 3D-1..3D-3a), which
# transferred ownership of the reconciler-managed policy to the reserved okvc- identity WITHOUT
# deleting the external policy during the ownership handoff; the legacy policy was removed only
# afterwards, once a no-reference proof confirmed nothing still bound it. Only the COMMENTS differ
# from the last migration revision (T5): every functional
# line — including each `gotemplating.fn.crossplane.io/composition-resource-name` key, the
# `crossplane.io/external-name`, `managementPolicies`, and all forProvider fields — is byte-for-byte
# identical, so the rendered desired resources are unchanged and no identity migration occurs.
# Per workload role it renders one least-privilege READ policy + AuthBackendRole. Per seed role it
# renders a derived-path create/update policy + a separate, single-ServiceAccount AuthBackendRole.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: vaultconfig.platform.openkubes.ai
  labels:
    provider: vault
    capability: secrets
    profile: vault-datacenter
spec:
  compositeTypeRef:
    apiVersion: platform.openkubes.ai/v1alpha1
    kind: VaultConfig
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $cluster := .observed.composite.resource.spec.clusterName }}
            {{- $mount := printf "kubernetes/%s" $cluster }}
            {{- $spec := .observed.composite.resource.spec }}
            ---
            # Dedicated Kubernetes auth backend (one MOUNT per cluster).
            apiVersion: auth.vault.upbound.io/v1alpha1
            kind: Backend
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: authbackend
            spec:
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                type: kubernetes
                path: {{ $mount | quote }}
            ---
            # Auth backend config: consumer API host + CA + reviewer JWT (secret refs).
            apiVersion: kubernetes.vault.upbound.io/v1alpha1
            kind: AuthBackendConfig
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: authbackendconfig
            spec:
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                backend: {{ $mount | quote }}
                kubernetesHost: {{ $spec.kubernetesHost | quote }}
                # CA is a public cert -> inline PEM string (provider has no CA secret ref).
                kubernetesCaCert: {{ $spec.caCert | quote }}
                # reviewer JWT is the sensitive input -> secret ref (Upjet {name,namespace,key}).
                tokenReviewerJwtSecretRef:
                  namespace: {{ $spec.reviewerJwtSecretRef.namespace | quote }}
                  name: {{ $spec.reviewerJwtSecretRef.name | quote }}
                  key: {{ $spec.reviewerJwtSecretRef.key | quote }}
            {{- range $r := $spec.roles }}
            ---
            # Least-privilege READ-only policy on the declared KV v2 data paths.
            # Named okvc-<cluster>-<role> (reserved A6 prefix) so the ok-config-automation policy
            # can be scoped to sys/policies/acl/okvc-* and cannot touch admin policies.
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: policy-okvc-{{ $r.name }}
                crossplane.io/external-name: {{ printf "okvc-%s-%s" $cluster $r.name | quote }}
            spec:
              managementPolicies: ["*"]
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                name: {{ printf "okvc-%s-%s" $cluster $r.name | quote }}
                policy: |
                  {{- range $p := $r.policyPaths }}
                  path "{{ $p }}" { capabilities = ["read"] }
                  {{- end }}
            ---
            # Kubernetes auth role: binds the workload ServiceAccounts to the okvc- policy.
            apiVersion: kubernetes.vault.upbound.io/v1alpha1
            kind: AuthBackendRole
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: role-{{ $r.name }}
            spec:
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                backend: {{ $mount | quote }}
                roleName: {{ $r.name | quote }}
                boundServiceAccountNames: {{ $r.serviceAccountNames | toJson }}
                boundServiceAccountNamespaces: {{ $r.serviceAccountNamespaces | toJson }}
                tokenPolicies: [{{ printf "okvc-%s-%s" $cluster $r.name | quote }}]
                tokenTtl: {{ $r.ttlSeconds | default 1200 }}
            {{- end }}
            {{- range $r := $spec.seedRoles }}
            ---
            # Scoped owner seeding policy. KV v2 `kv put` writes only the data endpoint, so
            # create/update on secret/data/<cluster>/<app>/* are sufficient: no metadata
            # capability is needed. Read is intentionally absent; read-after-write would widen
            # the SoD boundary merely to make verification convenient. Delete/undelete/destroy
            # and metadata deletion are also intentionally absent.
            #
            # The okvc- prefix is forced by the existing ok-config-automation grant on
            # sys/policies/acl/okvc-*. A dedicated prefix would require break-glass to widen that
            # grant and would block the capability behind the ceremony it removes. Moving to a
            # dedicated prefix later is a rename, not a redesign: the separate seedRoles API and
            # derived policy body remain unchanged.
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: seed-policy-okvc-{{ $r.name }}
                crossplane.io/external-name: {{ printf "okvc-%s-%s-seed" $cluster $r.appName | quote }}
            spec:
              managementPolicies: ["*"]
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                name: {{ printf "okvc-%s-%s-seed" $cluster $r.appName | quote }}
                policy: |
                  path "secret/data/{{ $cluster }}/{{ $r.appName }}/*" {
                    capabilities = ["create", "update"]
                  }
            ---
            # Dedicated owner identity. It binds exactly one SA (never the VSO workload SA).
            # tokenNoDefaultPolicy makes the sys/* denial literal: the token does not inherit
            # Vault's `default` self-service paths such as sys/capabilities-self. Max and explicit
            # max TTL equal the short requested TTL, so renewal cannot extend the seeding window.
            apiVersion: kubernetes.vault.upbound.io/v1alpha1
            kind: AuthBackendRole
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: seed-role-{{ $r.name }}
            spec:
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                backend: {{ $mount | quote }}
                roleName: {{ $r.name | quote }}
                boundServiceAccountNames: [{{ $r.serviceAccountName | quote }}]
                boundServiceAccountNamespaces: [{{ $r.serviceAccountNamespace | quote }}]
                tokenPolicies: [{{ printf "okvc-%s-%s-seed" $cluster $r.appName | quote }}]
                tokenNoDefaultPolicy: true
                tokenTtl: {{ $r.ttlSeconds }}
                tokenMaxTtl: {{ $r.ttlSeconds }}
                tokenExplicitMaxTtl: {{ $r.ttlSeconds }}
            {{- end }}
            ---
            # Publish the mount path back to the XR status.
            apiVersion: platform.openkubes.ai/v1alpha1
            kind: VaultConfig
            status:
              mountPath: {{ printf "auth/%s" $mount | quote }}
    - step: ready
      functionRef:
        name: function-auto-ready
