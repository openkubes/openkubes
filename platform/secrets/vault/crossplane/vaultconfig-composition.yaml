# VaultConfig Composition — provider-vault MRs (ADR-025 item 13)
#
# SCAFFOLD / DRAFT. Renders, per consuming cluster:
#   - one Kubernetes auth backend at path kubernetes/<clusterName>
#   - its config (host + CA + reviewer-JWT via secret refs — Category A)
#   - per role: one least-privilege Policy + one AuthBackendRole
#
# ── TO-VERIFY BEFORE APPLY (provider CRD coverage, ADR-025 item 13 record) ────
# The provider-vault MR apiVersions/kinds and forProvider field names below are
# the EXPECTED Upjet shape and MUST be confirmed against the pinned provider:
#   kubectl get crds | grep vault
#   kubectl explain authbackend.<group> --recursive
# Adjust groups/fields (and secret-ref field names) to the installed CRDs.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: vaultconfig.platform.openkubes.ai
  labels:
    provider: vault
    capability: secrets
    profile: vault-datacenter
spec:
  compositeTypeRef:
    apiVersion: platform.openkubes.ai/v1alpha1
    kind: VaultConfig
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $cluster := .observed.composite.resource.spec.clusterName }}
            {{- $mount := printf "kubernetes/%s" $cluster }}
            {{- $spec := .observed.composite.resource.spec }}
            ---
            # Dedicated Kubernetes auth backend (one MOUNT per cluster).
            apiVersion: auth.vault.crossplane.io/v1beta1   # TO-VERIFY
            kind: AuthBackend
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: authbackend
            spec:
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                type: kubernetes
                path: {{ $mount | quote }}
            ---
            # Auth backend config: consumer API host + CA + reviewer JWT (secret refs).
            apiVersion: kubernetes.vault.crossplane.io/v1beta1   # TO-VERIFY
            kind: AuthBackendConfig
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: authbackendconfig
            spec:
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                backend: {{ $mount | quote }}
                kubernetesHost: {{ $spec.kubernetesHost | quote }}
                # sensitive inputs via secret refs — NEVER inline (ADR-024 hygiene)
                kubernetesCaCertSecretRef:                  # TO-VERIFY field name
                  namespace: {{ $spec.caCertSecretRef.namespace | quote }}
                  name: {{ $spec.caCertSecretRef.name | quote }}
                  key: {{ $spec.caCertSecretRef.key | quote }}
                tokenReviewerJwtSecretRef:                  # TO-VERIFY field name
                  namespace: {{ $spec.reviewerJwtSecretRef.namespace | quote }}
                  name: {{ $spec.reviewerJwtSecretRef.name | quote }}
                  key: {{ $spec.reviewerJwtSecretRef.key | quote }}
            {{- range $r := $spec.roles }}
            ---
            # Least-privilege policy: READ only, on the declared KV v2 data paths.
            apiVersion: vault.vault.crossplane.io/v1beta1   # TO-VERIFY
            kind: Policy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: policy-{{ $r.name }}
            spec:
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                name: {{ printf "%s-%s" $cluster $r.name | quote }}
                policy: |
                  {{- range $p := $r.policyPaths }}
                  path "{{ $p }}" { capabilities = ["read"] }
                  {{- end }}
            ---
            # Kubernetes auth role: bind the workload ServiceAccounts to the policy.
            apiVersion: kubernetes.vault.crossplane.io/v1beta1   # TO-VERIFY
            kind: AuthBackendRole
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: role-{{ $r.name }}
            spec:
              providerConfigRef: { name: ok-shared-vault }
              forProvider:
                backend: {{ $mount | quote }}
                roleName: {{ $r.name | quote }}
                boundServiceAccountNames: {{ $r.serviceAccountNames | toJson }}
                boundServiceAccountNamespaces: {{ $r.serviceAccountNamespaces | toJson }}
                tokenPolicies: [{{ printf "%s-%s" $cluster $r.name | quote }}]
                tokenTtl: {{ $r.ttlSeconds | default 1200 }}
            {{- end }}
            ---
            # Publish the mount path back to the XR status.
            apiVersion: platform.openkubes.ai/v1alpha1
            kind: VaultConfig
            status:
              mountPath: {{ printf "auth/%s" $mount | quote }}
    - step: ready
      functionRef:
        name: function-auto-ready
