# ─────────────────────────────────────────────────────────────────────────────
# VaultInstance singleton enforcement — ADR-Platform-025 criterion 14, OK-110.
#
# ADR-025 models VaultInstance as an INTERNAL SINGLETON XR (no claimNames):
# exactly one production instance, `ok-shared-vault`. An XRD alone does NOT
# enforce that — "The singleton invariant is verified by a conformance /
# admission check: no second production VaultInstance may exist while
# ok-shared-vault is active."
#
# MECHANISM (deliberately dependency-free): a Kubernetes-native
# ValidatingAdmissionPolicy that PINS THE NAME. VaultInstance is cluster-scoped,
# so object names are globally unique; permitting only the name `ok-shared-vault`
# means AT MOST ONE VaultInstance can ever exist. Name-pinning enforces the
# singleton with single-object admission evaluation (no fragile cross-object
# counting, no external policy controller — no new platform capability, per
# ADR-025 §Implementation & placement).
#
# fail-closed: failurePolicy: Fail (matches OK-110 mutating-step discipline).
# CREATE-only: a cluster-scoped object cannot be renamed, so UPDATE needs no rule.
# Applied to: ok-mgmt (the Crossplane control plane where the XR lives).
#
# API version: admissionregistration.k8s.io/v1 is GA in Kubernetes 1.30+.
# On 1.28–1.29, change apiVersion to admissionregistration.k8s.io/v1beta1 on
# BOTH objects (schema is identical) and ensure the ValidatingAdmissionPolicy
# feature gate + API are enabled. Confirm the ok-mgmt server version first:
#   kubectl version -o json | jq -r .serverVersion.gitVersion
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vaultinstance-singleton.platform.openkubes.ai
  labels:
    app.kubernetes.io/part-of: openkubes-vault
    openkubes.ai/adr: adr-platform-025
    openkubes.ai/criterion: "14"
spec:
  # fail-closed: if the policy cannot be evaluated, deny rather than admit.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["platform.openkubes.ai"]
        apiVersions: ["*"]
        operations: ["CREATE"]
        resources: ["vaultinstances"]
  variables:
    - name: allowedName
      expression: "'ok-shared-vault'"
  validations:
    # The singleton guarantee: only `ok-shared-vault` may be created. Because the
    # resource is cluster-scoped, this bounds the population to at most one.
    # (Literal is inlined so the name-pin is greppable by validate/conformance;
    # variables.allowedName is reused in the human-readable message below.)
    - expression: "object.metadata.name == 'ok-shared-vault'"
      reason: Forbidden
      messageExpression: >-
        'ADR-025 singleton (criterion 14): the only permitted VaultInstance is ' +
        variables.allowedName + '. A second production VaultInstance (' +
        object.metadata.name + ') is forbidden — Vault is a bounded singleton, ' +
        'not a self-service capability. To relocate the singleton, change the ' +
        'pinned name in this ValidatingAdmissionPolicy (versioned, reviewable).'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vaultinstance-singleton.platform.openkubes.ai
  labels:
    app.kubernetes.io/part-of: openkubes-vault
    openkubes.ai/adr: adr-platform-025
    openkubes.ai/criterion: "14"
spec:
  policyName: vaultinstance-singleton.platform.openkubes.ai
  validationActions: [Deny]
  # Cluster-scoped target: no namespaceSelector. Binds the policy fleet-wide on
  # ok-mgmt so every VaultInstance CREATE is evaluated.
