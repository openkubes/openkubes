# VaultInstance XRD — datacenter secret backend (ADR-Platform-025)
#
# SCAFFOLD / DRAFT — not production-applyable yet. Per ADR-025:
#   - Internal SINGLETON XR: NO claimNames (Vault is a bounded singleton
#     implementation profile, not a self-service capability). Exactly one
#     production instance: ok-shared-vault. Enforcing the singleton is a TODO
#     (conformance/admission check — an XRD alone does not enforce it).
#   - Manual composition-revision promotion (no auto-adopt).
#   - Open, acceptance-gated decisions this scaffold must NOT silently default:
#     failure budget (replicas 3 vs 5) and the Day-1/2 config reconciler.
#   - Vault init/unseal is a SEPARATE supervised bootstrap ceremony — not here.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: vaultinstances.platform.openkubes.ai
spec:
  group: platform.openkubes.ai
  names:
    kind: VaultInstance
    plural: vaultinstances
  # NO claimNames — internal singleton, not a self-service Claim API.
  defaultCompositionRef:
    name: vault.platform.openkubes.ai
  # ADR-025: production must not auto-adopt new Composition revisions —
  # promote a tested CompositionRevision explicitly.
  defaultCompositionUpdatePolicy: Manual
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clusterRef
                - replicas
                - dataStorageClass
              properties:
                clusterRef:
                  type: string
                  description: >-
                    Target cluster = provider-helm ProviderConfig name
                    (ADR-013 registration). Production singleton: ok-shared.
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  minLength: 1
                  maxLength: 63
                namespace:
                  type: string
                  default: vault
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                replicas:
                  type: integer
                  enum: [3, 5]
                  description: >-
                    Raft voters. ADR-025 failure budget (accepted risk):
                    3 → quorum 2, tolerate 1 down; 5 → quorum 3, tolerate 2.
                    NO default — must be chosen explicitly.
                dataStorageClass:
                  type: string
                  minLength: 1
                  description: >-
                    A StorageClass that EXISTS INSIDE the target cluster (e.g.
                    inside ok-shared). NOT the host-layer ok-storage. NO default.
                dataStorageSize:
                  type: string
                  default: 10Gi
                auditStorageEnabled:
                  type: boolean
                  default: true
                auditStorageSize:
                  type: string
                  default: 5Gi
                ingressHost:
                  type: string
                  description: >-
                    e.g. vault.ok-shared.internal — non-manual reachability
                    (OK-57 dependency).
            status:
              type: object
              properties:
                releaseState:
                  type: string
                  description: >-
                    State reported by the composed Helm Release. NOTE: 'deployed'
                    means INSTALLED ONLY — NOT Vault-ready. Initialized / Unsealed
                    / RaftHealthy / TLSReady / AuditEnabled / Configured are
                    asserted by a SEPARATE health gate (ADR-025), not here.
                revision:
                  type: integer
