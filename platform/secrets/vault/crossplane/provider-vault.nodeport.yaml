# provider-vault — INTERIM NodePort variant (ADR-025 item 13)
#
# Why this file exists (do NOT commit as the canonical path):
#   The canonical provider-vault.yaml targets https://vault.ok-shared.internal:443
#   via a MetalLB LoadBalancer IP. ok-shared (a workload/child cluster) has NO
#   MetalLB, so the Traefik LB stays <pending>. The reachable path is the Traefik
#   NodePort 30443 on an ok-shared node IP. Proven working (SNI passthrough):
#     curl -sk --resolve vault.ok-shared.internal:30443:10.44.0.38 \
#       https://vault.ok-shared.internal:30443/v1/sys/health  -> initialized/unsealed
#
# Interim deltas vs. canonical provider-vault.yaml:
#   - ProviderConfig.address        :443  -> :30443
#   - DeploymentRuntimeConfig gains  hostAliases: vault.ok-shared.internal -> node IP
#   - node IP 10.44.0.38 is pinned (control-plane node). Fragile if that VM
#     reschedules; production fix = install MetalLB on ok-shared (or a stable VIP).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-vault
spec:
  package: xpkg.upbound.io/upbound/provider-vault:v4.0.1
  revisionActivationPolicy: Manual
  packagePullPolicy: IfNotPresent
  runtimeConfigRef:
    name: provider-vault
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-vault
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-vault          # bound by auth/kubernetes/ok-mgmt role
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          # INTERIM: resolve the SNI host to the reachable ok-shared node IP.
          hostAliases:
            - ip: "10.44.0.38"
              hostnames:
                - vault.ok-shared.internal
          containers:
            - name: package-runtime
              env:
                - name: VAULT_CACERT
                  value: /etc/vault-ca/ca.crt
              volumeMounts:
                - name: vault-ca
                  mountPath: /etc/vault-ca
                  readOnly: true
          volumes:
            - name: vault-ca
              secret:
                secretName: ok-shared-vault-ca
                items:
                  - key: ca.crt
                    path: ca.crt
---
apiVersion: vault.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: ok-shared-vault
spec:
  # INTERIM: NodePort instead of :443 (no MetalLB on ok-shared).
  address: https://vault.ok-shared.internal:30443
  tls_server_name: vault.ok-shared.internal
  skip_tls_verify: false
  credentials:
    source: Kubernetes
  mountPath: kubernetes/ok-mgmt
  role: provider-vault
