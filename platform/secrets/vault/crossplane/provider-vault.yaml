# Crossplane provider-vault — Day-1/2 Vault config reconciler (ADR-025 item 13)
#
# SCAFFOLD / DRAFT — applied on ok-mgmt. Installs the provider and points it at
# the central Vault on ok-shared, authenticating with the ceremony-seeded
# Kubernetes-auth identity (least privilege, short-lived) — NOT a standing token.
#
# ── VERIFY BEFORE APPLY ──────────────────────────────────────────────────────
#   1. Pin: confirm the latest tested crossplane-contrib/provider-vault version
#      from the Upbound marketplace and set `package:` below (do not float).
#   2. Coverage: after install, `kubectl get crds | grep vault` and confirm the
#      MR kinds used by the Composition exist (kubernetes AuthBackend/Config/Role,
#      Policy). apiVersions in vaultconfig-composition.yaml are TO-VERIFY.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-vault
spec:
  # PIN — confirm the current tested tag on the marketplace before applying.
  package: xpkg.upbound.io/crossplane-contrib/provider-vault:v0.4.0
  # Manual, deliberate upgrades — mirror the Vault Release revision discipline.
  revisionActivationPolicy: Manual
  packagePullPolicy: IfNotPresent
---
# ProviderConfig — how provider-vault authenticates to the central Vault.
# Kubernetes auth against the mount seeded by the bootstrap ceremony
# (auth/kubernetes/ok-mgmt, role provider-vault, policy ok-config-automation).
# The provider runs on ok-mgmt and presents its own ServiceAccount token; Vault
# validates it via that mount and issues a short-lived token. No secret here.
apiVersion: vault.crossplane.io/v1beta1        # TO-VERIFY against pinned provider
kind: ProviderConfig
metadata:
  name: ok-shared-vault
spec:
  # Reach the central Vault via the ok-shared ingress (passthrough, reachability.yaml).
  address: https://vault.ok-shared.internal:443
  # Trust the cert-manager internal CA (Vault-independent origin).
  caCertSecretRef:                             # TO-VERIFY: field name per provider
    namespace: crossplane-system
    name: ok-shared-vault-ca
    key: ca.crt
  # Kubernetes auth — the ceremony-seeded, least-privilege, short-lived identity.
  auth:
    method: Kubernetes                         # TO-VERIFY: auth stanza shape
    kubernetes:
      role: provider-vault                     # auth/kubernetes/ok-mgmt role
      mountPath: kubernetes/ok-mgmt
