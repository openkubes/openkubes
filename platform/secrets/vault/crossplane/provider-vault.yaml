# Crossplane provider-vault — Day-1/2 Vault config reconciler (ADR-025 item 13)
#
# SCAFFOLD / DRAFT — applied on ok-mgmt. Installs the provider, pins a stable
# ServiceAccount name, mounts the internal CA for TLS trust, and authenticates to
# the central Vault via Kubernetes auth (ceremony-seeded, least-privilege,
# short-lived) — NO standing token.
#
# CRDs/fields confirmed against upbound/provider-vault v4.0.1 on ok-mgmt.
# Prereq: the internal CA must exist on ok-mgmt as Secret
# crossplane-system/ok-shared-vault-ca (key ca.crt) — distributed from the
# cert-manager CA on ok-shared (reachability.yaml). Public cert, not sensitive.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-vault
spec:
  # Upbound-maintained Upjet provider (NOT crossplane-contrib — that path 404s).
  # PIN — v4.0.1 is current; bump deliberately (Manual activation).
  package: xpkg.upbound.io/upbound/provider-vault:v4.0.1
  revisionActivationPolicy: Manual
  packagePullPolicy: IfNotPresent
  runtimeConfigRef:
    name: provider-vault
---
# Pin the provider pod's ServiceAccount name + mount the Vault CA so the pod
# trusts vault.ok-shared.internal. The SA name MUST match the Vault Kubernetes
# auth role's bound_service_account_names (ceremony Step 3c: provider-vault).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-vault
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-vault          # stable SA; bound by auth/kubernetes/ok-mgmt role
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              env:
                # TO-VERIFY: Upjet vault provider honours VAULT_CACERT (from the
                # underlying terraform-provider-vault). Alternative: bake the CA
                # into the pod trust store.
                - name: VAULT_CACERT
                  value: /etc/vault-ca/ca.crt
              volumeMounts:
                - name: vault-ca
                  mountPath: /etc/vault-ca
                  readOnly: true
          volumes:
            - name: vault-ca
              secret:
                secretName: ok-shared-vault-ca
                items:
                  - key: ca.crt
                    path: ca.crt
---
# How provider-vault authenticates to the central Vault on ok-shared.
apiVersion: vault.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: ok-shared-vault
spec:
  # Central Vault via the ok-shared passthrough ingress (reachability.yaml).
  address: https://vault.ok-shared.internal:443
  tls_server_name: vault.ok-shared.internal
  skip_tls_verify: false                       # trust chain via VAULT_CACERT above
  # Vault Kubernetes auth: the provider pod's SA token logs in at the
  # ceremony-seeded mount with the least-privilege role. Short-lived tokens.
  credentials:
    source: Kubernetes
  mountPath: kubernetes/ok-mgmt
  role: provider-vault
