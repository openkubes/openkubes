# Vault cross-cluster reachability — ok-shared ingress, TLS passthrough (ADR-Platform-025)
#
# SCAFFOLD / DRAFT — applied ONTO ok-shared (kubectl, or wrap each doc as a
# kubernetes.crossplane.io/v1alpha2 Object with providerConfigRef: ok-shared,
# mirroring platform/cluster-management/crossplane/examples/ok1-certmanager.yaml).
#
# Reachability decision (OK-110): consumers reach the central Vault via the
# ok-shared Traefik ingress as an IngressRouteTCP with TLS PASSTHROUGH and
# HostSNI(vault.ok-shared.internal), backed by the leader-only `vault-active`
# service. This replaces the manual host-cluster LB proxy used in the PoC and
# reduces OK-57 to an optional simplification rather than a prerequisite.
#
# Why passthrough (not termination): Vault is a secret backend — TLS must be
# end-to-end so Vault sees the real client and its audit log is meaningful; no
# plaintext hop inside ok-shared.
# Why `vault-active`: routing to the normal `vault` service can hit a Raft
# standby, which answers with a 307 redirect to the leader's api_addr — a
# cross-cluster consumer cannot follow an internal redirect target. The
# `vault-active` service selects only the leader, so no redirect occurs
# (Vault Community has no performance standbys; all reads go to the leader).
#
# Prerequisites on ok-shared:
#   - cert-manager installed (chart as in ok1-certmanager.yaml).
#   - Traefik present with a TLS entrypoint `websecure` (443) exposed via
#     MetalLB (per ok-shared onboarding).
#
# NOTE: server TLS on the Vault pods (listener tls_cert_file, extraVolumes
# mounting `vault-server-tls`, https retry_join) is a SEPARATE, reviewable
# composition change — this file only provisions the cert material and the
# ingress route. Passthrough is inert until Vault actually serves TLS.
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. Bootstrap self-signed Issuer (origin of the internal CA) ───────────────
# Vault-independent trust origin — satisfies the ADR-025 bootstrap invariant
# (TLS trust for the Vault endpoint must not come from Vault itself).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: ok-shared-selfsigned-bootstrap
  namespace: vault
spec:
  selfSigned: {}
---
# ── 2. Internal CA certificate ────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ok-shared-internal-ca
  namespace: vault
spec:
  isCA: true
  commonName: ok-shared-internal-ca
  secretName: ok-shared-internal-ca          # holds tls.crt (the CA) + tls.key
  duration: 87600h                            # 10y — internal root
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ok-shared-selfsigned-bootstrap
    kind: Issuer
---
# ── 3. Internal CA Issuer (signs the Vault server cert) ───────────────────────
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: ok-shared-internal-ca
  namespace: vault
spec:
  ca:
    secretName: ok-shared-internal-ca
---
# ── 4. Vault server certificate ───────────────────────────────────────────────
# Shared server cert for all Raft voters. SANs cover: the external SNI host used
# by the ingress/consumers, the in-cluster active + headless service names (Raft
# peer / cluster traffic over the vault-internal headless service), and loopback.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-tls
  namespace: vault
spec:
  secretName: vault-server-tls                # mounted into Vault pods (next step)
  duration: 8760h                             # 1y
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ok-shared-internal-ca
    kind: Issuer
  commonName: vault.ok-shared.internal
  dnsNames:
    # external SNI (must match the IngressRouteTCP HostSNI and consumer address)
    - vault.ok-shared.internal
    # leader-only service (ingress backend)
    - vault-active
    - vault-active.vault.svc
    - vault-active.vault.svc.cluster.local
    # client-facing service
    - vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    # Raft peer / cluster traffic (headless per-pod)
    - "*.vault-internal"
    - "*.vault-internal.vault.svc.cluster.local"
    - localhost
  ipAddresses:
    - 127.0.0.1
---
# ── 5. Traefik IngressRouteTCP — TLS passthrough to the Raft leader ───────────
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: vault
  namespace: vault
spec:
  entryPoints:
    - websecure                               # 443, MetalLB-exposed
  routes:
    - match: HostSNI(`vault.ok-shared.internal`)
      services:
        - name: vault-active                  # leader-only — avoids standby redirect
          port: 8200
  tls:
    passthrough: true                         # Vault terminates TLS, not Traefik
