apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kagent-lab-tools
  namespace: kagent-lab
  labels:
    app.kubernetes.io/part-of: kagent-standalone
    openkubes.io/ticket: OK-129
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kagent-lab-tools
  namespace: kagent-lab
  labels:
    app.kubernetes.io/part-of: kagent-standalone
    openkubes.io/ticket: OK-129
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kagent-lab-tools
subjects:
  - kind: ServiceAccount
    name: kagent-lab-tools
    namespace: kagent-lab
