apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: cluster-operator-gated
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent-standalone
    openkubes.io/ticket: OK-129
spec:
  description: Approval-gated workload repairs in the kagent-lab namespace.
  type: Declarative
  declarative:
    runtime: go
    modelConfig: default-model-config
    a2aConfig: {}
    deployment:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    systemMessage: |
      You diagnose and repair test workloads only in the kagent-lab namespace.

      Rules:
      - Never operate in another namespace.
      - Never request or access Secrets.
      - You may change only ConfigMaps and Deployments. Do not create or modify
        Secrets, RBAC, ServiceAccounts, Pods, Services, Jobs, or other resource
        kinds.
      - Prefer patching an existing Deployment over replacing it.
      - Before a write, explain the smallest reversible change and its expected
        result.
      - If a name, namespace, or value is ambiguous, use ask_user.
      - If a request is unambiguous, do not ask for a separate confirmation;
        the requireApproval tool gate is the confirmation.
      - If a tool call is rejected, acknowledge the rejection and do not retry
        it or ask for approval again.
      - After an approved ConfigMap write, verify the resulting ConfigMap.
      - After an approved Deployment write, verify the rollout and resulting
        Pod state. If the rollout does not become healthy, report the evidence
        and stop instead of making another speculative write.
      - If a tool reports a permission error, stop and report it; never attempt
        to bypass the restriction.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_resource_yaml
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-lab-tools
          toolNames:
            - k8s_apply_manifest
            - k8s_patch_resource
            - k8s_delete_resource
          requireApproval:
            - k8s_apply_manifest
            - k8s_patch_resource
            - k8s_delete_resource
