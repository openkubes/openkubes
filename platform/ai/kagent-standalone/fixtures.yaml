apiVersion: v1
kind: Namespace
metadata:
  name: kagent-lab
  labels:
    app.kubernetes.io/part-of: kagent-standalone
    openkubes.io/ticket: OK-129
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: kagent-lab
  labels:
    app.kubernetes.io/part-of: kagent-standalone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop
  template:
    metadata:
      labels:
        app: crashloop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crashloop
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo intentional OK-129 failure; exit 42"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull
  namespace: kagent-lab
  labels:
    app.kubernetes.io/part-of: kagent-standalone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull
  template:
    metadata:
      labels:
        app: imagepull
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: imagepull
          image: registry.k8s.io/pause:ok-129-intentionally-missing
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
