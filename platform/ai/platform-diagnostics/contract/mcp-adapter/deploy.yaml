# MCP adapter Deployment + Service (platform-diagnostics namespace).
#   kubectl --kubeconfig ~/.kube/ok-ai.yaml apply -f deploy.yaml
# Consumers reach it at:
#   http://platform-diagnostics-mcp.platform-diagnostics.svc.cluster.local:8080/mcp
# Holds NO kube credentials — it forwards with a dedicated consumer identity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-diagnostics-mcp-adapter
  namespace: platform-diagnostics
  labels:
    app.kubernetes.io/name: platform-diagnostics-mcp-adapter
    app.kubernetes.io/part-of: platform-diagnostics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-diagnostics-mcp-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-diagnostics-mcp-adapter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: adapter
          image: "ghcr.io/openkubes/platform-diagnostics-mcp-adapter:0.2.0"
          env:
            - name: FACADE_URL
              value: "http://platform-diagnostics.platform-diagnostics.svc.cluster.local:8080"
            - name: DIAGNOSTICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-diagnostics-mcp-consumer
                  key: token
          ports:
            - name: mcp
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: mcp }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-diagnostics-mcp
  namespace: platform-diagnostics
  labels:
    app.kubernetes.io/name: platform-diagnostics-mcp-adapter
    app.kubernetes.io/part-of: platform-diagnostics
spec:
  selector:
    app.kubernetes.io/name: platform-diagnostics-mcp-adapter
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
---
# The adapter is the only thing standing in front of the provider, and it holds
# the provider's consumer credential. Without an ingress restriction its
# ClusterIP is reachable by every pod in the cluster, which would hand the whole
# read-only diagnostics surface to anything that can open a socket - and would
# quietly undo the consumer-side hardening (no RBAC, no ServiceAccount token)
# that ADR-021 relies on.
#
# Selecting the adapter pod with policyTypes: Ingress denies every source that
# is not listed below. A consumer is admitted by labelling its namespace, so the
# contract stays provider- and consumer-neutral: no namespace name is hardcoded
# here, and adding a consumer is a label, not an edit to this file.
#
#   kubectl label namespace <consumer-namespace> openkubes.io/diagnostics-consumer=true
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-diagnostics-mcp-adapter
  namespace: platform-diagnostics
  labels:
    app.kubernetes.io/name: platform-diagnostics-mcp-adapter
    app.kubernetes.io/part-of: platform-diagnostics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-diagnostics-mcp-adapter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              openkubes.io/diagnostics-consumer: "true"
      ports:
        - protocol: TCP
          port: 8080
