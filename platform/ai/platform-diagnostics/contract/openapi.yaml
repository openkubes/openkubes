openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

# Normative machine-readable definition of ADR-Platform-021, Phase 1.
# Provider profiles and adapters derive from this file; they do not extend its
# public surface. Provider endpoints, credentials, and deployment values belong
# in the implementation profile and are deliberately absent here.
info:
  title: OpenKubes Read-Only Platform Diagnostics Contract
  summary: Provider-neutral, read-only platform diagnostics.
  version: 1.1.0
  description: |
    Normative HTTP contract for standardized OpenKubes platform diagnostics.
    It defines exactly three Phase-1 operations. Consumers never receive
    Kubernetes credentials, evidence is returned by reference, and no operation
    can propose or execute a mutation.

    MCP servers, agent runtimes, runbook implementations, and user interfaces
    are adapters or providers of this contract. They are not part of the
    normative API surface.

    Consumers authenticate to the contract endpoint with their own consumer
    identity (`bearerAuth`); that identity — never a Kubernetes credential — is
    what the invocation audit records. Every response carries an
    `invocation_id`, the join key between the four ADR-021 audit artifacts
    (invocation audit, provider tool trace, diagnostic result, raw evidence).

    Every successful response is self-describing: it names the cluster, the
    subject, the effective time window, and the time of generation, so that a
    stored result remains attributable after it leaves the HTTP exchange
    (incident handoff, audit, offline expert review).

    The `/v1` path prefix is the compatibility-major API version. The
    `info.version` value versions this contract document within that API major;
    backward-compatible additions may increment it, while incompatible public
    surface changes require a new path major.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  x-adr: ADR-Platform-021
  x-ticket: OK-90
  x-status: Normative Phase 1 contract

servers:
  - url: /
    description: Deployment-relative endpoint supplied by the selected provider profile.

# Applies to all operations. Providers MAY additionally require transport-level
# client authentication; that is a provider value, not part of this contract.
security:
  - bearerAuth: []

tags:
  - name: diagnostics
    description: The complete public surface of the Phase-1 diagnostics contract.

paths:
  /v1/get_platform_health:
    post:
      operationId: get_platform_health
      tags: [diagnostics]
      summary: Get a cross-cluster platform health snapshot.
      description: |
        Returns health for the requested logical cluster names. An empty request
        includes all clusters known to the provider. Cluster values are logical
        names, never API endpoints or kubeconfig references.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPlatformHealthInput'
      responses:
        '200':
          description: A normalized platform health snapshot.
          headers:
            X-Invocation-Id:
              $ref: '#/components/headers/InvocationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /v1/investigate_workload:
    post:
      operationId: investigate_workload
      tags: [diagnostics]
      summary: Investigate one workload.
      description: |
        Returns a finalized diagnostic result grounded in referenced evidence.
        Recommended next steps are human actions only and are never executed by
        the provider. Every returned hypothesis has completed a counter-evidence
        check; `not_checked` is invalid in a successful response.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigateWorkloadInput'
      responses:
        '200':
          description: A finalized, evidence-grounded workload investigation.
          headers:
            X-Invocation-Id:
              $ref: '#/components/headers/InvocationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadInvestigation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /v1/collect_diagnostic_evidence:
    post:
      operationId: collect_diagnostic_evidence
      tags: [diagnostics]
      summary: Collect evidence without generating hypotheses.
      description: |
        Returns evidence references for incident handoff, audit, or offline
        expert review. Raw logs, events, credentials, and secret values remain at
        their sources. For every explicitly requested unsupported evidence type,
        the response contains an `unavailable` EvidenceRef with a reason; silent
        omission is not conformant.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectDiagnosticEvidenceInput'
      responses:
        '200':
          description: An evidence bundle containing references only.
          headers:
            X-Invocation-Id:
              $ref: '#/components/headers/InvocationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceBundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Consumer identity as a bearer token. The token identifies the *consumer*
        (a conversational assistant, a CLI, a controller, a test suite) and is
        never a Kubernetes credential: per ADR-021 the consumer holds no cluster
        access, and the provider enforces Kubernetes RBAC internally.

        The provider MUST record this identity in the invocation audit together
        with the operation, the timestamp, and the `invocation_id`. Issuer,
        audience, and claim mapping are provider profile values, not part of
        this contract.

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Consumer-supplied correlation id. When present, the provider MUST echo it
        in the invocation audit alongside the `invocation_id` it assigns, so a
        consumer-side incident record and the platform audit trail can be joined
        from either end.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    InvocationId:
      required: true
      description: |
        The `invocation_id` assigned to this call. Present on every response,
        including errors — an authorization failure or provider outage must stay
        traceable in the invocation audit even though it carries no result body.
      schema:
        $ref: '#/components/schemas/InvocationId'

  responses:
    BadRequest:
      description: The request is semantically invalid.
      headers:
        X-Invocation-Id:
          $ref: '#/components/headers/InvocationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Consumer authentication is missing or invalid.
      headers:
        X-Invocation-Id:
          $ref: '#/components/headers/InvocationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated consumer may not perform this operation.
      headers:
        X-Invocation-Id:
          $ref: '#/components/headers/InvocationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableContent:
      description: The JSON body does not conform to the operation input schema.
      headers:
        X-Invocation-Id:
          $ref: '#/components/headers/InvocationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: The provider failed without exposing raw evidence or secrets.
      headers:
        X-Invocation-Id:
          $ref: '#/components/headers/InvocationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProviderUnavailable:
      description: The selected diagnostics provider is temporarily unavailable.
      headers:
        X-Invocation-Id:
          $ref: '#/components/headers/InvocationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    InvocationId:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        Provider-assigned identifier for a single contract invocation. It is the
        join key between the four ADR-021 audit artifacts: invocation audit,
        provider tool trace, diagnostic result, and raw evidence. It carries no
        evidence content and is safe to log centrally and to quote in an incident
        ticket.
      examples: [inv-2026-08-06-7f3a91c4]

    EvidenceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      description: |
        Provider-assigned opaque identifier for one EvidenceRef. It is unique
        within an invocation and remains stable wherever that evidence is
        referenced across the invocation's audit artifacts. Unlike `uri`, it is
        always present, including when evidence is unavailable. Consumers must
        compare it as an opaque string and must not derive source information
        from its shape.
      examples: [ev-inv-2026-08-06-7f3a91c4-01]

    LogicalClusterName:
      type: string
      minLength: 1
      maxLength: 253
      description: Logical cluster name; never an API endpoint or kubeconfig reference.
      examples: [ok-ai]

    NamespaceName:
      type: string
      minLength: 1
      maxLength: 63
      description: Kubernetes namespace containing the workload.
      examples: [payments]

    WorkloadName:
      type: string
      minLength: 1
      maxLength: 253
      description: Provider-resolvable workload name within the namespace.
      examples: [checkout-api]

    TimeRange:
      type: string
      format: duration
      default: PT1H
      description: ISO-8601 duration. A provider may clamp it to available retention.
      examples: [PT1H, P1D]

    TimeWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      description: |
        The time window the provider actually evaluated. A provider may clamp the
        requested `time_range` to available retention; reporting the resulting
        absolute window is what makes a result reproducible and auditable.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    GetPlatformHealthInput:
      type: object
      additionalProperties: false
      properties:
        clusters:
          type: array
          uniqueItems: true
          maxItems: 100
          description: Logical clusters to include. Empty or absent means all known clusters.
          items:
            $ref: '#/components/schemas/LogicalClusterName'

    InvestigateWorkloadInput:
      type: object
      additionalProperties: false
      required: [cluster, namespace, workload]
      properties:
        cluster:
          $ref: '#/components/schemas/LogicalClusterName'
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        workload:
          $ref: '#/components/schemas/WorkloadName'
        time_range:
          $ref: '#/components/schemas/TimeRange'

    CollectDiagnosticEvidenceInput:
      type: object
      additionalProperties: false
      required: [cluster, namespace, workload]
      properties:
        cluster:
          $ref: '#/components/schemas/LogicalClusterName'
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        workload:
          $ref: '#/components/schemas/WorkloadName'
        time_range:
          $ref: '#/components/schemas/TimeRange'
        evidence_types:
          type: array
          uniqueItems: true
          maxItems: 50
          description: |
            Evidence types requested by the consumer. Empty or absent requests
            the provider's standard evidence set. Values are extensible; an
            unsupported requested value must produce an unavailable EvidenceRef.
          items:
            type: string
            minLength: 1
          examples:
            - [events, logs, describe, host_journal]

    PlatformHealth:
      type: object
      additionalProperties: false
      required: [invocation_id, generated_at, clusters]
      properties:
        invocation_id:
          $ref: '#/components/schemas/InvocationId'
        generated_at:
          type: string
          format: date-time
        clusters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ClusterHealth'

    ClusterHealth:
      type: object
      additionalProperties: false
      required: [cluster, status, summary, signals, provider_capabilities]
      properties:
        cluster:
          $ref: '#/components/schemas/LogicalClusterName'
        status:
          type: string
          enum: [healthy, degraded, unavailable, unknown]
          description: |
            Normalized health of this cluster. `unknown` means that the provider
            could not determine a reliable health state; it must not be coerced
            to `unavailable`. Other requested clusters may still carry valid
            health results in the same response.
        summary:
          type: string
        signals:
          type: array
          uniqueItems: true
          maxItems: 100
          description: Stable or provider-extension signal identifiers.
          items:
            type: string
            minLength: 1
          examples:
            - [node_not_ready, workload_failures]
        provider_capabilities:
          $ref: '#/components/schemas/ProviderCapabilities'

    WorkloadInvestigation:
      type: object
      additionalProperties: false
      description: |
        A finalized diagnostic result. It is self-describing: subject, effective
        time window, generation time, and invocation id travel with the payload,
        so the result stays attributable after it is exported into an incident
        ticket or an offline review.
      required:
        - invocation_id
        - cluster
        - namespace
        - workload
        - generated_at
        - effective_time_range
        - summary
        - symptoms
        - evidence
        - probable_causes
        - recommended_next_steps
        - references
        - provider_capabilities
      properties:
        invocation_id:
          $ref: '#/components/schemas/InvocationId'
        cluster:
          $ref: '#/components/schemas/LogicalClusterName'
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        workload:
          $ref: '#/components/schemas/WorkloadName'
        generated_at:
          type: string
          format: date-time
        effective_time_range:
          $ref: '#/components/schemas/TimeWindow'
        summary:
          type: string
        symptoms:
          type: array
          maxItems: 100
          items:
            type: string
        evidence:
          type: array
          maxItems: 500
          description: |
            EvidenceRef objects whose `id` values are unique within this
            invocation. Referential-integrity checks are part of the executable
            OK-91 contract suite.
          items:
            $ref: '#/components/schemas/EvidenceRef'
        probable_causes:
          type: array
          maxItems: 20
          description: Ranked from highest to lowest confidence.
          items:
            $ref: '#/components/schemas/FinalizedRankedHypothesis'
        recommended_next_steps:
          type: array
          maxItems: 50
          description: Human actions only; the provider never executes them.
          items:
            type: string
        references:
          type: array
          maxItems: 50
          description: References to runbooks, ADRs, or dashboards.
          items:
            type: string
        provider_capabilities:
          $ref: '#/components/schemas/ProviderCapabilities'

    EvidenceBundle:
      type: object
      additionalProperties: false
      description: |
        Evidence references without hypothesis generation. Like
        WorkloadInvestigation it is self-describing, because its forcing consumers
        are incident handoff, audit, and offline expert review.
      required:
        - invocation_id
        - cluster
        - namespace
        - workload
        - collected_at
        - effective_time_range
        - evidence
        - provider_capabilities
      properties:
        invocation_id:
          $ref: '#/components/schemas/InvocationId'
        cluster:
          $ref: '#/components/schemas/LogicalClusterName'
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        workload:
          $ref: '#/components/schemas/WorkloadName'
        collected_at:
          type: string
          format: date-time
        effective_time_range:
          $ref: '#/components/schemas/TimeWindow'
        evidence:
          type: array
          maxItems: 500
          description: |
            EvidenceRef objects whose `id` values are unique within this
            invocation.
          items:
            $ref: '#/components/schemas/EvidenceRef'
        provider_capabilities:
          $ref: '#/components/schemas/ProviderCapabilities'

    RankedHypothesis:
      type: object
      additionalProperties: false
      required:
        - hypothesis
        - confidence
        - evidence_refs
        - contradicting_evidence_refs
        - counter_evidence_status
      properties:
        hypothesis:
          type: string
          minLength: 1
        confidence:
          type: string
          enum: [low, medium, high]
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: |
            IDs of supporting EvidenceRef objects returned with this result.
            Every ID must resolve to exactly one item in `evidence`, including
            when that evidence is unavailable and therefore has no `uri`.
          items:
            $ref: '#/components/schemas/EvidenceId'
        contradicting_evidence_refs:
          type: array
          maxItems: 50
          uniqueItems: true
          description: |
            IDs of contradicting EvidenceRef objects returned with this result.
            Every ID must resolve to exactly one item in `evidence`.
          items:
            $ref: '#/components/schemas/EvidenceId'
        counter_evidence_status:
          type: string
          enum: [found, none_found, not_checked]
          description: |
            Whether counter-evidence was sought and found, sought and not found,
            or not sought. `not_checked` is valid only for an intermediate provider
            artifact and is rejected by FinalizedRankedHypothesis.

    FinalizedRankedHypothesis:
      description: A hypothesis returned in a successful, finalized investigation.
      allOf:
        - $ref: '#/components/schemas/RankedHypothesis'
        - type: object
          properties:
            counter_evidence_status:
              type: string
              enum: [found, none_found]

    EvidenceRef:
      type: object
      additionalProperties: false
      required: [id, type, source, status, collected_at]
      properties:
        id:
          $ref: '#/components/schemas/EvidenceId'
        type:
          type: string
          minLength: 1
          description: Stable evidence type, such as events, logs, or describe.
        source:
          type: string
          minLength: 1
          description: Logical source that owns the evidence.
        status:
          type: string
          enum: [available, unavailable, partial]
        reason:
          type: string
          minLength: 1
          description: Required when status is unavailable or partial.
        uri:
          type: string
          minLength: 1
          format: uri-reference
          description: Reference to evidence at its source; never an embedded payload or secret.
        collected_at:
          type: string
          format: date-time
          description: Time the evidence was collected or its availability was evaluated.
      allOf:
        - if:
            required: [status]
            properties:
              status:
                enum: [unavailable, partial]
          then:
            required: [reason]
        - if:
            required: [status]
            properties:
              status:
                enum: [available, partial]
          then:
            required: [uri]

    ProviderCapabilities:
      type: object
      description: |
        Provider capability declaration. Distribution differences are capability
        deltas, never contract deltas. Additional boolean capabilities may be
        introduced without changing this response shape.
      required:
        - workload_events
        - workload_logs
        - cilium_diagnostics
        - host_journal
        - node_shell
      properties:
        workload_events:
          type: boolean
        workload_logs:
          type: boolean
        cilium_diagnostics:
          type: boolean
        host_journal:
          type: boolean
        node_shell:
          type: boolean
      additionalProperties:
        type: boolean
      examples:
        - workload_events: true
          workload_logs: true
          cilium_diagnostics: true
          host_journal: false
          node_shell: false

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          description: Stable machine-readable error code.
        message:
          type: string
          minLength: 1
          description: Safe summary containing no raw evidence, credentials, or secrets.
        invocation_id:
          $ref: '#/components/schemas/InvocationId'
