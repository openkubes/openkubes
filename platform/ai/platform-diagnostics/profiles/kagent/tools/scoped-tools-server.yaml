# Scoped kagent tools server for Profile A — the READ-ONLY enforcement point.
#
# A private copy of kagent's tools image (ghcr.io/kagent-dev/kagent/tools), running
# under the read-only SA `openkubes-platform-agent` (rbac.yaml: get/list/watch,
# secrets excluded). Specialists reference it as RemoteMCPServer
# `platform-diagnostics-tools` and get only read tool names. The shared
# `kagent-tool-server` runs under kagent's WRITE-capable RBAC and exposes
# destructive tools (k8s_delete_resource, k8s_apply_manifest, shell, ...), so we do
# NOT reuse it — that would fail ADR-021 test 2 (RBAC audit of the executing identity).
#
# Confirmed from the cluster (2026-07-24): image tag 0.2.1, port 8084, MCP path
# /mcp, protocol STREAMABLE_HTTP, RemoteMCPServer group kagent.dev/v1alpha2.
#
# ►►► ONE thing still to confirm — the kagent-tools container's args/command/env:
#   kubectl -n kagent get deploy kagent-tools -o yaml
# If the shipped container passes args/env to serve on 8084/mcp, mirror them below.
# (If it just uses the image's default entrypoint, leave args empty.)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-diagnostics-tools
  namespace: platform-diagnostics
  labels:
    app.kubernetes.io/name: platform-diagnostics-tools
    app.kubernetes.io/part-of: platform-diagnostics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-diagnostics-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-diagnostics-tools
    spec:
      # THE read-only boundary: tools execute kubectl under this SA (rbac.yaml).
      serviceAccountName: openkubes-platform-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tools
          image: "ghcr.io/kagent-dev/kagent/tools:0.2.1"
          # __FILL__ args/command/env from `kubectl -n kagent get deploy kagent-tools -o yaml`
          # (leave empty if the shipped deploy uses the image default entrypoint).
          args: []
          ports:
            - name: mcp
              containerPort: 8084
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-diagnostics-tools
  namespace: platform-diagnostics
  labels:
    app.kubernetes.io/name: platform-diagnostics-tools
    app.kubernetes.io/part-of: platform-diagnostics
spec:
  selector:
    app.kubernetes.io/name: platform-diagnostics-tools
  ports:
    - name: mcp
      port: 8084
      targetPort: mcp
---
# Registers the scoped tools server. Mirrors the shipped kagent-tool-server spec
# (kagent.dev/v1alpha2, STREAMABLE_HTTP), but points at OUR service.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: platform-diagnostics-tools
  namespace: platform-diagnostics
  labels:
    app.kubernetes.io/part-of: platform-diagnostics
spec:
  description: Read-only cluster inspection tools (scoped to the read-only SA).
  protocol: STREAMABLE_HTTP
  url: http://platform-diagnostics-tools.platform-diagnostics.svc.cluster.local:8084/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
