# Specialist: Kubernetes workload diagnosis (Cluster Inspection Contract, UC-1).
# Internal delegate of openkubes-platform-agent — not exposed to consumers.
#
# Tools come from OUR scoped kagent-tools instance (RemoteMCPServer
# `platform-diagnostics-tools`, same namespace), which runs under the read-only
# SA `openkubes-platform-agent`. Only READ tools are exposed; the write tools
# kagent ships (k8s_create/patch/delete/apply/execute_command) are omitted AND
# denied by RBAC — so read-only is hard-enforced (ADR-021 test 2), not just prompt.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kubernetes-agent
  namespace: platform-diagnostics
  labels:
    app.kubernetes.io/part-of: platform-diagnostics
    platform.openkubes.ai/profile: kagent
    platform.openkubes.ai/role: specialist
spec:
  description: Read-only Kubernetes workload/controller/event diagnosis.
  type: Declarative
  declarative:
    modelConfig: ollama-gpt-oss
    a2aConfig: {}
    systemMessage: |
      Read-only Kubernetes specialist. Inspect pods, deployments, replicasets,
      statefulsets, daemonsets, jobs, events, endpoints and node conditions to
      explain workload failures (CrashLoopBackOff, ImagePullBackOff, Pending,
      OOMKilled, failed probes). get/list/watch only — never mutate. Report what
      you could NOT see (RBAC/provider limits) rather than guessing around it.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: platform-diagnostics-tools     # our scoped, read-only instance
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_resource_yaml
            - k8s_get_available_api_resources
            - k8s_get_cluster_configuration
