# Specialist: Cilium / network triage (UC-4). Internal delegate; read-only.
apiVersion: kagent.dev/v1alpha1
kind: Agent
metadata:
  name: cilium-agent
  namespace: platform-diagnostics
  labels:
    app.kubernetes.io/part-of: platform-diagnostics
    platform.openkubes.ai/profile: kagent
    platform.openkubes.ai/role: specialist
spec:
  description: Read-only Cilium/CNI and network-policy triage.
  modelConfig: ollama-gpt-oss
  systemMessage: |
    Read-only network specialist. Inspect CiliumEndpoints, CiliumNetworkPolicies,
    CiliumNodes and core networking (services, endpoints, ingresses,
    networkpolicies) to explain connectivity/policy issues. Bring in codified
    OpenKubes network learnings (stale ARP, overlay-vs-vSwitch path) via the
    Documentation Contract when relevant. get/list/watch only.
  tools:
    - type: McpServer
      mcpServer:
        toolServer: cluster-inspection
        names: [k8s_get, k8s_describe, cilium_status]
