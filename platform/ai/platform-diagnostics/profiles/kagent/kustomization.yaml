# Applies the kagent Custom Resources for Profile A as one unit.
#
#   kubectl --kubeconfig ~/.kube/ok-ai.yaml apply -k .
#
# Prereqs: kagent CRDs + controller installed (ok-cluster/kagent `make install`),
# and namespace `platform-diagnostics`. This kustomization sets up the read-only
# RBAC and the kagent CRs. The facade Deployment/Service is deployed by the Helm
# chart in charts/ (the facade holds no kube creds, so it is not part of this SA).
#
# The real Ollama host is patched in from ok-cluster (private Provider Value) —
# see ok-cluster/kagent. Do not hardcode it here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-diagnostics
resources:
  - namespace.yaml
  - rbac.yaml
  - modelconfig.yaml
  # tools/scoped-tools-server.yaml is intentionally NOT listed yet: it carries
  # __FILL__ placeholders (kagent tools image/port/transport). Add this line once
  # those are filled from the cluster — until then the specialists stay
  # ACCEPTED:False (they reference the not-yet-created RemoteMCPServer), which is
  # expected. The front agent is unaffected.
  # - tools/scoped-tools-server.yaml
  - agents/openkubes-platform-agent.yaml
  - agents/specialists/kubernetes-agent.yaml
  - agents/specialists/cilium-agent.yaml
  - agents/specialists/observability-agent.yaml
