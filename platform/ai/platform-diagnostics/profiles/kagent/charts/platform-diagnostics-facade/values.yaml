# Facade Provider Values. Real endpoints/tokens come from ok-cluster at install
# time (make install / Crossplane Claim) — do not commit real values here.

image:
  repository: ghcr.io/openkubes/platform-diagnostics-facade
  tag: "0.1.3"
  pullPolicy: IfNotPresent

# Pull secrets for a private registry (e.g. a private GHCR package). Empty by
# default; set from the instance values (ok-cluster) when needed.
imagePullSecrets: []

# kagent connection (in-cluster). The A2A endpoint is
#   {baseUrl}/api/a2a/{namespace}/{agent}
# baseUrl = kagent CONTROLLER svc (serves A2A on 8083); namespace = Agents' ns.
kagent:
  baseUrl: "http://kagent-controller.kagent.svc.cluster.local:8083"
  namespace: "platform-diagnostics"
  agent: "openkubes-platform-agent"
  toolsUrl: "http://platform-diagnostics-tools.platform-diagnostics.svc.cluster.local:8084/mcp"
  # token: injected via Secret if kagent auth is enabled (Makefile handles it).
  token: ""

# Provider capability declaration (ADR-021). Talos defaults; RKE2 overlays flip
# host_journal/node_shell to true. A capability delta is NEVER a contract delta.
providerCapabilities:
  workload_events: true
  workload_logs: true
  cilium_diagnostics: true
  host_journal: false
  node_shell: false

service:
  port: 8080

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# The facade holds NO kubernetes credentials (consumers/facade never get cluster
# access; ADR-021). Runs under the namespace default SA. Cluster read access
# lives only in the kagent tool-executor SA (see ../../rbac.yaml).
