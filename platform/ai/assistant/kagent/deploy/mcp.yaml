# PoC-only: replace the image placeholder with an immutable, scanned image digest
# and provision the source index as ConfigMap openkubes-docs-index.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openkubes-docs-search
  namespace: openkubes-assistant
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openkubes-docs-search
  namespace: openkubes-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openkubes-docs-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openkubes-docs-search
    spec:
      serviceAccountName: openkubes-docs-search
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs-search
          image: REPLACE_WITH_IMMUTABLE_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENKUBES_DOCS_INDEX
              value: /data/index.json
            - name: OPENKUBES_MCP_TRANSPORT
              value: streamable-http
            - name: OPENKUBES_MCP_HOST
              value: 0.0.0.0
            - name: OPENKUBES_MCP_PORT
              value: "8000"
          ports:
            - name: mcp
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: index
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: index
          configMap:
            name: openkubes-docs-index
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openkubes-docs-search
  namespace: openkubes-assistant
spec:
  selector:
    app.kubernetes.io/name: openkubes-docs-search
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
