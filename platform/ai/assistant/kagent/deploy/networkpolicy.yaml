apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs-search-restrict
  namespace: openkubes-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openkubes-docs-search
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openkubes-docs-agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8000
  egress: []
