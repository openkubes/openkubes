# UC-1 evidence fixtures (OK-14) — deliberately broken workloads for scenario S2/S3.
#
# Created by a HUMAN OPERATOR, never by an agent. The diagnostics provider stays
# read-only throughout (ADR-021); these manifests exist so there is something
# real and reproducible to diagnose.
#
# Namespace is templated as __NS__ and substituted by uc1-evidence.sh.
---
apiVersion: v1
kind: Namespace
metadata:
  name: __NS__
  labels:
    app.kubernetes.io/part-of: openkubes-evidence
    openkubes.io/purpose: ok-14-uc1-evidence
    # Fixtures must not trip PodSecurity; both run as non-root, no capabilities.
    pod-security.kubernetes.io/enforce: restricted
---
# S2 fixture 1 — ImagePullBackOff: the tag does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc1-imagepull
  namespace: __NS__
  labels:
    app.kubernetes.io/name: uc1-imagepull
    openkubes.io/purpose: ok-14-uc1-evidence
  annotations:
    openkubes.io/expected-failure: ImagePullBackOff
    openkubes.io/evidence-scenario: S2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uc1-imagepull
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uc1-imagepull
    spec:
      # Fail fast instead of sitting in the default 5-minute backoff wait.
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Nonexistent tag on a real repository -> ErrImagePull/ImagePullBackOff.
          image: registry.k8s.io/pause:0.0.0-openkubes-evidence-does-not-exist
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
# S2/S3 fixture 2 — CrashLoopBackOff: starts, logs a distinctive reason, exits 1.
# The log line is deliberately greppable so S3 can show that log evidence is
# referenced (by uri) rather than embedded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc1-crashloop
  namespace: __NS__
  labels:
    app.kubernetes.io/name: uc1-crashloop
    openkubes.io/purpose: ok-14-uc1-evidence
  annotations:
    openkubes.io/expected-failure: CrashLoopBackOff
    openkubes.io/evidence-scenario: S2,S3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uc1-crashloop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uc1-crashloop
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "OK14-EVIDENCE: startup failed, required config key DB_DSN is missing" >&2
              sleep 2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
