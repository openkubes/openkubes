# The only Kubernetes authority added for DeveloperWorkspace reconciliation (OK-175).
#
# Bound to provider-kubernetes's ServiceAccount, never to a workspace. It covers exactly the
# kinds the Composition emits and adds no RBAC kinds, Pods or exec; workspace ServiceAccounts
# receive no bindings at all. Crossplane separately grants every provider Secrets and ConfigMaps
# cluster-wide (see "Provider authority" in ../README.md). Cluster scope is required because
# workspace Namespaces are created on demand; install/namespace-guard.yaml confines the writes
# to Namespaces the provider created for a workspace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer-workspace-provider-kubernetes
rules:
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, resourcequotas, limitranges, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: developer-workspace-provider-kubernetes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: developer-workspace-provider-kubernetes
subjects:
  - kind: ServiceAccount
    name: developer-workspace-provider-kubernetes
    namespace: crossplane-system
