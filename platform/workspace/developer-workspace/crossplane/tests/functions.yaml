# Function packages for local `crossplane render` and for install on the proof cluster.
# Same go-templating version as the PostgreSQL capability on ok-mgmt.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
  annotations:
    render.crossplane.io/runtime-docker-pull-policy: IfNotPresent
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.9.2
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
  annotations:
    render.crossplane.io/runtime-docker-pull-policy: IfNotPresent
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.4.1
