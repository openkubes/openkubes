# Applied by `make identities`. Contains reviewer / seeder / VSO-reader ServiceAccounts and the reviewer token Secret.
# Apply ORDER is not encoded in this filename on purpose — it lives in the `install` target,
# which is its only real authority. Filenames match their make target so the mapping is obvious.
# The dedicated namespace contains Keycloak and its private database state.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
# This dedicated Category-A reviewer identity is not the Vault chart ServiceAccount:
# reusing Vault's runtime identity would collapse the TokenReview trust boundary.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${VAULT_REVIEWER_SA}
  namespace: ${SYSTEM_NAMESPACE}
---
# VSO authenticates as this dedicated least-privilege reader for Keycloak's
# Vault paths; it is separate from the ServiceAccount rendered by the chart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${VSO_SERVICE_ACCOUNT}
  namespace: ${NAMESPACE}
automountServiceAccountToken: false
---
# The owner uses this separate, short-lived identity only to seed Keycloak values;
# it must remain distinct from the read-only VSO workload identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${VAULT_SEED_SA}
  namespace: ${NAMESPACE}
automountServiceAccountToken: false
---
# TokenReview requires the dedicated reviewer to delegate authentication checks;
# no Keycloak or seeding identity receives this cluster-wide permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${VAULT_REVIEWER_CRB}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ${VAULT_REVIEWER_SA}
    namespace: ${SYSTEM_NAMESPACE}
---
# Kubernetes 1.34 does not auto-create a long-lived ServiceAccount token Secret;
# this explicit reviewer token is consumed by the Vault Kubernetes auth backend.
apiVersion: v1
kind: Secret
metadata:
  name: ${VAULT_REVIEWER_TOKEN_SECRET}
  namespace: ${SYSTEM_NAMESPACE}
  annotations:
    kubernetes.io/service-account.name: ${VAULT_REVIEWER_SA}
type: kubernetes.io/service-account-token
