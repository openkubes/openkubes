site_name: OpenKubes
site_url: https://openkubes.org/
site_description: OpenKubes website and developer documentation
docs_dir: .mkdocs-staging
site_dir: .mkdocs-site
theme:
  name: material
  # Privacy by Design: do not request Google Fonts from visitors' browsers.
  font: false
  custom_dir: website/overrides
  favicon: openkubes-cube-v2.svg
  palette:
    scheme: default
    primary: blue
    accent: blue
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
extra_css:
  - assets/openkubes-navigation.css
  - assets/openkubes-theme.css
  - assets/openkubes-branding.css
extra_javascript:
  - assets/openkubes-branding.js
  - assets/openkubes-research-lightbox.js
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
nav:
  - Home: index.md
  - Getting Started: getting-started/index.md
  - Features: features/index.md
  - Open Universe:
      - Overview: open-universe/index.md
      - Full Family & Technology Guide: open-universe/family.md
