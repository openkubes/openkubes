<rect x="45" y="698" width="1110" height="61" rx="14" fill="#174042" stroke="#56b6ac" stroke-width="2"/>
<text x="70" y="735" font-size="20" fill="#fff" font-weight="700">INDEPENDENT EVIDENCE</text>
<text x="411" y="735" font-size="17" fill="#c5f4ed">Immutable transition outcome  ·  Dynamic current health</text>
