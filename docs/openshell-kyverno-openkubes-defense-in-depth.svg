<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<title id="title">OpenShell, Kyverno, Cilium and OpenKubes: proposed defense-in-depth architecture</title>
<desc id="desc">Conceptual architecture showing hosted AI agents running in OpenShell sandboxes created through Kubernetes Agent Sandbox API. Kyverno checks Kubernetes resource admission and Cilium enforces network policy. Hosted and external agents access the same read-only and candidate-only OpenKubes interfaces. Only the separate trusted OpenKubes control-plane boundary may authorize, execute and verify desired-state changes.</desc>
<defs>
<style><![CDATA[
  .h{font:700 24px system-ui,-apple-system,Arial,sans-serif;fill:#152c43}
  .m{font:650 21px system-ui,-apple-system,Arial,sans-serif;fill:#152c43}
  .t{font:400 17px system-ui,-apple-system,Arial,sans-serif;fill:#3d5167}
  .s{font:400 15px system-ui,-apple-system,Arial,sans-serif;fill:#50657b}
  .n{font:650 17px system-ui,-apple-system,Arial,sans-serif;fill:#152c43}
  .path{fill:none;stroke:#476d8d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .dashed{fill:none;stroke:#476d8d;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round}
]]></style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#476d8d"/></marker>
</defs>
