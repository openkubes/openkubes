<path d="M600 739 V773" class="path" marker-end="url(#arrow)"/>
<rect x="88" y="781" width="1024" height="77" rx="17" fill="#e6eefb" stroke="#7999cb" stroke-width="2"/>
<text x="600" y="815" text-anchor="middle" class="m">Trusted OpenKubes Operations Boundary</text>
<text x="600" y="842" text-anchor="middle" class="s">Human review · Independent policy · Executor · CAS authority · Controller evidence</text>
<text x="600" y="888" text-anchor="middle" class="s">Conceptual only · Not deployed or security-qualified · ADR-Platform-042 (Proposed)</text>
