<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
  <title id="title">OpenKubes BYOH Controller</title>
  <desc id="desc">Minimal architecture diagram showing the Kubernetes management cluster, OpenKubes BYOH Controller, BYOH Host Agent and Installer, and the two host types: bare-metal hosts and virtual machines.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf5f8"/>
    </linearGradient>
    <linearGradient id="management" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183e68"/>
      <stop offset="1" stop-color="#245d87"/>
    </linearGradient>
    <linearGradient id="provider" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087f8c"/>
      <stop offset="1" stop-color="#12a4a0"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#246d51"/>
      <stop offset="1" stop-color="#31966c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#183a56" flood-opacity=".12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1 1 L11 7 L1 13" fill="none" stroke="#55758d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1 1 L11 7 L1 13" fill="none" stroke="#27845f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .kicker{font-size:17px;font-weight:750;letter-spacing:3px;fill:#244a68}
      .mainTitle{font-size:54px;font-weight:780;letter-spacing:-1.3px;fill:#142c43}
      .subtitle{font-size:21px;font-weight:450;fill:#587287}
      .layerLabel{font-size:19px;font-weight:750;letter-spacing:2.5px;fill:#fff}
      .layerTitle{font-size:38px;font-weight:760;letter-spacing:-.5px;fill:#fff}
      .hostTitle{font-size:30px;font-weight:720;fill:#142c43}
      .pill{font-size:16px;font-weight:760;letter-spacing:1.2px;fill:#17344d}
    </style>
  </defs>

  <rect width="1440" height="1200" fill="url(#canvas)"/>
  <circle cx="1320" cy="80" r="230" fill="#dceef2" opacity=".62"/>
  <circle cx="85" cy="1040" r="205" fill="#dce9f5" opacity=".58"/>
  <path d="M0 1120 C210 1010 310 1210 520 1120" fill="none" stroke="#d7e8ef" stroke-width="2" opacity=".7"/>

  <text x="110" y="82" class="kicker">OPENKUBES / INFRASTRUCTURE LIFECYCLE</text>
  <text x="110" y="151" class="mainTitle">OpenKubes BYOH Controller</text>
  <text x="112" y="194" class="subtitle">Bringing existing Linux hosts into the Kubernetes lifecycle.</text>

  <!-- Management plane -->
  <g filter="url(#shadow)">
    <rect x="110" y="250" width="1220" height="170" rx="30" fill="url(#management)"/>
  </g>
  <text x="170" y="310" class="layerLabel">MANAGEMENT PLANE</text>
  <text x="170" y="370" class="layerTitle">Kubernetes Management Cluster</text>

  <path d="M720 420 V478" fill="none" stroke="#55758d" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Infrastructure provider -->
  <g filter="url(#shadow)">
    <rect x="110" y="500" width="1220" height="170" rx="30" fill="url(#provider)"/>
  </g>
  <text x="170" y="560" class="layerLabel">INFRASTRUCTURE PROVIDER</text>
  <text x="170" y="620" class="layerTitle">OpenKubes BYOH Controller</text>

  <path d="M720 670 V728" fill="none" stroke="#55758d" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Host execution -->
  <g filter="url(#shadow)">
    <rect x="110" y="750" width="1220" height="170" rx="30" fill="url(#agent)"/>
  </g>
  <text x="170" y="810" class="layerLabel">HOST EXECUTION LAYER</text>
  <text x="170" y="870" class="layerTitle">BYOH Host Agent &amp; Installer</text>

  <!-- Branching arrows to host types -->
  <path d="M720 920 V950 C720 974 625 974 545 1010" fill="none" stroke="#27845f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M720 920 V950 C720 974 815 974 895 1010" fill="none" stroke="#27845f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- Bare metal card -->
  <g filter="url(#shadow)">
    <rect x="110" y="1010" width="600" height="125" rx="24" fill="#fff" stroke="#c8dce8" stroke-width="1.5"/>
    <rect x="730" y="1010" width="600" height="125" rx="24" fill="#fff" stroke="#c8dce8" stroke-width="1.5"/>
  </g>
  <g transform="translate(170 1040)">
    <rect x="0" y="0" width="62" height="20" rx="7" fill="#245d87"/>
    <rect x="0" y="28" width="62" height="20" rx="7" fill="#245d87"/>
    <rect x="0" y="56" width="62" height="20" rx="7" fill="#245d87"/>
    <circle cx="48" cy="10" r="3.5" fill="#fff"/>
    <circle cx="48" cy="38" r="3.5" fill="#fff"/>
    <circle cx="48" cy="66" r="3.5" fill="#fff"/>
  </g>
  <text x="270" y="1087" class="hostTitle">Bare-metal hosts</text>

  <!-- Virtual machines card -->
  <g transform="translate(790 1035)">
    <rect x="0" y="0" width="72" height="62" rx="8" fill="none" stroke="#245d87" stroke-width="5"/>
    <path d="M36 62 V73 M18 75 H54" stroke="#245d87" stroke-width="5" stroke-linecap="round"/>
    <path d="M19 34 C12 34 10 28 13 23 C16 18 22 18 26 21 C29 12 43 12 47 22 C55 21 60 27 57 33 C56 37 52 39 48 39 H20 Z" fill="#68a9ee"/>
  </g>
  <text x="900" y="1087" class="hostTitle">Virtual machines</text>

  <!-- Capability maturity tags -->
  <rect x="250" y="1150" width="400" height="34" rx="17" fill="#e4effc" stroke="#b8d2ef"/>
  <text x="450" y="1173" class="pill" text-anchor="middle">SAFETY: INITIAL / OPT-IN</text>
  <rect x="690" y="1150" width="500" height="34" rx="17" fill="#e1f4ec" stroke="#b1dccb"/>
  <text x="940" y="1173" class="pill" text-anchor="middle">UPGRADE PLANNER: READ-ONLY</text>
</svg>