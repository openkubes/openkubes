<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
<title id="title">Your OpenKubes Learning Journey</title>
<desc id="desc">Five illustrative stages, each independently accessible: explore platform features, experiment with local CAPD, provision using OK CLI, operate with BYOH, Console and Observability, and extend with AI and developer workspaces. Security First applies throughout. Each stage has independent prerequisites.</desc>
