name: AI Security P0 synthetic contract checks

on:
  pull_request:
    paths:
      - "architecture/security/ai-security-agent/**"
      - ".github/workflows/ai-security-p0.yml"
  push:
    branches: [main]
    paths:
      - "architecture/security/ai-security-agent/**"
      - ".github/workflows/ai-security-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-assessor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python syntax and deterministic offline fixtures
        working-directory: architecture/security/ai-security-agent/p0
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m compileall -q offline_assessor.py test_offline_assessor.py test_hardening.py isolation_probe.py
          python -m unittest discover -v -p 'test_*.py'
      - name: Explain evidence boundaries
        run: |
          echo "Only synthetic P0 fixture behavior is tested."
          echo "No OS sandbox/namespace proof, Kubernetes control PASS, or live profile approval is implied."
