# Run the ADR-021 contract suites unattended (OK-89).
# A conformance suite that only ever runs on a developer's machine is a claim,
# not a guarantee: the drift this suite exists to catch is exactly the kind that
# appears while a branch waits for review.
name: verify-platform-diagnostics

on:
  push:
    branches: [main]
    paths:
      - "platform/ai/platform-diagnostics/**"
      - ".github/workflows/verify-platform-diagnostics.yaml"
  pull_request:
    paths:
      - "platform/ai/platform-diagnostics/**"
      - ".github/workflows/verify-platform-diagnostics.yaml"

jobs:
  contract:
    name: contract suite (all registered providers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tests 1-3 and 5-6 run against every provider in the registry; test 4
      # compares them against one another. Then the Profile A facade tests,
      # including the diff of its generated OpenAPI document against the
      # normative contract.
      - name: ADR-021 contract and facade conformance
        run: make -C platform/ai/platform-diagnostics verify

  adapter:
    name: MCP adapter derived from the contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # generate-check fails when the committed adapter no longer matches what
      # the normative contract generates, and the generator refuses a spec whose
      # info.version it was not built for.
      - name: Adapter generation drift and tests
        run: make -C platform/ai/platform-diagnostics/contract/mcp-adapter verify
