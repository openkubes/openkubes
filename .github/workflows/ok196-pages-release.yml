name: OK-196 GitHub Pages MkDocs release (manual only)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate only; do not publish (recommended)'
        required: true
        type: boolean
        default: true
      expected_sha:
        description: 'Full SHA of reviewed main commit'
        required: false
        type: string
        default: ''
      release_confirmation:
        description: 'For live publication type PUBLISH_OPENKUBES_ORG; leave blank for dry run'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ok196-github-pages-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed revision
        if: ${{ inputs.dry_run == false }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check legacy Pages rollback baseline
        run: bash website/scripts/check-legacy-rollback.sh
      - name: Checkout pinned ok-cluster docs
        uses: actions/checkout@v4
        with:
          repository: openkubes/ok-cluster
          ref: e73de4f4c4e7b421785ded992881a6074005c6bd
          path: .ok196-sources/ok-cluster
          persist-credentials: false
      - name: Checkout pinned BYOH guide
        uses: actions/checkout@v4
        with:
          repository: openkubes/ok-baremetal-byoh
          ref: 562f7e4cbaee6cdf935a17107e9bfce75b9d8d46
          path: .ok196-sources/ok-baremetal-byoh
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MkDocs dependencies
        run: pip install -r website/requirements-mkdocs.txt
      - name: Build and validate GitHub Pages candidate
        run: bash website/scripts/build-github-pages.sh
      - name: Preserve reviewed production candidate
        uses: actions/upload-artifact@v4
        with:
          name: ok196-pages-candidate-${{ github.sha }}
          path: .mkdocs-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    # Manual approval has three independent controls:
    # 1. workflow_dispatch with dry_run explicitly switched off
    # 2. exact confirmation phrase and a release-enable repository variable
    # 3. github-pages environment branch restriction to main (reviewers optional)
    # Never enabled by a regular commit or pull request.
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false && inputs.release_confirmation == 'PUBLISH_OPENKUBES_ORG' && vars.OK196_PAGES_RELEASE_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download exact validated candidate from this run
        uses: actions/download-artifact@v4
        with:
          name: ok196-pages-candidate-${{ github.sha }}
          path: .mkdocs-site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .mkdocs-site
      # GitHub's Pages deployment lookup can briefly lag behind a successful
      # upload-pages-artifact step (upstream actions/deploy-pages#451).
      # Do not call deploy-pages until the exact run's artifact is visible.
      - name: Wait for GitHub Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          found=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${artifact_api}" | jq -e \
                'any(.artifacts[]?; .name == "github-pages" and .expired == false)' >/dev/null; then
              found=true
              break
            fi
            echo "Pages artifact not yet indexed (attempt ${attempt}/20)."
            sleep 3
          done
          if test "${found}" != true; then
            echo "::error::Pages artifact was not visible in this run; refusing deployment."
            exit 1
          fi
          # Allow the Pages-specific lookup backend to catch up as well.
          sleep 15
      - name: Publish to existing GitHub Pages hosting
        id: deployment
        uses: actions/deploy-pages@v4
