{% extends "base.html" %}
{% block header %}
  {{ super() }}
  <nav class="ok-global-nav ok-global-nav--material" aria-label="OpenKubes primary navigation">
    <div class="ok-global-nav__inner">
      <a class="ok-global-nav__brand ok-global-nav__brand--text" href="/" aria-label="OpenKubes Home">OpenKubes</a>
      <div class="ok-global-nav__links">
        <a href="/">Home</a>
        <a href="/features/">Features</a>
        <a href="/architecture/">Architecture</a>
        <a href="/blog/">Blog</a>
        <a href="/docs/">Docs</a>
        <a href="/community/">Community</a>
      </div>
    </div>
  </nav>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    /* Preview-only widget: production does not fetch CSS/JS or render a button. */
    (function () {
      if (window.location.hostname !== "preview.openkubes.org") return;
      var stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = "{{ 'assets/ok-ai-floating-demo.css' | url }}";
      document.head.appendChild(stylesheet);
      var script = document.createElement("script");
      script.src = "{{ 'assets/ok-ai-floating-demo.js' | url }}";
      script.defer = true;
      document.body.appendChild(script);
    })();
  </script>
{% endblock %}
