<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">How OpenKubes OK CLI works with the management cluster</title>
<desc id="desc">The OK CLI runs locally. Cluster plan validates a ClusterRequest locally without contacting Kubernetes. The ok up command uses an explicitly selected management kubeconfig to interact with the management cluster API, where Cluster API and KubeVirt create a Talos workload cluster. The workload kubeconfig is written locally.</desc>
