<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="okTitle okDesc">
<title id="okTitle">Beyond Human-in-the-Loop — Policy-Bounded Autonomy</title>
<desc id="okDesc">OpenKubes research architecture. The current agent-originated mutation path requires exact human review following trusted canonicalization, then independent policy authorization, bounded execution, conditional authority acceptance and controller-owned reconciliation with independent evidence. A dashed future HOTL standing mandate remains research only and requires a new ADR. Revocation, risk budgets, owner fencing and restore-safe authority are requirements requiring profile-specific proof, not deployed guarantees.</desc>
<defs><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#4779b8"/></marker><marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#d97706"/></marker></defs>
