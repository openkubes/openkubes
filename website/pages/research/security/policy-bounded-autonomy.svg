<text x="74" y="213" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Protected review of the exact canonical transition</text>
<rect x="798" y="156" width="745" height="92" rx="10" fill="#fff8ed" stroke="#edbc77" stroke-width="2"/>
<text x="816" y="185" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">FUTURE HOTL · REQUIRES NEW ADR</text>
<text x="816" y="213" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Revocable standing mandate: eligibility, not execution authority</text>
<rect x="34" y="292" width="350" height="558" rx="14" fill="#f5f9ff" stroke="#a4c5f0" stroke-width="2"/>
<text x="53" y="325" fill="#17396b" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750">02  UNTRUSTED AUTHORING</text>
<rect x="53" y="350" width="310" height="148" rx="10" fill="#f0f7ff" stroke="#97c0f2" stroke-width="2"/>
<text x="71" y="379" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Agent / Kubernautic</text>
<text x="71" y="407" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Scoped read-only diagnosis</text>
<text x="71" y="430" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Untrusted candidate proposal</text>
<text x="71" y="453" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">NO mutation authority</text>
<rect x="53" y="518" width="310" height="118" rx="10" fill="#f0f7ff" stroke="#97c0f2" stroke-width="2"/>
<text x="71" y="547" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">MCP / CMCP interface</text>
<text x="71" y="575" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Optional adapter; not an</text>
<text x="71" y="598" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">approval or policy engine</text>
<rect x="53" y="655" width="310" height="160" rx="10" fill="#f0f7ff" stroke="#97c0f2" stroke-width="2"/>
<text x="71" y="684" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Isolation and test gates</text>
<text x="71" y="712" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">No shared tool-SA write bypass</text>
<text x="71" y="735" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Identity and tenant provenance</text>
<text x="71" y="758" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">No agent-controlled triggers</text>
<rect x="411" y="292" width="752" height="558" rx="14" fill="#f2fcf9" stroke="#72cfc2" stroke-width="2"/>
<text x="433" y="325" fill="#087c71" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750">03  TRUSTED OPENKUBES BOUNDARY</text>
<rect x="432" y="342" width="710" height="78" rx="10" fill="#eafaf6" stroke="#74cabc" stroke-width="2"/>
<text x="450" y="371" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Trusted intake and canonicalization</text>
<text x="450" y="399" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Provenance · exact transition · immutable reviewed artifact</text>
<rect x="432" y="435" width="710" height="79" rx="10" fill="#eafaf6" stroke="#74cabc" stroke-width="2"/>
<text x="450" y="464" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Protected exact human review</text>
<text x="450" y="492" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Digest binding · renderer and canonicalization profile version</text>
<rect x="432" y="529" width="710" height="77" rx="10" fill="#eafaf6" stroke="#74cabc" stroke-width="2"/>
<text x="450" y="558" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Independent Policy Authority + single-use grant</text>
<text x="450" y="586" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Identity, scope, valid review, risk budget reservation</text>
<rect x="432" y="621" width="710" height="79" rx="10" fill="#eafaf6" stroke="#74cabc" stroke-width="2"/>
<text x="450" y="650" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Contract Executor + field-level enforcement</text>
<text x="450" y="678" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Durable claim · typed operation · forbidden-field denial</text>
<rect x="432" y="716" width="710" height="100" rx="10" fill="#eafaf6" stroke="#74cabc" stroke-width="2"/>
<text x="450" y="745" fill="#102b4c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Authority Profile · conditional acceptance</text>
<text x="450" y="773" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Atomic acceptance CAS, not atomic end-to-end pipeline</text>
<text x="450" y="796" fill="#405573" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Revocation/owner ordering must be independently proven</text>
