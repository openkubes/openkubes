<rect x="230" y="817" width="534" height="125" rx="14" fill="#f0fbf6" stroke="#7bcdbf" stroke-width="2"/>
<text x="252" y="856" font-size="21" font-weight="750" fill="#087a67" font-family="Inter,Arial,Helvetica,sans-serif">04  CONTRACT EXECUTOR</text>
<text x="252" y="887" font-size="16" font-weight="400" fill="#47627b" font-family="Inter,Arial,Helvetica,sans-serif">Verified grant · typed mutations · field-level denial</text>
<text x="252" y="912" font-size="16" font-weight="400" fill="#47627b" font-family="Inter,Arial,Helvetica,sans-serif">No direct agent write credentials</text>
<rect x="830" y="817" width="540" height="125" rx="14" fill="#f2f7ff" stroke="#9abbed" stroke-width="2"/>
<text x="852" y="856" font-size="21" font-weight="750" fill="#214a77" font-family="Inter,Arial,Helvetica,sans-serif">05  KUBERNETES CONTROLLERS</text>
<text x="852" y="887" font-size="16" font-weight="400" fill="#47627b" font-family="Inter,Arial,Helvetica,sans-serif">Reconcile accepted desired state</text>
<text x="852" y="912" font-size="16" font-weight="400" fill="#47627b" font-family="Inter,Arial,Helvetica,sans-serif">CAPI · BYOH · GitOps · Workload controllers</text>
<path d="M766 875 H821" fill="none" stroke="#4f7eb1" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1098 944 V971" fill="none" stroke="#4f7eb1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="230" y="977" width="1140" height="74" rx="14" fill="#faf6ff" stroke="#bea9ec" stroke-width="2"/>
<text x="254" y="1008" font-size="21" font-weight="750" fill="#70479c" font-family="Inter,Arial,Helvetica,sans-serif">06  INDEPENDENT EVIDENCE &amp; RECOVERY</text>
<text x="254" y="1034" font-size="16" font-weight="400" fill="#52647f" font-family="Inter,Arial,Helvetica,sans-serif">Decision ≠ acceptance ≠ convergence · bounded rollback / recovery · real-world outcome verification</text>
<text x="52" y="1071" font-size="15" font-weight="400" fill="#415976" font-family="Inter,Arial,Helvetica,sans-serif">HITL and HOTL describe human supervision; policy-bounded authority is enforced outside every agent.</text>
</svg>
