<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 402" role="img" aria-labelledby="title desc">
<title id="title">One Framework. Multiple Platform Capabilities.</title><desc id="desc">CLI, Console and AI sit above capability contracts for ownership, authorization, reconciliation and evidence. Cluster lifecycle, observability and developer workspaces span BYOH, vCluster, VNC and hosted control plane models, with Security First as the foundation. Conceptual model, not an implementation or readiness claim.</desc>
