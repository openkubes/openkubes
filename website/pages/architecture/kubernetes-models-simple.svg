<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" role="img" aria-labelledby="models-title models-description">
<title id="models-title">Four Kubernetes models — different control planes and worker boundaries</title>
<desc id="models-description">Simplified visual comparison: Classic CAPI/BYOH has a dedicated control plane and its own workers; shared-node vCluster uses a virtual control plane with host workers; VNC/KubeVirt provides a guest control plane and guest worker VMs on a KubeVirt host; Hosted Control Planes separate hosted management from worker machines and remain an evaluation direction.</desc>
